# Local checks for the Talos GitOps repo.
#
# ArgoCD applies whatever lands on main, so these hooks are the last thing
# between a broken manifest and the cluster. They mirror what
# .github/workflows/argocd-lint.yml enforces, minus kubeconform (which needs
# to fetch CRD schemas and is therefore left to CI).
#
# Install once:  make hooks
# Run manually:  make lint      (hooks only)
#                make preflight (hooks + kube-linter + kustomize builds)
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-json
        # devcontainer.json is JSONC by spec — the format allows the
        # comments explaining each feature, which a strict JSON parser
        # will not accept.
        exclude: ^\.devcontainer/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # Kargo rewrites these on every promotion (kustomize-set-image) and
        # writes kyaml's indentless list style. Reformatting them here only
        # produces a diff that the next promotion flips straight back, so the
        # working tree is never clean. The exclusion lives here rather than in
        # .yamlfmt because yamlfmt ignores its own `exclude` list when the
        # files are handed to it as arguments, which is what pre-commit does.
        exclude: ^eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme/overlays/[^/]+/kustomization\.yaml$

  # shellcheck-py, not the upstream shellcheck repo: it ships the binary in a
  # wheel, so the hook needs no Docker daemon.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt-src
        args: [-i, "2", -ci]

  # Secrets belong in OpenBao, reached through External Secrets. This is the
  # backstop for a value pasted straight into a manifest.
  # Workflow linting. actionlint checks schema, expressions and the shell in
  # `run:` blocks (using the pinned shellcheck); zizmor audits for CI/CD
  # security patterns. That second one earns its place here: this repo runs a
  # pull_request_target workflow with write permissions, which is exactly the
  # shape zizmor exists to keep honest.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor
        # Ignores (with reasons) live in .github/zizmor.yml.
        args: [--no-progress, --config, .github/zizmor.yml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # A base or overlay that does not build is a manifest ArgoCD cannot
      # sync. Cheap enough to run on every touch of the Kustomize tree.
      - id: kustomize-build
        name: kustomize build (overlays + bases)
        entry: scripts/kustomize-build.sh
        language: script
        files: ^eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme/
        pass_filenames: false

      - id: kube-linter
        name: kube-linter (workload best practices)
        entry: scripts/kube-lint.sh
        language: script
        files: ^eggenberg-talos-cluster-1/.*\.ya?ml$
        pass_filenames: false
