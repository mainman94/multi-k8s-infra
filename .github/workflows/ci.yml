name: CI

# argocd-lint.yml covers schema and security scanning. This one runs the
# repo's own hooks, which is where the kustomize builds live — a base or
# overlay that does not build is a manifest ArgoCD cannot sync, and nothing
# in CI checked that before.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # kubectl (which carries kustomize), kube-linter, python, pre-commit,
      # actionlint and shellcheck, all at the versions in mise.toml — the same
      # file the dev container installs from. These used to be pinned in this
      # workflow while the dev container installed `latest`.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every hook
        run: pre-commit run --all-files --show-diff-on-failure
