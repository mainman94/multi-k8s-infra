name: Validate Kubernetes Manifests
# Every job here only reads the checkout; none post results or upload SARIF.
permissions:
  contents: read
# No path filter. These three are about to become required status checks on
# main (the homelab repo's github stack sets them), and a required check that
# does not run on a given pull request never reports — which blocks that pull
# request for good. A PR touching only the Makefile, a script or a README
# would be exactly that case. The three jobs take about twenty seconds.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kubeconform:
    name: Schema Validation (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      # The flags live in the script, so `make kubeconform` and this job
      # cannot drift apart. It runs -strict and without
      # -ignore-missing-schemas: an unknown kind is now a failure, not a
      # silent pass.
      - name: Run kubeconform
        run: scripts/kubeconform.sh

  kube-linter:
    name: Best Practices (kube-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1
        with:
          directory: .
          config: .kube-linter.yaml

  checkov:
    name: Security Scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12
        with:
          directory: .
          framework: kubernetes
          quiet: true
          soft_fail: true
