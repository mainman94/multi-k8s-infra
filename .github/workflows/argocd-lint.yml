name: Validate Kubernetes Manifests
permissions: read-all
on:
  pull_request:
    paths:
      - "**/*.yaml"
      - "**/*.yml"
  push:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
  workflow_dispatch:

jobs:
  kubeconform:
    name: Schema Validation (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Run kubeconform
        run: |
          find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
            -not -path './.github/*' \
            -not -name 'values.yaml' \
            -not -name '.kube-linter.yaml' \
            -not -name '.pre-commit-config.yaml' \
            -print0 | xargs -0 kubeconform \
              -verbose \
              -ignore-missing-schemas \
              -skip InfisicalSecret,Warehouse \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  kube-linter:
    name: Best Practices (kube-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: .
          config: .kube-linter.yaml

  checkov:
    name: Security Scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes
          quiet: true
          soft_fail: true
