name: Validate Kubernetes Manifests
# Every job here only reads the checkout; none post results or upload SARIF.
permissions:
  contents: read
# No path filter. All four jobs are required status checks on main (the
# homelab repo's github stack sets them), and a required check that
# does not run on a given pull request never reports — which blocks that pull
# request for good. A PR touching only the Makefile, a script or a README
# would be exactly that case.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kubeconform:
    name: Schema Validation (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5

      # The flags live in the script, so `make kubeconform` and this job
      # cannot drift apart. It runs -strict and without
      # -ignore-missing-schemas: an unknown kind is now a failure, not a
      # silent pass.
      - name: Run kubeconform
        run: scripts/kubeconform.sh

  kube-linter:
    name: Best Practices (kube-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5

      # Same script and pinned version as pre-commit and `make kube-lint`.
      - name: Run kube-linter
        run: scripts/kube-lint.sh

  checkov:
    name: Security Scan (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run checkov
        uses: bridgecrewio/checkov-action@a32f8b5c5c7c958bc38947c65dfe139debaf0607 # v12
        with:
          directory: .
          framework: kubernetes
          config_file: .checkov.yaml
          quiet: true
