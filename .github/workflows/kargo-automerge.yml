name: Kargo promotion auto-merge

# Kargo cannot push to main (the ruleset requires a pull request and four
# status checks), so each promotion opens a PR from a kargo/<stage>/<promotion>
# branch. This enables auto-merge on it, so GitHub merges it as soon as the
# required checks pass, and Kargo's git-wait-for-pr step carries on.
#
# Plain pull_request, not pull_request_target: the head branch must live in this
# repository, so the token is the normal write-capable one for same-repo PRs and
# the workflow never runs untrusted code (it only calls the API).

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge for Kargo promotions
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'kargo/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Base commit, not the PR head: the gate code must come from main, so a
      # kargo/ PR cannot rewrite the rules that judge it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Promotions only touch the image tags in a stage's chart values file and
      # the chart targetRevision in its Application manifest. The Application
      # may change nothing but that line. Anything else in a kargo/ branch needs
      # a human, so it is left alone (the PR stays open and Kargo times out).
      - name: Check that only promotion files changed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const gate = require("./.github/scripts/merge-gate.js");
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const rejected = gate.kargoRejects(files);
            if (rejected) core.setFailed(`not a plain promotion: ${rejected}`);

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      # Auto-merge set by an earlier, clean push stays on after a bad push.
      # This job is not a required check, so switch it off explicitly.
      - name: Disable auto-merge on a failed check
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --disable-auto "$PR_URL" || echo "auto-merge was not enabled"
