name: Renovate AI Auto-Merge Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate-and-automerge:
    # SECURITY: pull_request_target runs with write perms + secrets. Require the
    # PR branch to live in THIS repo (not a fork) — only a writer can push a
    # renovate/ branch here, so a fork PR can't spoof the branch name to get
    # auto-merged. Renovate (github-hosted app or self-hosted) pushes branches
    # into the repo, so its real PRs still qualify.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == 'renovate[bot]' ||
       startsWith(github.event.pull_request.head.ref, 'renovate/'))
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate PR risk (rules + AI)
        id: evaluate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
          AI_REQUIRE_RELEASE_NOTES: ${{ vars.AI_REQUIRE_RELEASE_NOTES || 'true' }}
          AI_MAX_DOC_URLS: ${{ vars.AI_MAX_DOC_URLS || '5' }}
          # Must cover the model's reasoning tokens as well as the JSON answer.
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS || '2000' }}
          AI_MAX_DOC_CHARS: ${{ vars.AI_MAX_DOC_CHARS || '12000' }}
          # Hosts whose pages may be fetched as release notes. Subdomains are
          # included. Widen via the AI_DOC_HOSTS repo variable rather than here.
          AI_DOC_HOSTS: >-
            ${{ vars.AI_DOC_HOSTS ||
            'github.com,githubusercontent.com,gitlab.com,artifacthub.io,kubernetes.io,cncf.io' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4.1-mini' }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const requireReleaseNotes = (process.env.AI_REQUIRE_RELEASE_NOTES || "true").toLowerCase() === "true";
            const maxTokens = Number(process.env.AI_MAX_TOKENS || "2000");
            const maxDocUrls = Number(process.env.AI_MAX_DOC_URLS || "5");
            const maxDocChars = Number(process.env.AI_MAX_DOC_CHARS || "12000");

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const changedPaths = files.map((f) => f.filename);
            const badExt = changedPaths.filter((p) => !p.endsWith(".yaml") && !p.endsWith(".yml"));
            // .pre-commit-config.yaml passes the YAML-only check above but pins
            // hooks that execute arbitrary code in CI, so a bump there is the
            // same class of change as a workflow edit, not a manifest bump.
            const forbiddenPaths = changedPaths.filter((p) =>
              p.startsWith(".github/") ||
              p === ".pre-commit-config.yaml" ||
              p.endsWith(".md") ||
              p.endsWith(".sh") ||
              p.endsWith(".json") ||
              p.endsWith(".tf")
            );
            const tooManyFiles = files.length > 30;

            // Hard gate: only manifest-like YAML updates from Renovate.
            if (badExt.length || forbiddenPaths.length || tooManyFiles) {
              const reason = [
                badExt.length ? `non-yaml files: ${badExt.join(", ")}` : "",
                forbiddenPaths.length ? `forbidden paths: ${forbiddenPaths.join(", ")}` : "",
                tooManyFiles ? `too many changed files: ${files.length}` : ""
              ].filter(Boolean).join(" | ");
              core.setOutput("decision", "manual");
              core.setOutput("reason", `Hard gate failed: ${reason}`);
              core.setOutput("risk", "n/a");
              core.setOutput("hard_gate", "failed");
              core.setOutput("docs_reviewed", "0");
              core.setOutput("docs_urls", "");
              return;
            }

            const patchText = files
              .map((f) => `FILE: ${f.filename}\n${f.patch || ""}`)
              .join("\n\n---\n\n")
              .slice(0, 50000);
            const diffLines = files
              .flatMap((f) => (f.patch || "").split("\n"))
              .filter((line) =>
                (line.startsWith("+") || line.startsWith("-")) &&
                !line.startsWith("+++") &&
                !line.startsWith("---")
              );
            const versionLinePatterns = [
              /^[+-]\s*-?\s*(version|appversion|tag|imagetag|targetrevision|digest)\s*:\s*["']?[^"'\s]+["']?\s*$/i,
              /^[+-]\s*image\s*:\s*[^"'\s]+:[^"'\s]+["']?\s*$/i
            ];
            const riskyChangePattern = /(clusterrole|clusterrolebinding|rolebinding|serviceaccount|networkpolicy|ingress|hostnetwork|privileged|allowprivilegeescalation|capabilities|securitycontext|runasuser|runasnonroot|podsecurity|webhook|rbac)/i;
            const hasRiskySignals = diffLines.some((line) => riskyChangePattern.test(line.slice(1)));
            const nonVersionLines = diffLines.filter(
              (line) => !versionLinePatterns.some((pattern) => pattern.test(line))
            );
            const onlyVersionBumps = diffLines.length > 0 && nonVersionLines.length === 0 && !hasRiskySignals;

            // These URLs come out of the PR body, so they are attacker-chosen text
            // as far as this job is concerned, and the job fetches them from a
            // runner holding this workflow's secrets. Restrict them to hosts that
            // actually publish release notes so the body cannot aim the fetch at
            // an arbitrary endpoint.
            const allowedDocHosts = (process.env.AI_DOC_HOSTS || "")
              .split(",")
              .map((h) => h.trim().toLowerCase())
              .filter(Boolean);
            function isAllowedDocUrl(candidate) {
              try {
                const parsed = new URL(candidate);
                if (parsed.protocol !== "https:") return false;
                const host = parsed.hostname.toLowerCase();
                return allowedDocHosts.some((allowed) => host === allowed || host.endsWith(`.${allowed}`));
              } catch {
                return false;
              }
            }

            // Pull release notes / docs links from PR body (Renovate usually includes these).
            const body = pr.body || "";
            const urlMatches = body.match(/https?:\/\/[^\s)\]>"]+/g) || [];
            const candidateUrls = [...new Set(
              // Trailing sentence punctuation is not part of the URL and makes the
              // fetch 404 on links Renovate writes mid-sentence.
              urlMatches.map((u) => u.replace(/[.,;:]+$/, ""))
            )];
            const docUrls = candidateUrls.filter(isAllowedDocUrl).slice(0, maxDocUrls);
            const rejectedUrls = candidateUrls.filter((u) => !isAllowedDocUrl(u));
            if (rejectedUrls.length) {
              core.info(`Ignored ${rejectedUrls.length} PR-body link(s) outside AI_DOC_HOSTS: ${rejectedUrls.join(", ")}`);
            }

            async function fetchDocSnippet(url) {
              try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 6000);
                const res = await fetch(url, { signal: controller.signal, redirect: "follow" });
                clearTimeout(timeout);
                if (!res.ok) return null;
                const resolvedUrl = res.url || url;
                // redirect: "follow" can land off-host, so the final URL has to
                // clear the same allowlist as the one we started with.
                if (!isAllowedDocUrl(resolvedUrl)) {
                  core.info(`Ignored doc redirect to disallowed host: ${resolvedUrl}`);
                  return null;
                }
                const ctype = (res.headers.get("content-type") || "").toLowerCase();
                const declaredLength = Number(res.headers.get("content-length") || "0");
                if (declaredLength > 5_000_000) return null;
                let text = await res.text();
                if (ctype.includes("text/html")) {
                  text = text
                    .replace(/<script[\s\S]*?<\/script>/gi, " ")
                    .replace(/<style[\s\S]*?<\/style>/gi, " ")
                    .replace(/<[^>]+>/g, " ");
                }
                text = text.replace(/\s+/g, " ").trim().slice(0, maxDocChars);
                if (!text) return null;
                return { url: resolvedUrl, originalUrl: url, snippet: text };
              } catch {
                return null;
              }
            }

            const docSnippets = [];
            for (const url of docUrls) {
              const doc = await fetchDocSnippet(url);
              if (doc) {
                docSnippets.push(doc);
              }
            }

            if (requireReleaseNotes && docSnippets.length === 0) {
              core.setOutput("decision", "manual");
              core.setOutput("reason", "No readable release notes/docs found in PR body links");
              core.setOutput("risk", "n/a");
              core.setOutput("hard_gate", "passed");
              core.setOutput("docs_reviewed", "0");
              core.setOutput("docs_urls", docUrls.join("\n"));
              await core.summary
                .addHeading("Renovate AI Decision")
                .addTable([
                  [{ data: "Decision", header: true }, "manual"],
                  [{ data: "Hard gate", header: true }, "passed"],
                  [{ data: "Docs required", header: true }, "true"],
                  [{ data: "Docs reviewed", header: true }, "0"]
                ])
                .addRaw("Reason: No readable release notes/docs found in PR body links")
                .write();
              return;
            }

            const provider = (process.env.AI_PROVIDER || "openai").toLowerCase();
            const openaiKey = process.env.OPENAI_API_KEY;
            const openrouterKey = process.env.OPENROUTER_API_KEY;

            // Optional AI step. If key is missing, fallback to manual for safety.
            if (provider === "openai" && !openaiKey) {
              core.setOutput("decision", "manual");
              core.setOutput("reason", "OPENAI_API_KEY missing");
              core.setOutput("risk", "n/a");
              core.setOutput("hard_gate", "passed");
              core.setOutput("docs_reviewed", String(docSnippets.length));
              core.setOutput("docs_urls", [...new Set(docSnippets.map((d) => d.url))].join("\n"));
              return;
            }
            if (provider === "openrouter" && !openrouterKey) {
              core.setOutput("decision", "manual");
              core.setOutput("reason", "OPENROUTER_API_KEY missing");
              core.setOutput("risk", "n/a");
              core.setOutput("hard_gate", "passed");
              core.setOutput("docs_reviewed", String(docSnippets.length));
              core.setOutput("docs_urls", [...new Set(docSnippets.map((d) => d.url))].join("\n"));
              return;
            }
            if (provider !== "openai" && provider !== "openrouter") {
              core.setOutput("decision", "manual");
              core.setOutput("reason", `Unsupported AI_PROVIDER: ${provider}`);
              core.setOutput("risk", "n/a");
              core.setOutput("hard_gate", "passed");
              core.setOutput("docs_reviewed", String(docSnippets.length));
              core.setOutput("docs_urls", [...new Set(docSnippets.map((d) => d.url))].join("\n"));
              return;
            }

            const prompt = `
            You are reviewing a Renovate pull request for Kubernetes GitOps manifests.
            Classify risk as one of: low, medium, high.

            low = only straightforward dependency/chart/image version bumps with no semantic config change.
            medium = unclear impact, mixed changes, or broader value changes.
            high = security-sensitive, privilege/network policy/ingress/auth/rbac changes, removals, or major behavioral shifts.

            Use BOTH sources:
            1) Git diff itself
            2) Provided release notes / docs snippets

            Return strict JSON:
            {"risk":"low|medium|high","summary":"short reason","flags":["..."]}
            `;
            const docContext = docSnippets
              .map((d, idx) => `DOC_${idx + 1}: ${d.url}\n${d.snippet}`)
              .join("\n\n---\n\n")
              .slice(0, 30000);
            const userContext = [
              `PR_TITLE: ${pr.title || ""}`,
              `PR_BODY: ${(pr.body || "").slice(0, 8000)}`,
              `PATCHES:\n${patchText}`,
              `DOCS:\n${docContext || "none"}`
            ].join("\n\n");

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let response = null;
            let failureStatus = "request_error";
            let failureBody = "";
            let usedProvider = provider;
            let usedModel = provider === "openrouter"
              ? (process.env.OPENROUTER_MODEL || "openai/gpt-4.1-mini")
              : (process.env.OPENAI_MODEL || "gpt-4.1-mini");
            const providerConfigs = provider === "openrouter" && openaiKey
              ? ["openrouter", "openai"]
              : [provider];

            for (const currentProvider of providerConfigs) {
              const endpoint = currentProvider === "openrouter"
                ? "https://openrouter.ai/api/v1/chat/completions"
                : "https://api.openai.com/v1/chat/completions";
              const model = currentProvider === "openrouter"
                ? (process.env.OPENROUTER_MODEL || "openai/gpt-4.1-mini")
                : (process.env.OPENAI_MODEL || "gpt-4.1-mini");
              const headers = {
                "Authorization": `Bearer ${currentProvider === "openrouter" ? openrouterKey : openaiKey}`,
                "Content-Type": "application/json"
              };
              if (currentProvider === "openrouter") {
                headers["HTTP-Referer"] = `https://github.com/${owner}/${repo}`;
                headers["X-OpenRouter-Title"] = `${owner}/${repo} renovate-ai-automerge`;
              }

              // Reasoning models spend output tokens on their chain of thought
              // before emitting an answer, and OpenRouter bills/counts those as
              // output tokens. The old 300-token ceiling truncated them mid
              // reasoning, so the JSON was never reached and every PR fell
              // through to the heuristic. Budget for reasoning plus the answer.
              const requestPayload = {
                model,
                temperature: 0,
                max_tokens: maxTokens,
                messages: [
                  { role: "system", content: prompt },
                  { role: "user", content: userContext }
                ]
              };
              requestPayload.response_format = { type: "json_object" };
              if (currentProvider === "openrouter") {
                // Keep the chain of thought out of message.content; we only
                // parse the answer, and some providers leak reasoning into it.
                requestPayload.reasoning = { exclude: true };
              }
              const requestBody = JSON.stringify(requestPayload);

              for (let attempt = 1; attempt <= 3; attempt++) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 30000);
                try {
                  response = await fetch(endpoint, {
                    method: "POST",
                    headers,
                    signal: controller.signal,
                    body: requestBody
                  });
                } catch (err) {
                  clearTimeout(timeout);
                  failureStatus = `${currentProvider}:network_error`;
                  failureBody = String(err);
                  if (attempt < 3) {
                    await sleep(750 * attempt);
                    continue;
                  }
                  break;
                }
                clearTimeout(timeout);
                if (response.ok) {
                  usedProvider = currentProvider;
                  usedModel = model;
                  break;
                }

                failureStatus = `${currentProvider}:${String(response.status)}`;
                failureBody = await response.text();
                const retryable = response.status === 429 || response.status >= 500;
                if (retryable && attempt < 3) {
                  await sleep(750 * attempt);
                  continue;
                }
                break;
              }
              if (response && response.ok) break;
            }

            if (!response || !response.ok) {
              let failureDetails = failureBody;
              try {
                const parsedError = JSON.parse(failureBody);
                const providerName = parsedError?.error?.metadata?.provider_name;
                const message = parsedError?.error?.message;
                if (providerName || message) {
                  failureDetails = `${providerName ? `provider=${providerName}; ` : ""}${message || ""}`.trim();
                }
              } catch {}
              core.setOutput("decision", "manual");
              core.setOutput("reason", `AI call failed: ${failureStatus} ${failureDetails.slice(0, 300)}`);
              core.setOutput("risk", "n/a");
              core.setOutput("hard_gate", "passed");
              core.setOutput("docs_reviewed", String(docSnippets.length));
              core.setOutput("docs_urls", [...new Set(docSnippets.map((d) => d.url))].join("\n"));
              return;
            }

            const data = await response.json();
            const outputText = data?.choices?.[0]?.message?.content || "";

            // A truncated response is indistinguishable from prose once parsing
            // fails, which reads as "the model ignored the JSON instruction"
            // and sends you looking in the wrong place. Name it directly.
            if (data?.choices?.[0]?.finish_reason === "length") {
              core.setOutput("decision", "manual");
              core.setOutput("reason", `AI response truncated at max_tokens=${maxTokens} (finish_reason=length); raise the AI_MAX_TOKENS variable`);
              core.setOutput("risk", "n/a");
              core.setOutput("hard_gate", "passed");
              core.setOutput("docs_reviewed", String(docSnippets.length));
              core.setOutput("docs_urls", [...new Set(docSnippets.map((d) => d.url))].join("\n"));
              return;
            }
            const parseCandidates = [];
            const trimmedOutput = outputText.trim();
            if (trimmedOutput) parseCandidates.push(trimmedOutput);
            const fenceMatch = trimmedOutput.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
            if (fenceMatch?.[1]) parseCandidates.push(fenceMatch[1].trim());
            const firstBrace = trimmedOutput.indexOf("{");
            const lastBrace = trimmedOutput.lastIndexOf("}");
            if (firstBrace >= 0 && lastBrace > firstBrace) {
              parseCandidates.push(trimmedOutput.slice(firstBrace, lastBrace + 1));
            }

            let parsed = null;
            let parseError = "";
            for (const candidate of parseCandidates) {
              try {
                parsed = JSON.parse(candidate);
                break;
              } catch (e) {
                parseError = String(e);
              }
            }

            if (!parsed) {
              const lower = trimmedOutput.toLowerCase();
              let inferredRisk = "medium";
              if (onlyVersionBumps) inferredRisk = "low";
              else if (/\bhigh risk\b|\brisk[:=\s-]*high\b/.test(lower)) inferredRisk = "high";
              else if (/\blow risk\b|\brisk[:=\s-]*low\b/.test(lower)) inferredRisk = "low";
              else if (/\bmedium risk\b|\brisk[:=\s-]*medium\b/.test(lower)) inferredRisk = "medium";

              const fallbackSummary = trimmedOutput
                ? `Non-JSON AI output parsed heuristically: ${trimmedOutput.slice(0, 180)}`
                : "Non-JSON AI output parsed heuristically";
              const summary = onlyVersionBumps
                ? "Non-JSON AI output; deterministic diff check found version-only changes"
                : fallbackSummary;
              const flags = ["non_json_ai_output"];
              if (onlyVersionBumps) flags.push("version_only_diff");
              parsed = { risk: inferredRisk, summary, flags };
              core.warning(`AI parse fallback used. parse_error=${parseError}`);
            }

            const risk = parsed.risk || "medium";
            const summary = parsed.summary || "No summary";
            const flags = Array.isArray(parsed.flags) ? parsed.flags : [];
            // A heuristic risk guessed from the diff is not an AI review. Merging
            // on it would auto-merge exactly the PRs where the model failed to
            // answer, so an unparseable response always goes to manual.
            const aiAnswered = !flags.includes("non_json_ai_output");
            const decision = risk === "low" && aiAnswered ? "automerge" : "manual";
            core.setOutput("reason", `AI risk=${risk}; ${summary}${flags.length ? `; flags=${flags.join(", ")}` : ""}`);
            core.setOutput("risk", risk);
            core.setOutput("hard_gate", "passed");
            core.setOutput("docs_reviewed", String(docSnippets.length));
            core.setOutput("docs_urls", [...new Set(docSnippets.map((d) => d.url))].join("\n"));
            core.setOutput("decision", decision);

            await core.summary
              .addHeading("Renovate AI Decision")
              .addTable([
                [{ data: "Decision", header: true }, decision],
                [{ data: "Risk", header: true }, risk],
                [{ data: "Hard gate", header: true }, "passed"],
                [{ data: "Provider/Model", header: true }, `${usedProvider}/${usedModel}`],
                [{ data: "Files changed", header: true }, String(files.length)],
                [{ data: "Docs reviewed", header: true }, String(docSnippets.length)]
              ])
              .addRaw(`Reason: ${summary}`)
              .write();

      # The evaluate step's outputs are model-written text derived from the
      # dependency's own changelog, so they are untrusted input. They go
      # through the environment rather than being interpolated into the
      # script: `${{ }}` expands before the JS is parsed, so a backtick in a
      # reason string would otherwise close the template literal and run as
      # code with this workflow's write permissions.
      - name: Comment decision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DECISION: ${{ steps.evaluate.outputs.decision }}
          REASON: ${{ steps.evaluate.outputs.reason }}
          RISK: ${{ steps.evaluate.outputs.risk }}
          HARD_GATE: ${{ steps.evaluate.outputs.hard_gate }}
          DOCS_REVIEWED: ${{ steps.evaluate.outputs.docs_reviewed }}
          DOCS_URLS: ${{ steps.evaluate.outputs.docs_urls }}
        with:
          script: |
            const decision = process.env.DECISION ?? "";
            const reason = process.env.REASON ?? "";
            const risk = process.env.RISK ?? "";
            const hardGate = process.env.HARD_GATE ?? "";
            const docsReviewed = process.env.DOCS_REVIEWED ?? "";
            const docsUrlsRaw = process.env.DOCS_URLS ?? "";
            const docsUrls = docsUrlsRaw ? docsUrlsRaw.split("\n").filter(Boolean) : [];
            const icon = decision === "automerge" ? "✅" : "🛑";
            const title = decision === "automerge" ? "AI gate passed" : "AI gate requires manual review";
            const docsList = docsUrls.length
              ? docsUrls.map((u) => `- ${u}`).join("\n")
              : "- none";
            const body = `${icon} **${title}**\n\n- Decision: \`${decision}\`\n- Risk: \`${risk}\`\n- Hard gate: \`${hardGate}\`\n- Docs reviewed: \`${docsReviewed}\`\n- Reason: ${reason}\n\n<details><summary>Reviewed docs</summary>\n\n${docsList}\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Fail on manual decision
        if: steps.evaluate.outputs.decision == 'manual'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REASON: ${{ steps.evaluate.outputs.reason }}
        with:
          script: |
            core.setFailed(`Manual review required: ${process.env.REASON ?? ""}`);

      - name: Enable auto-merge
        if: steps.evaluate.outputs.decision == 'automerge'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |-
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const prNodeId = context.payload.pull_request.node_id;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const maxAttempts = 6;
            let lastMessage = "";

            // Squash-merge now instead of queueing. Branch protection is enforced
            // server-side and GITHUB_TOKEN is not a bypass actor, so this cannot
            // merge ahead of the required checks -- it is refused until they pass.
            async function mergeNow() {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pullNumber,
                merge_method: "squash"
              });
            }

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: prNodeId }
                );
                core.info(`Auto-merge enabled (attempt ${attempt}/${maxAttempts}).`);
                return;
              } catch (err) {
                lastMessage = String(err?.message || err);

                // "clean"/"unstable status" both mean the PR is mergeable right
                // now, so there is nothing to queue and the mutation is refused.
                // The previous version warned and exited green here, which left
                // every gate-approved PR sitting unmerged.
                if (/clean status|unstable status/i.test(lastMessage)) {
                  try {
                    await mergeNow();
                    core.info(`Auto-merge not applicable (${lastMessage}); merged directly.`);
                    return;
                  } catch (mergeErr) {
                    lastMessage = `direct merge failed: ${String(mergeErr?.message || mergeErr)}`;
                  }
                } else if (!/base branch was modified|try again|timeout|502|503/i.test(lastMessage)) {
                  throw err;
                }

                if (attempt < maxAttempts) {
                  core.info(`Merge not arranged yet (attempt ${attempt}/${maxAttempts}): ${lastMessage}`);
                  await sleep(5000 * attempt);
                }
              }
            }

            // The gate approved this PR but we could not arrange the merge. Fail
            // so the red check surfaces it, rather than stranding it silently.
            core.setFailed(
              `Gate decided automerge but the merge could not be arranged after ${maxAttempts} attempts: ${lastMessage}`
            );
