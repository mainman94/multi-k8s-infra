kubeProxyReplacement: true

ipam:
  operator:
    clusterPoolIPv4PodCIDRList: "10.42.0.0/16"
  mode: kubernetes

k8sServiceHost: localhost
k8sServicePort: 7445

l7Proxy: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

loadBalancer:
  enabled: true

operator:
  replicas: 1

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

ingressController:
  enabled: false
  default: false
  loadbalancerMode: shared

authentication:
  enabled: true
  mutual:
    spire:
      enabled: true
      install:
        enabled: true
        existingNamespace: true
        server:
          # --- FIX 1: Storage aktivieren oder beschleunigen ---
          # Im Testbetrieb/Talos ohne PersistentVolume auf true lassen,
          # aber dem Pod genug Ressourcen & Zeit geben.
          dataStorage:
            enabled: true

          # --- FIX 2: Ressourcen-Requests setzen (behebt Kyverno Warnings) ---
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # --- FIX 3: Probes entspannen ---
          # Gibt SPIRE beim Starten bis zu 60s Zeit, bevor Kubelet eingreift
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 5

l2announcements:
  enabled: true

hubble:
  enabled: true

  relay:
    enabled: true

  ui:
    enabled: true

  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http

prometheus:
  metricsService: true
  enabled: true
  port: 9962
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

envoy:
  log:
    path: /dev/stdout
    defaultLevel: info
    accessLogBufferSize: 65536
