kubeProxyReplacement: true

# CNI dataplane: request based on 7d peak (341m/576Mi), no CPU limit — a
# throttled cilium-agent means throttled packet processing cluster-wide,
# worse than letting it burst. Memory limit only guards against a leak
# taking the node down.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 1Gi

ipam:
  mode: kubernetes

k8sServiceHost: localhost
k8sServicePort: 7445

l7Proxy: true

# eBPF masquerading replaces the iptables masquerade path, which in turn lets
# Cilium use eBPF host routing instead of the legacy netfilter host path.
bpf:
  masquerade: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

loadBalancer:
  enabled: true

operator:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

ingressController:
  enabled: false
  default: false
  loadbalancerMode: shared

# Mutual authentication (SPIRE mTLS) removed — deprecated in Cilium 1.20 and
# the SPIRE server was crashlooping. Pod-to-pod confidentiality is now provided
# by WireGuard transparent encryption (node-to-node), which keeps L4 policies
# and DNS working (unlike ztunnel).
authentication:
  enabled: false

encryption:
  enabled: true
  type: wireguard

l2announcements:
  enabled: true

# BBR congestion control for pods, plus EDT-based egress pacing. Requires the
# eBPF host routing enabled via bpf.masquerade above. Pods only pick up BBR on
# (re)creation, so existing workloads keep cubic until they restart.
bandwidthManager:
  enabled: true
  bbr: true

hubble:
  enabled: true

  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http

prometheus:
  metricsService: true
  enabled: true
  port: 9962
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

envoy:
  log:
    path: /dev/stdout
    defaultLevel: info
    accessLogBufferSize: 65536
  # Serves the public Gateway (registry.hauptmann.dev etc.) — same no-CPU-limit
  # reasoning as cilium-agent above, this is the request hot path.
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
