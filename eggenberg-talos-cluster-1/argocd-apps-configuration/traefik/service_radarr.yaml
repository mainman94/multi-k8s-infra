apiVersion: v1
kind: Service
metadata:
  name: radarr-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: radarr
spec:
  ports:
    - port: 30025
      targetPort: 30025
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: radarr-external-1
  namespace: traefik
  labels:
    app.kubernetes.io/name: radarr
    kubernetes.io/service-name: radarr-external
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 30025
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.hauptmann.dev`)
      middlewares:
        - name: default-secure-chain
      kind: Rule
      services:
        - name: radarr-external
          port: 30025
          passHostHeader: true
  tls:
    store:
      name: default
