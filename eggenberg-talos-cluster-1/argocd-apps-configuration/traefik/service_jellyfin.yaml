apiVersion: v1
kind: Service
metadata:
  name: jellyfin-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  ports:
    - port: 30013
      targetPort: 30013
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin-external-1
  namespace: traefik
  labels:
    app.kubernetes.io/name: jellyfin
    kubernetes.io/service-name: jellyfin-external
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 30013
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.hauptmann.dev`)
      middlewares:
        - name: streaming-secure-chain
      kind: Rule
      services:
        - name: jellyfin-external
          port: 30013
          passHostHeader: true
  tls:
    store:
      name: default
