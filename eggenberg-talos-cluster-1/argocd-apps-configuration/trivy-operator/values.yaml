# yamllint disable rule:line-length
# Trivy Operator config. Cluster-wide scanning of running workloads.

# Scan every namespace (empty = all). Exclude noisy platform namespaces if needed.
targetNamespaces: "portfolio,portfolio-dev,portfolio-test"
excludeNamespaces: "kube-system,trivy-system"

operator:
  # Vulnerability + config-audit scanning on. SBOM off (noisy, enable later if wanted).
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: true
  exposedSecretScannerEnabled: true
  sbomGenerationEnabled: false
  # Rescan cadence + report retention.
  scannerReportTTL: "24h"
  metricsFindingsEnabled: true
  # Run a built-in central Trivy server (ClientServer mode). Scan jobs query it
  # instead of each downloading + locking the vuln DB — fixes the "cache lock
  # timeout" failures and cuts registry pulls. Overrides trivy.mode + serverURL.
  builtInTrivyServer: true

trivy:
  # Only report actionable severities.
  severity: "HIGH,CRITICAL"
  ignoreUnfixed: true
  # Persist the built-in server's vuln DB on Longhorn so it survives restarts.
  storageClassEnabled: true
  storageClassName: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Node-collector (infra/CIS assessment). Talos has no systemd, so the chart's
# default /etc/systemd + /lib/systemd host mounts don't exist. With the enforced
# readOnlyRootFilesystem, containerd can't create those mount points in the
# container rootfs -> CreateContainerError "mkdir /etc/systemd: read-only file
# system". Re-declare the mount lists (Helm replaces lists wholesale) without the
# two systemd entries.
nodeCollector:
  volumeMounts:
    - name: var-lib-etcd
      mountPath: /var/lib/etcd
      readOnly: true
    - name: var-lib-kubelet
      mountPath: /var/lib/kubelet
      readOnly: true
    - name: var-lib-kube-scheduler
      mountPath: /var/lib/kube-scheduler
      readOnly: true
    - name: var-lib-kube-controller-manager
      mountPath: /var/lib/kube-controller-manager
      readOnly: true
    - name: etc-kubernetes
      mountPath: /etc/kubernetes
      readOnly: true
    - name: etc-cni-netd
      mountPath: /etc/cni/net.d/
      readOnly: true
  volumes:
    - name: var-lib-etcd
      hostPath:
        path: /var/lib/etcd
    - name: var-lib-kubelet
      hostPath:
        path: /var/lib/kubelet
    - name: var-lib-kube-scheduler
      hostPath:
        path: /var/lib/kube-scheduler
    - name: var-lib-kube-controller-manager
      hostPath:
        path: /var/lib/kube-controller-manager
    - name: etc-kubernetes
      hostPath:
        path: /etc/kubernetes
    - name: etc-cni-netd
      hostPath:
        path: /etc/cni/net.d/

# Expose metrics to the existing kube-prometheus-stack. Its Prometheus only
# selects ServiceMonitors labeled release=kube-prometheus-stack, so set it here —
# without this label the SM is created but never scraped (dashboard shows no data).
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

# Operator controller. Memory scales with the number of scanned workloads (informer
# cache + report objects) — 256Mi OOMKilled on a full-cluster scan, so give it headroom.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
    # yamllint enable rule:line-length
