# yamllint disable rule:line-length
# Trivy Operator config. Cluster-wide scanning of running workloads.

# Scan every namespace (empty = all). Exclude noisy platform namespaces if needed.
targetNamespaces: ""
excludeNamespaces: "kube-system,trivy-system"

operator:
  # Vulnerability + config-audit scanning on. SBOM off (noisy, enable later if wanted).
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: true
  exposedSecretScannerEnabled: true
  sbomGenerationEnabled: false
  # Rescan cadence + report retention.
  scannerReportTTL: "24h"
  metricsFindingsEnabled: true
  # Run a built-in central Trivy server (ClientServer mode). Scan jobs query it
  # instead of each downloading + locking the vuln DB — fixes the "cache lock
  # timeout" failures and cuts registry pulls. Overrides trivy.mode + serverURL.
  builtInTrivyServer: true

trivy:
  # Only report actionable severities.
  severity: "HIGH,CRITICAL"
  ignoreUnfixed: true
  # Persist the built-in server's vuln DB on Longhorn so it survives restarts.
  storageClassEnabled: true
  storageClassName: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Expose metrics to the existing kube-prometheus-stack (picks up all ServiceMonitors).
serviceMonitor:
  enabled: true

# Operator controller. Memory scales with the number of scanned workloads (informer
# cache + report objects) — 256Mi OOMKilled on a full-cluster scan, so give it headroom.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
    # yamllint enable rule:line-length
