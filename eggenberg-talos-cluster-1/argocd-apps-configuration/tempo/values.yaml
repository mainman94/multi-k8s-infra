tempo:
  # The chart defaults to a 1024 MiB ballast, which cannot fit into the
  # container's 256 MiB memory limit and causes an OOM crash loop.
  memBallastSizeMbs: 0
  # Keep traces for two days; homelab-sized retention.
  retention: 48h
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  # Narrow ingest to OTLP only (drop the chart's default jaeger/opencensus
  # receivers). Apps push traces to tempo.monitoring.svc:4317 (gRPC) / :4318
  # (HTTP).
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  resources:
    requests:
      cpu: 10m
      memory: 384Mi
    limits:
      cpu: 500m
      # 512Mi OOM-killed on boot: the crash loop below never gave the
      # compactor a stable run, so ~1400 uncompacted blocks piled up and
      # blow the memory budget just loading the blocklist at startup.
      memory: 1536Mi
  # 200m limit let brief load spikes (WAL replay, blocklist poll, generator
  # gRPC backlog) starve the /ready handler past the 5s probe timeout;
  # liveness then killed the pod mid-write, corrupting the local blocklist
  # index and slowing the next startup — a 69-restart crash loop over 19h.
  # Looser timeout/threshold gives it room to answer under a brief spike.
  livenessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  # Derive RED metrics (service graphs, span rate/latency/error) from traces.
  # Without this the generator ring is empty and Grafana's Tempo "compare"/
  # TraceQL-metrics views fail with "error finding generators: empty ring".
  # Requires kube-prometheus-stack's remote-write receiver (see its values.yaml).
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
    processor:
      service_graphs: {}
      span_metrics: {}
      # Required for Grafana Traces Drilldown's TraceQL metrics queries
      # (rate()/histogram_over_time() by arbitrary attributes), not just the
      # fixed service-graphs/span-metrics dimensions.
      local_blocks:
        flush_to_storage: true
    storage:
      path: /var/tempo/metrics-wal
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
# Persist WAL + trace blocks so restarts don't lose data.
persistence:
  enabled: true
  size: 10Gi
  storageClassName: longhorn
