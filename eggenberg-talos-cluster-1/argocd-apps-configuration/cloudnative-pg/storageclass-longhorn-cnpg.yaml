# Dedicated StorageClass for CNPG volumes: Longhorn with a SINGLE replica.
# CNPG replicates data at the PostgreSQL layer (streaming replication across
# instances), so Longhorn's default 2x volume replication would be redundant
# IO + space. Do NOT raise numberOfReplicas here — PG-layer redundancy is the
# design. Not the cluster default; the plain "longhorn" SC stays for everything
# else.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-cnpg
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: "ext4"
