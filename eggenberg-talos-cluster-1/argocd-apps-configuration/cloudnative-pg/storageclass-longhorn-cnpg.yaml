# Dedicated StorageClass for CNPG volumes: Longhorn with a SINGLE replica.
# CNPG replicates data at the PostgreSQL layer (streaming replication across
# instances), so Longhorn's default 2x volume replication would be redundant
# IO + space. Do NOT raise numberOfReplicas here — PG-layer redundancy is the
# design. Not the cluster default; the plain "longhorn" SC stays for everything
# else.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-cnpg
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  # Keep the single replica on the node running the CNPG pod. Without it the
  # replica can land on another node; draining that node then has to stop a
  # running last replica, which nodeDrainPolicy rightly refuses, and the Talos
  # upgrade drain deadlocks. best-effort, not strict-local: Longhorn can't move
  # existing volumes to strict-local, and that would pin pods to one node.
  # Parameters are immutable: after merging, `kubectl delete sc longhorn-cnpg`
  # once and let ArgoCD recreate it (existing PVs are unaffected).
  dataLocality: "best-effort"
  staleReplicaTimeout: "30"
  fsType: "ext4"
