
# CloudNativePG operator (chart 0.29.0 / app 1.30.0).
# Single-node-friendly: one operator replica. Metrics into the existing
# kube-prometheus-stack via a PodMonitor labelled for its selector.
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

monitoring:
  podMonitorEnabled: true
  podMonitorAdditionalLabels:
    release: kube-prometheus-stack
