
# CloudNativePG operator (chart 0.29.0 / app 1.30.0).
# Single-node-friendly: one operator replica.
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# kube-prometheus-stack is gone (replaced by splunk-otel-collector); the
# PodMonitor CRD no longer exists, so keep this disabled.
monitoring:
  podMonitorEnabled: false
