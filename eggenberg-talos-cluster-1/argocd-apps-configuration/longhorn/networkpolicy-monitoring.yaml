apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-monitoring
  namespace: longhorn-system
spec:
  # The chart's own longhorn-manager policy only admits longhorn pods, which
  # blocks Prometheus from scraping :9500 (TargetDown, job=longhorn-backend).
  # NetworkPolicies are additive, so this only widens ingress for the scrape.
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9500
