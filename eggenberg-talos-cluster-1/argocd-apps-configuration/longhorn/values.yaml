defaultSettings:
  defaultReplicaCount: "2"
  # Default (12%) reserves 474m/474m/954m per node for instance-managers on
  # this cluster, ~10x actual usage (20-102m observed) and the main driver of
  # the KubeCPUOvercommit alert. 5% still covers observed load with margin.
  guaranteedInstanceManagerCPU: "5"
  # Evict the last replica off a draining node instead of blocking the drain
  # forever — lets `talosctl upgrade` finish without manually deleting pods.
  nodeDrainPolicy: block-for-eviction-if-contains-last-replica
  detachManuallyAttachedVolumesWhenCordoned: true
persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
ingress:
  enabled: false
# kube-prometheus-stack is gone (replaced by splunk-otel-collector); the
# ServiceMonitor CRD no longer exists, so keep this disabled.
metrics:
  serviceMonitor:
    enabled: false
csi:
  attacherReplicaCount: "2"
  provisionerReplicaCount: "2"
  resizerReplicaCount: "2"
  snapshotterReplicaCount: "2"
