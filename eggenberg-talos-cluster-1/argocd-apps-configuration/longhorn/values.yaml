defaultSettings:
  defaultReplicaCount: "2"
  # Default (12%) reserves 474m/474m/954m per node for instance-managers on
  # this cluster, ~10x actual usage (20-102m observed) and the main driver of
  # the KubeCPUOvercommit alert. 5% still covers observed load with margin.
  guaranteedInstanceManagerCPU: "5"
  # Default 0 leaves volumes on the old engine after a chart upgrade, so every
  # node keeps two instance-managers (old + new) and double the CPU request.
  # 1 = live-upgrade one volume per node at a time; old IMs drain and go away.
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  # Let the drain proceed once a node's replicas are stopped. The last-replica
  # policies deadlock on longhorn-cnpg's single-replica volumes (redundancy is
  # at the PG layer): the replica can't be evicted while CNPG has it attached,
  # so the instance-manager PDB stays at 0 and the Talos upgrade drain times
  # out. In-place upgrades keep the data on the node's disk across the reboot.
  nodeDrainPolicy: allow-if-replica-is-stopped
  detachManuallyAttachedVolumesWhenCordoned: true
persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
ingress:
  enabled: false
metrics:
  serviceMonitor:
    enabled: true
csi:
  attacherReplicaCount: "2"
  provisionerReplicaCount: "2"
  resizerReplicaCount: "2"
  snapshotterReplicaCount: "2"
