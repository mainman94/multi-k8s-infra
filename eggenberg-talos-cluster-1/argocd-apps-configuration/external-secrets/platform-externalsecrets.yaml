# Pocket ID OIDC client for Grafana SSO. Consumed as env vars via
# grafana.envValueFrom in the kube-prometheus-stack values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-pocketid
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-pocketid
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/grafana
        metadataPolicy: None
        property: POCKETID_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/grafana
        metadataPolicy: None
        property: POCKETID_CLIENT_SECRET
---
# Discord webhook for Alertmanager notifications. Mounted into the Alertmanager
# pod via alertmanagerSpec.secrets and read with webhook_url_file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/discord
        metadataPolicy: None
        property: ALERTMANAGER_WEBHOOK_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-secret
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: velero-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |-
          [default]
          aws_access_key_id={{ .aws_access_key_id }}
          aws_secret_access_key={{ .aws_secret_access_key }}
  data:
    - secretKey: aws_access_key_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/backblaze
        metadataPolicy: None
        property: APPLICATION_KEY_ID_K8S_BACKUP
    - secretKey: aws_secret_access_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/backblaze
        metadataPolicy: None
        property: APPLICATION_KEY_K8S_BACKUP
