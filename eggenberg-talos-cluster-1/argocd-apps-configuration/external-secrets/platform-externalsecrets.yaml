# Platform/application credentials sourced from OpenBao via the cluster-wide
# ClusterSecretStore "openbao". These materialize the Kubernetes Secrets
# consumed by workloads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dex-pocketid
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-dex-pocketid
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: DEX_POCKETID_CLIENT_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/argocd
        metadataPolicy: None
        property: ARGOCD_DEX_POCKETID_CLIENT_ID
    - secretKey: DEX_POCKETID_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/argocd
        metadataPolicy: None
        property: ARGOCD_DEX_POCKETID_CLIENT_SECRET
    - secretKey: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/argocd
        metadataPolicy: None
        property: WORKFLOWS_SSO_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-sso
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argo-workflows-sso
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: argo-workflows
        client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/argocd
        metadataPolicy: None
        property: WORKFLOWS_SSO_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-pull-pat
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-pull-pat
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"git.hauptmann.dev":{"username":"{{ .username }}","password":"{{ .pat }}","auth":"{{ printf "%s:%s" .username .pat | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/gitea
        metadataPolicy: None
        property: PACKAGE_USERNAME
    - secretKey: pat
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/gitea
        metadataPolicy: None
        property: PACKAGE_PAT
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-credentials
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
