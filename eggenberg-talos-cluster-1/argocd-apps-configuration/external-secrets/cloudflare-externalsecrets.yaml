# Cloudflare creds sourced from OpenBao (homelab/prod/cloudflare) via the
# cluster-wide ClusterSecretStore "openbao". Each ExternalSecret targets the
# consuming app's namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cilium
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: CF_DNS_API_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-origin-cert
  namespace: cilium
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-origin-cert
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .cert }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: cert
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: CLOUDFLARE_ORIGIN_CERT_CERT
    - secretKey: key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: CLOUDFLARE_ORIGIN_CERT_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
