---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-cache-purge
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-cache-purge
    creationPolicy: Owner
  data:
    - secretKey: zone-id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: ZONE_ID_HAUPTMANN_DEV
    - secretKey: api-token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-secret
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-tunnel-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: |-
          {
            "AccountTag": "{{ .account_id }}",
            "TunnelID": "{{ .tunnel_id }}",
            "TunnelSecret": "{{ .tunnel_secret }}"
          }
        cert.pem: "{{ .cert }}"
  data:
    - secretKey: account_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: ACCOUNT_ID
    - secretKey: tunnel_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: TUNNEL_EGGENBERG_ID
    - secretKey: tunnel_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: TUNNEL_EGGENBERG_SECRET
    - secretKey: cert
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/cloudflare
        metadataPolicy: None
        property: TUNNEL_EGGENBERG_CERTIFICATE
