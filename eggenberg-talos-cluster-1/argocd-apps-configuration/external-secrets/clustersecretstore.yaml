# Cluster-wide store pointing at the self-hosted OpenBao (Docker, outside the
# cluster). Server config lives in the homelab repo's terraform/openbao:
#   - kv-v2 engine mounted at "homelab", secrets under prod/<source>
#   - kubernetes auth backend at "kubernetes/"
#   - role "eso" binds SA external-secrets / ns external-secrets -> policy
#     eso-reader (read/list on homelab/{data,metadata}/prod/*)
# ESO mints a token for the referenced ServiceAccount and logs in via that role.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://192.168.0.129:30020
      path: homelab
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
