loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi
sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Disable distributed components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false
# Disable memcached caches (not needed for single binary / filesystem storage)
chunksCache:
  enabled: false
resultsCache:
  enabled: false
