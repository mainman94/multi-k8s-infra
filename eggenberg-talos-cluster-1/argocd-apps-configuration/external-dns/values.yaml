# yamllint disable rule:line-length
# ExternalDNS -> Cloudflare, driven by Gateway API HTTPRoutes.

provider:
  name: cloudflare

# Watch HTTPRoutes only (cluster uses Gateway API, zero Ingress). ExternalDNS
# derives the record target from the parent Gateway's status address = the
# Cilium Gateway public VIP.
sources:
  - gateway-httproute

# Scope strictly to the managed zone. Single Cloudflare zone, so domainFilters
# is enough (zone-id filtering not needed).
domainFilters:
  - hauptmann.dev

# sync = full ownership: create, update AND delete. ExternalDNS prunes records
# whose HTTPRoute is gone, fully replacing Terraform-managed DNS. Scoped to
# records it owns via the TXT registry below — foreign records stay untouched.
policy: sync

# Ownership registry so this instance only touches/deletes records it created.
registry: txt
txtOwnerId: external-dns-eggenberg

# Proxy through Cloudflare (orange cloud) — the Gateway HTTPS listener terminates
# with a Cloudflare origin cert, which requires proxied records.
extraArgs:
  - --cloudflare-proxied
  # Gateway API supplies the Cilium VIP (192.168.0.9) as each HTTPRoute's
  # target. Prefer EXTERNAL_DNS_DEFAULT_TARGETS, which is the public IP from
  # OpenBao, so Cloudflare can proxy the records.
  - --force-default-targets

# Cloudflare API token, provisioned from OpenBao by External Secrets Operator.
# EXTERNAL_DNS_DEFAULT_TARGETS is the --default-targets flag: every record points
# at the site's public IP instead of the Cilium Gateway's internal VIP that lands
# in the Gateway status. Kept in OpenBao (prod/network) so the address is not in
# this public repo.
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: CF_API_TOKEN
  - name: EXTERNAL_DNS_DEFAULT_TARGETS
    valueFrom:
      secretKeyRef:
        name: external-dns-default-targets
        key: PUBLIC_IP

# Metrics into the existing kube-prometheus-stack.
serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
    # yamllint enable rule:line-length
