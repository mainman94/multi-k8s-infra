# Values for the pmhme Helm chart (mainman94/portfolio, charts/pmhme) in the
# dev stage. The image tags below are written by the Kargo `dev` stage
# (helm-update-image); do not hand-edit them.
environment: dev
notificationSink:
  enabled: true
httpRoute:
  hostnames:
    - dev.hauptmann.dev
externalSecrets:
  contactDb:
    passwordProperty: POSTGRES_PASSWORD_DEV
web:
  image:
    tag: 0.31.6
  config:
    STAGE: dev
    LOG_LEVEL: debug
    OTEL_SERVICE_NAME: hauptmann-portfolio-dev
    SITE_URL: https://dev.hauptmann.dev
    BLOG_REPO_CONTENT_PATH: test
    # No analytics outside production.
    UMAMI_SCRIPT_URL: ""
    UMAMI_WEBSITE_ID: ""
contactApi:
  image:
    tag: 0.11.8
notifierTelegram:
  image:
    tag: 0.4.10
notifierEmail:
  image:
    tag: 0.4.10
# PostgreSQL 19 in dev first: CNPG runs an offline pg_upgrade when the major
# version goes up. Promote to test/prod once dev is healthy, then move this
# into the chart default.
postgres:
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-minimal-trixie@sha256:28f6604b4e142cadd8b0154ae82a5541e321d6f33b27fc5a054ced3dde53e6e8
