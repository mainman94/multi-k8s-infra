# Reference only, not applied: the same rules as plain networking.k8s.io/v1
# NetworkPolicies, for a CNI without CiliumNetworkPolicy. Translation gaps:
# - Cilium entity "ingress" (Gateway Envoy) has no equivalent; select the
#   ingress controller's namespace instead (traefik here as an example).
# - Entity "host" (kubelet probes) has none either; most CNIs let the local
#   kubelet through regardless, otherwise add an ipBlock with the node subnet.
# - Entity "kube-apiserver" becomes an ipBlock of the control-plane IPs.
# - Protocol ANY does not exist; DNS needs UDP and TCP rules.
# - toFQDNs (R2 backup egress) has no equivalent; plain NetworkPolicy can only
#   allow 443 to an ipBlock, and R2's IPs are not stable.
