# Keycloak CR, its CNPG database and the supporting policies/secrets. The
# operator and CRDs come from the separate `keycloak-operator` app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - keycloak-db-externalsecret.yaml
  - keycloak-admin-externalsecret.yaml
  - keycloak-postgres.yaml
  - keycloak.yaml
  - keycloak-netpol.yaml
  - keycloak-pdb.yaml
  - keycloak-podmonitor.yaml
  - keycloak-backup.yaml
