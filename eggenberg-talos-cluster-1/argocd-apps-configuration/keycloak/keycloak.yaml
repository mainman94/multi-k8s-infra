# Keycloak CR reconciled by the Keycloak Operator. TLS terminates at the Cilium
# Gateway (auth.hauptmann.dev), so Keycloak serves plain HTTP on 8080 and trusts
# the X-Forwarded-* headers (Cloudflare -> cilium-ingress -> Gateway). The
# operator's own NetworkPolicy is off; keycloak-netpol.yaml (Cilium) owns it.
# Service created by the operator: keycloak-service:8080.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    # The Keycloak CRD is applied by this same sync; skip dry-run until it exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 2
  # Operator checks per update whether a rolling update is safe (patch releases)
  # and only recreates when it is not. The default, RecreateOnImageChange, scales
  # to zero on every image change.
  update:
    strategy: Auto
  db:
    vendor: postgres
    host: keycloak-postgres-rw
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin
  hostname:
    hostname: https://auth.hauptmann.dev
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  networkPolicy:
    enabled: false
  # The sizing guide warns that throttled pods perform significantly worse, and
  # the non-optimized image runs the Quarkus build on every start, so the CPU
  # limit leaves room for that burst.
  # https://www.keycloak.org/high-availability/multi-cluster/concepts-memory-and-cpu-sizing
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1536Mi
  scheduling:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: keycloak
            app.kubernetes.io/managed-by: keycloak-operator
  # Prometheus metrics on the management port (9000, /metrics); scraped via
  # keycloak-podmonitor.yaml.
  additionalOptions:
    - name: metrics-enabled
      value: "true"
    # Only honour X-Forwarded-* from inside the pod network. The Gateway's Envoy
    # connects from each node's Cilium ingress IP, allocated from the pod CIDR
    # (10.244.0.0/16, Talos default); the CR has no field for this option.
    - name: proxy-trusted-addresses
      value: 10.244.0.0/16
  # The operator generates the pod without a securityContext. Merged into its
  # pod template so the pods meet PSS restricted. No readOnlyRootFilesystem:
  # the non-optimized image runs the Quarkus build on start and writes to
  # /opt/keycloak.
  unsupported:
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
