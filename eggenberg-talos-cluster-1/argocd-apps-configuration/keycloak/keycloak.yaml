# Keycloak CR reconciled by the Keycloak Operator. TLS terminates at the Cilium
# Gateway (auth.hauptmann.dev), so Keycloak serves plain HTTP on 8080 and trusts
# the X-Forwarded-* headers (Cloudflare -> cilium-ingress -> Gateway). The
# operator's own NetworkPolicy is off; keycloak-netpol.yaml (Cilium) owns it.
# Service created by the operator: keycloak-service:8080.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    # The Keycloak CRD is applied by this same sync; skip dry-run until it exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 2
  # Pre-built, optimized image from mainman94/keycloak-build (FULLSTACKS
  # keycloak-image-builder): PostgreSQL, health and metrics are baked in at
  # build time, so `start --optimized` skips the Quarkus build on every start.
  # Build-time options (db vendor, health, metrics, features) come from the
  # image; changing them needs a new image, not an additionalOptions entry.
  # Keep the image's Keycloak version equal to the operator's
  # (keycloak-operator/kustomization.yaml) and never move it backwards: the
  # database schema does not support downgrades.
  # Keycloak 26.8.2, built from keycloak-build 801a2f4 (adds the `homelab`
  # login theme; realms opt in via login_theme in homelab/terraform/keycloak).
  image: ghcr.io/mainman94/keycloak:801a2f4016b67d52f440b878d23d630693a2a1df@sha256:5758545c557ccedfa6c61922a26deed1b9394e7a16a8356897055caf1ba780f4
  startOptimized: true
  # Operator checks per update whether a rolling update is safe (patch releases)
  # and only recreates when it is not. The default, RecreateOnImageChange, scales
  # to zero on every image change.
  update:
    strategy: Auto
  db:
    vendor: postgres
    host: keycloak-postgres-rw
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin
  hostname:
    hostname: https://auth.hauptmann.dev
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  networkPolicy:
    enabled: false
  # The sizing guide warns that throttled pods perform significantly worse.
  # The optimized image no longer runs the Quarkus build on start, so the
  # limit only covers JVM warm-up and login bursts; one core is plenty for a
  # homelab realm. Raise it again if startup or logins get throttled.
  # https://www.keycloak.org/high-availability/multi-cluster/concepts-memory-and-cpu-sizing
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1536Mi
  scheduling:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: keycloak
            app.kubernetes.io/managed-by: keycloak-operator
  # Prometheus metrics on the management port (9000, /metrics) are built into
  # the image (metrics-enabled is a build-time option); scraped via
  # keycloak-podmonitor.yaml.
  additionalOptions:
    # Only honour X-Forwarded-* from inside the pod network. The Gateway's Envoy
    # connects from each node's Cilium ingress IP, allocated from the pod CIDR
    # (10.244.0.0/16, Talos default); the CR has no field for this option.
    - name: proxy-trusted-addresses
      value: 10.244.0.0/16
  # The operator generates the pod without a securityContext. Merged into its
  # pod template so the pods meet PSS restricted. The pod template is the
  # operator's base: it only edits the first container and adds volumes for
  # TLS, truststores and a cache ConfigMap (none used here), so the volumes
  # below survive. With the optimized image nothing writes to /opt/keycloak
  # except data/ (tmp files, transaction logs), and the JVM needs /tmp, so the
  # root filesystem is read-only and those two get an emptyDir each.
  unsupported:
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: keycloak-data
                mountPath: /opt/keycloak/data
        volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 256Mi
          - name: keycloak-data
            emptyDir:
              sizeLimit: 256Mi
