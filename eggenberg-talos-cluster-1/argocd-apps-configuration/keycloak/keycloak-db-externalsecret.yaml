# App-user credentials for the CNPG cluster, from OpenBao prod/keycloak.
# OpenBao prod/keycloak must hold property DB_PASSWORD. CNPG bootstrap.initdb
# reads the username/password keys; Keycloak reads the same two keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: keycloak
        password: "{{ .DB_PASSWORD }}"
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/keycloak
        metadataPolicy: None
        property: DB_PASSWORD
