# Temporary bootstrap admin (Keycloak >= 26). OpenBao prod/keycloak must hold
# property ADMIN_PASSWORD. Create a permanent admin after first login and
# delete the bootstrap user; the secret is only read on first start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: admin
        password: "{{ .ADMIN_PASSWORD }}"
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/keycloak
        metadataPolicy: None
        property: ADMIN_PASSWORD
