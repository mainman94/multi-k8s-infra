# CloudNativePG cluster for Keycloak: 1 primary + 1 streaming replica with
# automatic failover. Primary service: keycloak-postgres-rw. Storage uses the
# single-replica longhorn-cnpg class (redundancy is at the PG layer, see
# cloudnative-pg/storageclass-longhorn-cnpg.yaml). Backups: Velero for now,
# same as contact-postgres.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-postgres
  annotations:
    # The CNPG CRDs come from the cloudnative-pg app; do not fail dry-run if it
    # has not synced yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: keycloak-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:c9be7f221a05b18fe65259d9136affbabe3b39ad91c3b68f8f2f990a45f35f38
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-db
  # Commits wait for one replica, so a failover loses no acknowledged
  # writes. dataDurability: preferred falls back to async while the replica is
  # down instead of blocking writes (2 instances, no spare standby).
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  # WAL archiving + base backups through the Barman Cloud plugin to R2, see
  # keycloak-backup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The CNPG webhook defaults this; written out so ArgoCD's diff does not
      # show the defaulted field as a permanent change.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: keycloak-r2
  # Promote the already-updated replica, then restart the old primary, instead
  # of restarting the primary in place: Keycloak loses writes for seconds, not
  # for a full Postgres restart.
  primaryUpdateMethod: switchover
  storage:
    storageClass: longhorn-cnpg
    size: 5Gi
  # Memory request = limit, as the CNPG docs recommend: a Postgres pod that
  # outgrows its request is the first one evicted under node memory pressure.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi
