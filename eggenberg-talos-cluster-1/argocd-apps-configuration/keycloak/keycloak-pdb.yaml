# Keep one Keycloak pod serving during node drains (2 replicas).
# No PDB for keycloak-postgres: CNPG owns keycloak-postgres-primary, and from 3
# instances on it also creates one named keycloak-postgres for the replicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
