# Alertmanager configuration
alertmanager:
  enabled: true
  service:
    type: ClusterIP
  # Routes every firing alert to a Discord channel. The webhook URL comes from
  # OpenBao via the alertmanager-discord ExternalSecret and is read from disk,
  # so it never lands in this file or in the rendered ConfigMap.
  config:
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog fires permanently by design as a dead-man's switch for the
        # alerting path itself; it would drown the channel.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          # yamllint disable-line rule:line-length
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook
            send_resolved: true
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<name>/ inside the pod.
    secrets:
      - alertmanager-discord
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn
# Prometheus server configuration
prometheus:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
    ingressClassName: cilium
    hosts:
      - monitoring.hauptmann.dev
    paths:
      - /
    pathType: Prefix
  # yamllint disable rule:line-length
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 10d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
          storageClassName: longhorn
    additionalScrapeConfigs:
      - job_name: "ztunnel"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app]
            action: keep
            regex: istio-system;ztunnel
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http-monitoring
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
# yamllint enable rule:line-length
# Grafana configuration
grafana:
  enabled: true
  ingress:
    enabled: false
  # RWO longhorn volume: old pod must release the PV before the new one can attach
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: longhorn
# Node Exporter configuration
nodeExporter:
  enabled: true
# Kube State Metrics configuration
kubeStateMetrics:
  enabled: true
