# Alertmanager configuration
alertmanager:
  enabled: true
  service:
    type: ClusterIP
  # Only the skeleton lives here: the actual Discord receiver is an
  # AlertmanagerConfig CR (see extraManifests). The inline config cannot
  # reference a secret, and prometheus-operator rejects `webhook_url_file` —
  # its discordConfig type has no such field, so the whole reconcile fails and
  # the StatefulSet silently keeps the previous config. Everything that does
  # not match the CR's route lands in "null", Watchdog included.
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    receivers:
      - name: "null"
  alertmanagerSpec:
    # By default the operator appends a `namespace = monitoring` matcher to
    # every AlertmanagerConfig route, which would drop alerts from all other
    # namespaces. None disables that.
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
# Prometheus server configuration
prometheus:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
    ingressClassName: cilium
    hosts:
      - monitoring.hauptmann.dev
    paths:
      - /
    pathType: Prefix
  # yamllint disable rule:line-length
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 10d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
          storageClassName: longhorn
    additionalScrapeConfigs:
      - job_name: "ztunnel"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app]
            action: keep
            regex: istio-system;ztunnel
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http-monitoring
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
    # 7d peak 481m/2747Mi (10d retention, 30s scrape across ~29 apps).
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        cpu: 800m
        memory: 3072Mi
# yamllint enable rule:line-length
# Grafana configuration
grafana:
  enabled: true
  ingress:
    enabled: false
  # RWO longhorn volume: old pod must release the PV before the new one can attach
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: longhorn
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 640Mi
  # Shared by both the dashboard and datasource sidecars.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  # OIDC client credentials from OpenBao (grafana-pocketid ExternalSecret).
  # Grafana maps GF_* env vars onto grafana.ini keys, so the secret never has
  # to appear in the rendered ConfigMap below.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: grafana-pocketid
        key: client_id
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-pocketid
        key: client_secret
  # SSO via Pocket ID, replacing the click-ops config under
  # /admin/authentication/generic_oauth. The UI writes to Grafana's DB and
  # silently wins over this file, so delete the UI-created provider once this
  # is live — otherwise the two disagree and the file looks broken.
  grafana.ini:
    server:
      # Required for the OAuth redirect to point at the public hostname
      # instead of the in-cluster service name.
      root_url: https://grafana.hauptmann.dev
    auth.generic_oauth:
      enabled: true
      name: Pocket ID
      icon: signin
      # Local admin login stays available as the break-glass path if Pocket ID
      # is down; auto_login would take that away.
      auto_login: false
      allow_sign_up: true
      use_pkce: true
      scopes: openid email profile groups
      auth_url: https://id.hauptmann.dev/authorize
      token_url: https://id.hauptmann.dev/api/oidc/token
      api_url: https://id.hauptmann.dev/api/oidc/userinfo
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      # Members of the homelab group in Pocket ID get Admin, everyone else
      # read-only. Without the fallback a missing group claim would lock every
      # SSO user out.
      role_attribute_path: >-
        contains(groups[*], 'homelab') && 'Admin' || 'Viewer'
    auth:
      # Send users back to Pocket ID's logout, not Grafana's login form.
      signout_redirect_url: https://id.hauptmann.dev/api/oidc/end-session
# Alert rules for components the chart's built-in defaultRules do not cover.
# Rendered as PrometheusRules carrying the release label Prometheus selects on.
additionalPrometheusRulesMap:
  homelab:
    groups:
      # Backups fail silently: nobody notices until a restore is needed.
      - name: velero
        rules:
          - alert: VeleroBackupFailed
            expr: increase(velero_backup_failure_total[1h]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Velero backup failed ({{ $labels.schedule }})
              description: >-
                {{ $value }} failed backup(s) in the last hour.
          - alert: VeleroBackupPartiallyFailed
            expr: increase(velero_backup_partial_failure_total[1h]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Velero backup partially failed ({{ $labels.schedule }})
              description: Some items were not backed up.
          # Schedule is daily at 02:00; 26h allows one missed run plus slack
          # before shouting.
          - alert: VeleroBackupStale
            expr: >-
              time() - velero_backup_last_successful_timestamp{schedule!=""} > 26 * 3600
            for: 30m
            labels:
              severity: critical
            annotations:
              summary: No successful Velero backup in 26h ({{ $labels.schedule }})
              description: >-
                Last success was {{ $value | humanizeDuration }} ago.
      - name: longhorn
        rules:
          # robustness: 0 unknown, 1 healthy, 2 degraded, 3 faulted.
          - alert: LonghornVolumeDegraded
            expr: longhorn_volume_robustness == 2
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Longhorn volume {{ $labels.volume }} degraded
              description: Running below the configured replica count.
          - alert: LonghornVolumeFaulted
            expr: longhorn_volume_robustness == 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Longhorn volume {{ $labels.volume }} faulted
              description: No healthy replica left — data at risk.
          - alert: LonghornDiskFillingUp
            expr: >-
              longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 0.85
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Longhorn disk {{ $labels.disk }} above 85%
              description: >-
                Node {{ $labels.node }} at {{ $value | humanizePercentage }}.
      - name: cert-manager
        rules:
          # Let's Encrypt renews at 30d left; 14d means renewal has been
          # failing for two weeks.
          - alert: CertManagerCertExpiringSoon
            expr: >-
              certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: Certificate {{ $labels.name }} expires in under 14d
              description: >-
                Renewal is likely broken. Expires in {{ $value | humanizeDuration }}.
          - alert: CertManagerCertNotReady
            expr: certmanager_certificate_ready_status{condition="True"} == 0
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: Certificate {{ $labels.name }} not ready
              description: Issuance or renewal is stuck.
      - name: argocd
        rules:
          # Drift that outlives a sync window means self-heal cannot converge.
          - alert: ArgoCDAppOutOfSync
            expr: argocd_app_info{sync_status="OutOfSync"} == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: ArgoCD app {{ $labels.name }} out of sync for 30m
              description: Self-heal is not converging.
          - alert: ArgoCDAppDegraded
            expr: argocd_app_info{health_status="Degraded"} == 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: ArgoCD app {{ $labels.name }} degraded
              description: Workload is unhealthy.
      - name: cloudnative-pg
        rules:
          - alert: CNPGInstanceDown
            expr: cnpg_collector_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: CNPG instance {{ $labels.pod }} down
              description: Metrics collector cannot reach the instance.
          # No WAL archiving configured (Velero-only backups), so streaming
          # replication is the whole redundancy story — watch it.
          - alert: CNPGReplicationLagHigh
            expr: cnpg_pg_replication_lag > 300
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: CNPG replica lagging {{ $value }}s
              description: Failover would lose this much data.
# The Discord receiver. Lives in a CR rather than in alertmanager.config
# because only this form can point at a Secret: the operator resolves apiURL
# out of alertmanager-discord (ESO → OpenBao) and writes it into the generated
# config, so the webhook never appears in Git.
extraManifests:
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: AlertmanagerConfig
    metadata:
      name: discord
      namespace: monitoring
    spec:
      route:
        receiver: discord
        # Both are plumbing, not incidents, and belong in a null receiver:
        # Watchdog fires permanently by design as a dead-man's switch for the
        # alerting path itself, and InfoInhibitor exists only to drive the
        # chart's inhibit_rules for severity=info. Excluding them here drops
        # them to the root "null" receiver.
        matchers:
          - name: alertname
            matchType: "!~"
            value: Watchdog|InfoInhibitor
      receivers:
        - name: discord
          discordConfigs:
            - apiURL:
                name: alertmanager-discord
                key: webhook
              sendResolved: true
# Cilium runs with kubeProxyReplacement, so there is no kube-proxy to scrape.
# Left enabled, the chart ships both a ServiceMonitor for a target that never
# exists and the KubeProxyDown rule that then fires forever.
kubeProxy:
  enabled: false
prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Shared by the config-reloader sidecar on both Prometheus and Alertmanager.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
# Node Exporter configuration
nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Kube State Metrics configuration
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
