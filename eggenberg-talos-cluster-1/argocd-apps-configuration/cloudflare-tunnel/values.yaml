replica:
  allNodes: false
tunnelSecrets:
  existingConfigJsonFileSecret:
    name: cloudflare-tunnel-secret
    key: credentials.json
  existingPemFileSecret:
    name: cloudflare-tunnel-secret
    key: cert.pem
tunnelConfig:
  # -- cloudflared tunnel name
  name: "eggenberg-tunnel"
  metricsUpdateFrequency: 5s
  autoUpdateFrequency: 24h
  noAutoUpdate: true
  gracePeriod: 30s
  retries: 5
  # Use http2 instead of quic - QUIC (UDP 7844) is blocked by firewall
  protocol: http2
  # info, warn, error, fatal, panic
  logLevel: info
  transportLogLevel: warn
  connectTimeout: 30s
  warpRouting: false
ingress:
  - hostname: "audiobookshelf.hauptmann.dev"
    service: https://cilium-gateway-public.cilium.svc.cluster.local:443
    originRequest:
      originServerName: "audiobookshelf.hauptmann.dev"
      matchSNItoHost: true
