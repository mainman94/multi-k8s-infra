# yamllint disable rule:line-length
# Falco config. Runtime syscall monitoring via modern eBPF probe (Talos has no
# loadable kernel modules, so kmod driver is not an option).

driver:
  kind: modern_ebpf

# The falcoctl init/sidecar containers fail cosign signature verification for
# the container plugin artifact ("no valid bundles exist in registry") — an
# upstream GHCR/sigstore issue on that image tag, not a trust problem on our
# end. Skip verification until upstream re-signs it.
falcoctl:
  artifact:
    install:
      args: ["--log-format=json", "--no-verify"]
    follow:
      args: ["--log-format=json", "--no-verify"]

# Cilium's init container writes cilium-cni into hostPath /opt/cni/bin then
# execve's it immediately on every node (re)start — trips the stock "Drop and
# execute new binary in container" rule (EXE_WRITABLE|EXE_UPPER_LAYER).
# Legitimate CNI plugin install, not persistence. Exempt that exact binary.
customRules:
  cilium-cni-exception.yaml: |-
    - rule: Drop and execute new binary in container
      append: true
      condition: and not (proc.name=cilium-cni and proc.exepath=/opt/cni/bin/cilium-cni)

# Sane per-node defaults; bump if the default ruleset proves too noisy for
# these nodes' syscall volume.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Forward Falco alerts to the cluster's Alertmanager. Its root route already
# sends everything (except Watchdog/InfoInhibitor) to Discord, so this rides
# the existing pipeline with no extra PrometheusRule/AlertmanagerConfig needed.
falcosidekick:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  config:
    alertmanager:
      hostport: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093"
      # v1 API was removed in Alertmanager 0.27+ (kube-prometheus-stack 88.x ships it).
      endpoint: "/api/v2/alerts"
      # Falco alert priorities below this are dropped before reaching Discord.
      minimumpriority: "warning"
