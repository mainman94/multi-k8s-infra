# Let's Encrypt production issuer using DNS-01 via Cloudflare. Needed for the
# wildcard *.hauptmann.dev cert (HTTP-01 can't do wildcards). The API token
# comes from the cloudflare-api-token Secret (key api-token) materialized by
# ESO from OpenBao prod/cloudflare into the cert-manager namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: haupha08@gmail.com
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
