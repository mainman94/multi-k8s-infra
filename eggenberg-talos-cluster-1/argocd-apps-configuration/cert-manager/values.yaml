# Install CRDs as part of the Helm release
crds:
  enabled: true
replicaCount: 1
# Required for webhook to work properly
webhook:
  replicaCount: 1
cainjector:
  replicaCount: 1
# Prometheus metrics. `enabled` alone only adds scrape annotations, which this
# cluster's Prometheus ignores — it selects ServiceMonitors by release label.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
