# Install CRDs as part of the Helm release
crds:
  enabled: true
replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
# Required for webhook to work properly
webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
# PostSync hook Job the chart runs to verify the webhook is serving; Kyverno's
# pmhme-require-resource-requests policy blocks it without requests set.
startupapicheck:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
cainjector:
  replicaCount: 1
  # cainjector peaks well above the others (7d max ~228Mi) — watches every
  # CRD/webhook config in the cluster for CA injection.
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 384Mi
# kube-prometheus-stack is gone (replaced by splunk-otel-collector); the
# ServiceMonitor CRD no longer exists, so keep this disabled.
prometheus:
  enabled: true
  servicemonitor:
    enabled: false
