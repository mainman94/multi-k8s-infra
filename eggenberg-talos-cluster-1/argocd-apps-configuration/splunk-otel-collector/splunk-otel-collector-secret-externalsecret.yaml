# Splunk Observability Cloud access token, sourced from OpenBao via the
# "openbao" ClusterSecretStore. OpenBao prod/splunk must hold property
# ACCESS_TOKEN = the INGEST access token from Settings > Access Tokens in
# Splunk Observability Cloud.
# Chart references this Secret by name (secret.name in values.yaml) and
# expects the key "splunk_observability_access_token" exactly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: splunk-otel-collector-secret
  namespace: splunk-otel-collector
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: splunk-otel-collector-secret
    creationPolicy: Owner
  data:
    - secretKey: splunk_observability_access_token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/splunk
        metadataPolicy: None
        property: ACCESS_TOKEN
