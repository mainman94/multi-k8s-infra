apiVersion: kyverno.io/v2alpha1
kind: PolicyException
metadata:
  name: splunk-otel-collector-hostnetwork-exception
  namespace: splunk-otel-collector
spec:
  exceptions:
    - policyName: disallow-host-namespaces
      ruleNames:
        - host-namespaces
    - policyName: require-run-as-nonroot
      ruleNames:
        - run-as-non-root
  match:
    any:
      - resources:
          kinds:
            - DaemonSet
          names:
            - splunk-otel-collector-agent
          namespaces:
            - splunk-otel-collector
