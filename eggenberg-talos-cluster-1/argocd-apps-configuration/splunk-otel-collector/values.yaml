splunkObservability:
  realm: eu0
  metricsEnabled: true
  tracesEnabled: true

clusterName: eggenberg-talos-cluster-1

# Set distribution to gke to disable the problematic /usr/lib/os-release volume mount
# This is a workaround for Talos Linux compatibility where /usr/lib is read-only
distribution: gke

secret:
  create: false
  name: splunk-otel-collector-secret

agent:
  config:
    receivers:
      kubelet_stats:
        # Talos kubelet serving certs have no IP SANs, only the node name —
        # the chart's default endpoint (node IP) fails verification with
        # "doesn't contain any IP SANs". Connect by node name instead so the
        # cert's DNS SAN matches, keeping TLS verification on.
        endpoint: "${K8S_NODE_NAME}:10250"
        # container.cpu/memory.usage and pod network I/O are opt-in metrics
        # in kubeletstats — utilization (%) is on by default, absolute
        # usage/network stats are not.
        metrics:
          container.cpu.usage:
            enabled: true
          container.memory.usage:
            enabled: true
          k8s.pod.cpu.usage:
            enabled: true
          k8s.pod.memory.usage:
            enabled: true
          k8s.pod.network.io:
            enabled: true
          k8s.pod.network.errors:
            enabled: true
    processors:
      resource_detection:
        detectors:
          - env
          - system
        override: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # Notwendige beschreibbare Pfade bei readOnlyRootFilesystem: true
  extraVolumes:
    - name: tmp-dir
      emptyDir: {}
    - name: var-run
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp-dir
      mountPath: /tmp
    - name: var-run
      mountPath: /var/run
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi

clusterReceiver:
  config:
    receivers:
      # Retain the historical signals that /platform cannot derive from a
      # point-in-time Kubernetes API read. SignalFlow queries these in Splunk.
      prometheus/portfolio_platform:
        # Keep the original Prometheus names so SignalFlow queries remain
        # stable across collector normalization changes (notably `_total`).
        trim_metric_suffixes: false
        config:
          scrape_configs:
            - job_name: portfolio-app
              scrape_interval: 30s
              static_configs:
                - targets:
                    - portfolio-service.portfolio.svc.cluster.local:3001
                  labels:
                    namespace: portfolio
                - targets:
                    - portfolio-service.portfolio-dev.svc.cluster.local:3001
                  labels:
                    namespace: portfolio-dev
                - targets:
                    - portfolio-service.portfolio-test.svc.cluster.local:3001
                  labels:
                    namespace: portfolio-test
            - job_name: kyverno
              scrape_interval: 30s
              static_configs:
                - targets:
                    - kyverno-svc-metrics.kyverno.svc.cluster.local:8000
                    - kyverno-background-controller-metrics.kyverno.svc.cluster.local:8000
                    - kyverno-cleanup-controller-metrics.kyverno.svc.cluster.local:8000
                    - kyverno-reports-controller-metrics.kyverno.svc.cluster.local:8000
    service:
      pipelines:
        metrics/portfolio_platform:
          receivers:
            - prometheus/portfolio_platform
          processors:
            - memory_limiter
            - batch
            - resource
          exporters:
            - signalfx
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi
