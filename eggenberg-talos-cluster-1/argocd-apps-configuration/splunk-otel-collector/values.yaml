splunkObservability:
  realm: eu0
  metricsEnabled: true
  tracesEnabled: true

clusterName: eggenberg-talos-cluster-1

# Set distribution to gke to disable the problematic /usr/lib/os-release volume mount
# This is a workaround for Talos Linux compatibility where /usr/lib is read-only
distribution: gke

secret:
  create: false
  name: splunk-otel-collector-secret

agent:
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi

clusterReceiver:
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi
