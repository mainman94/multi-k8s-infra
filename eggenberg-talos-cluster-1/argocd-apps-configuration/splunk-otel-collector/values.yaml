splunkObservability:
  realm: eu0
  metricsEnabled: true
  tracesEnabled: true

clusterName: eggenberg-talos-cluster-1

# Set distribution to gke to disable the problematic /usr/lib/os-release volume mount
# This is a workaround for Talos Linux compatibility where /usr/lib is read-only
distribution: gke

secret:
  create: false
  name: splunk-otel-collector-secret

agent:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi
  # Fix health check endpoint for Talos Linux hostNetwork compatibility
  config:
    extensions:
      health_check:
        endpoint: 127.0.0.1:13133
  # Override readiness and liveness probes to use localhost
  readinessProbe:
    httpGet:
      path: /
      port: 13133
      host: 127.0.0.1
  livenessProbe:
    httpGet:
      path: /
      port: 13133
      host: 127.0.0.1

clusterReceiver:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi
