splunkObservability:
  realm: eu0
  metricsEnabled: true
  tracesEnabled: true

clusterName: eggenberg-talos-cluster-1

secret:
  create: false
  name: splunk-otel-collector-secret

agent:
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi
  # Remap host os-release correctly for Talos's immutable filesystem
  hostVolumes:
    - name: host-usr-lib-osrelease
      hostPath:
        path: /etc/os-release
      mountPath: /hostfs/usr/lib/os-release
      readOnly: true

clusterReceiver:
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi
