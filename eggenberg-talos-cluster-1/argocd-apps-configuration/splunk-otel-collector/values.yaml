splunkObservability:
  realm: eu0
  metricsEnabled: true
  tracesEnabled: true
  logsEnabled: true

clusterName: eggenberg-talos-cluster-1

# Set distribution to gke to disable the problematic /usr/lib/os-release volume mount
# This is a workaround for Talos Linux compatibility where /usr/lib is read-only
distribution: gke

secret:
  create: false
  name: splunk-otel-collector-secret

agent:
  config:
    receivers:
      kubeletstats:
        # container.cpu/memory.usage and pod network I/O are opt-in metrics
        # in kubeletstats — utilization (%) is on by default, absolute
        # usage/network stats are not.
        metrics:
          container.cpu.usage:
            enabled: true
          container.memory.usage:
            enabled: true
          k8s.pod.cpu.usage:
            enabled: true
          k8s.pod.memory.usage:
            enabled: true
          k8s.pod.network.io:
            enabled: true
          k8s.pod.network.errors:
            enabled: true
    processors:
      resource_detection:
        detectors:
          - env
          - system
        override: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # Notwendige beschreibbare Pfade bei readOnlyRootFilesystem: true
  extraVolumes:
    - name: tmp-dir
      emptyDir: {}
    - name: var-run
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp-dir
      mountPath: /tmp
    - name: var-run
      mountPath: /var/run
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi

clusterReceiver:
  resources:
    limits:
      cpu: 200m
      memory: 500Mi
    requests:
      cpu: 100m
      memory: 200Mi
