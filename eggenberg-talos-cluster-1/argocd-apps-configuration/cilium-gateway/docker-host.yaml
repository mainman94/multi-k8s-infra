# The Docker host behind every route whose backend is not in the cluster.
# One selector-less Service and one manual EndpointSlice: the host IP lives
# here and nowhere else. An HTTPRoute picks its app by Service port; Cilium
# maps that to the EndpointSlice port of the same name.
#
# New app on the Docker host: add its port to both lists below (same name in
# both) and a service_<app>.yaml with an HTTPRoute to docker-host:<port>.
apiVersion: v1
kind: Service
metadata:
  name: docker-host
  namespace: cilium
spec:
  ports:
    - name: audiobookshelf
      port: 30067
      targetPort: 30067
      protocol: TCP
    - name: bambuddy
      port: 30669
      targetPort: 30669
      protocol: TCP
    - name: bazarr
      port: 30068
      targetPort: 30068
      protocol: TCP
    - name: dockhand
      port: 30328
      targetPort: 30328
      protocol: TCP
