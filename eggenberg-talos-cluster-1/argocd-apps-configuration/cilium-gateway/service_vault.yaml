apiVersion: v1
kind: Service
metadata:
  name: vault-external
  namespace: cilium
  labels:
    app.kubernetes.io/name: vault
spec:
  ports:
    - port: 30020
      targetPort: 30020
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vault-external-1
  namespace: cilium
  labels:
    app.kubernetes.io/name: vault
    kubernetes.io/service-name: vault-external
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 30020
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: cilium
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - vault.hauptmann.dev
  rules:
    - backendRefs:
        - name: vault-external
          port: 30020
