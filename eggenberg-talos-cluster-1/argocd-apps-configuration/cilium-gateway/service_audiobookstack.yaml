apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  namespace: cilium
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - audiobookshelf.hauptmann.dev
  rules:
    - backendRefs:
        - name: docker-host
          port: 30067
