apiVersion: v1
kind: Service
metadata:
  name: wealthfolio-external
  namespace: cilium
  labels:
    app.kubernetes.io/name: wealthfolio
spec:
  ports:
    - port: 30673
      targetPort: 30673
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wealthfolio-external-1
  namespace: cilium
  labels:
    app.kubernetes.io/name: wealthfolio
    kubernetes.io/service-name: wealthfolio-external
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 30673
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wealthfolio
  namespace: cilium
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - wealth.hauptmann.dev
  rules:
    - backendRefs:
        - name: wealthfolio-external
          port: 30673
