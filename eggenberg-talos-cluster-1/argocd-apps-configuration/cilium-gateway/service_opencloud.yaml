apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud
  namespace: cilium
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - cloud.hauptmann.dev
  rules:
    - backendRefs:
        - name: docker-host
          port: 30980
---
