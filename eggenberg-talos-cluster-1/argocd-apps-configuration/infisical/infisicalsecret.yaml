apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisicalsecret
  namespace: infisical-secrets-operator
spec:
  hostAPI: https://eu.infisical.com/api
  syncConfig:
    resyncInterval: 10s
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-graz
        envSlug: prod
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical-secrets-operator
  managedKubeSecretReferences:
    - secretName: managed-secret
      secretNamespace: infisical-secrets-operator
      creationPolicy: "managed"
    - secretName: cloudflare-api-token
      secretNamespace: cilium
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          CF_DNS_API_TOKEN: "{{ .CLOUDFLARE_API_KEY.Value }}"
    - secretName: docker-pull-secret
      secretNamespace: portfolio
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          .dockerconfigjson: "{{ .GHCR_PULL_SECRET.Value }}"
    # Contact backend credentials. Requires these keys in Infisical
    # (homelab-graz / prod): CONTACT_POSTGRES_PASSWORD, CONTACT_TELEGRAM_BOT_TOKEN,
    # CONTACT_TELEGRAM_CHAT_ID, CONTACT_SMTP_HOST, CONTACT_SMTP_PORT,
    # CONTACT_SMTP_USER, CONTACT_SMTP_PASS, CONTACT_SMTP_FROM, CONTACT_TO_EMAIL.
    - secretName: contact-backend-secrets
      secretNamespace: portfolio
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          POSTGRES_PASSWORD: "{{ .CONTACT_POSTGRES_PASSWORD.Value }}"
          DATABASE_URL: "postgres://contact:{{ .CONTACT_POSTGRES_PASSWORD.Value }}@contact-postgres:5432/contact"
          TELEGRAM_BOT_TOKEN: "{{ .CONTACT_TELEGRAM_BOT_TOKEN.Value }}"
          TELEGRAM_CHAT_ID: "{{ .CONTACT_TELEGRAM_CHAT_ID.Value }}"
          SMTP_HOST: "{{ .CONTACT_SMTP_HOST.Value }}"
          SMTP_PORT: "{{ .CONTACT_SMTP_PORT.Value }}"
          SMTP_USER: "{{ .CONTACT_SMTP_USER.Value }}"
          SMTP_PASS: "{{ .CONTACT_SMTP_PASS.Value }}"
          SMTP_FROM: "{{ .CONTACT_SMTP_FROM.Value }}"
          CONTACT_TO_EMAIL: "{{ .CONTACT_TO_EMAIL.Value }}"
    - secretName: docker-pull-secret
      secretNamespace: portfolio-dev
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          .dockerconfigjson: "{{ .GHCR_PULL_SECRET.Value }}"
    - secretName: contact-backend-secrets
      secretNamespace: portfolio-dev
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          POSTGRES_PASSWORD: "{{ .CONTACT_POSTGRES_PASSWORD.Value }}"
          DATABASE_URL: "postgres://contact:{{ .CONTACT_POSTGRES_PASSWORD.Value }}@contact-postgres:5432/contact"
          TELEGRAM_BOT_TOKEN: "{{ .CONTACT_TELEGRAM_BOT_TOKEN.Value }}"
          TELEGRAM_CHAT_ID: "{{ .CONTACT_TELEGRAM_CHAT_ID.Value }}"
          SMTP_HOST: "{{ .CONTACT_SMTP_HOST.Value }}"
          SMTP_PORT: "{{ .CONTACT_SMTP_PORT.Value }}"
          SMTP_USER: "{{ .CONTACT_SMTP_USER.Value }}"
          SMTP_PASS: "{{ .CONTACT_SMTP_PASS.Value }}"
          SMTP_FROM: "{{ .CONTACT_SMTP_FROM.Value }}"
          CONTACT_TO_EMAIL: "{{ .CONTACT_TO_EMAIL.Value }}"
    - secretName: contact-backend-secrets
      secretNamespace: portfolio-test
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          POSTGRES_PASSWORD: "{{ .CONTACT_POSTGRES_PASSWORD.Value }}"
          DATABASE_URL: "postgres://contact:{{ .CONTACT_POSTGRES_PASSWORD.Value }}@contact-postgres:5432/contact"
          TELEGRAM_BOT_TOKEN: "{{ .CONTACT_TELEGRAM_BOT_TOKEN.Value }}"
          TELEGRAM_CHAT_ID: "{{ .CONTACT_TELEGRAM_CHAT_ID.Value }}"
          SMTP_HOST: "{{ .CONTACT_SMTP_HOST.Value }}"
          SMTP_PORT: "{{ .CONTACT_SMTP_PORT.Value }}"
          SMTP_USER: "{{ .CONTACT_SMTP_USER.Value }}"
          SMTP_PASS: "{{ .CONTACT_SMTP_PASS.Value }}"
          SMTP_FROM: "{{ .CONTACT_SMTP_FROM.Value }}"
          CONTACT_TO_EMAIL: "{{ .CONTACT_TO_EMAIL.Value }}"
    - secretName: docker-pull-secret
      secretNamespace: portfolio-test
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          .dockerconfigjson: "{{ .GHCR_PULL_SECRET.Value }}"
    - secretName: cloudflare-tunnel-secret
      secretNamespace: cloudflared
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          credentials.json: |-
            {
              "AccountTag": "{{ .CLOUDFLARE_ACCOUNT_ID.Value }}",
              "TunnelID": "{{ .CLOUDFLARE_TUNNEL_EGGENBERG_ID.Value }}",
              "TunnelSecret": "{{ .CLOUDFLARE_TUNNEL_EGGENBERG_SECRET.Value }}"
            }
          cert.pem: "{{ .CLOUDFLARE_TUNNEL_EGGENBERG_CERTIFICATE.Value }}"
    - secretName: docker-pull-pat
      secretNamespace: argocd
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          .dockerconfigjson: "{{ .DOCKER_PULL_PAT.Value }}"
    - secretName: ghcr-pull-pat
      secretNamespace: argocd
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          .dockerconfigjson: "{{ .GHCR_PULL_SECRET.Value }}"
    - secretName: git-credentials
      secretNamespace: argocd
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          username: "{{ .ARGOCD_IMAGER_UPDATER_GIT_USERNAME.Value }}"
          password: "{{ .ARGOCD_IMAGER_UPDATER_GIT_PAT.Value }}"
    - secretName: argocd-dex-authentik
      secretNamespace: argocd
      creationPolicy: "managed"
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: argocd
        includeAllSecrets: false
        data:
          DEX_POCKETID_CLIENT_ID: "{{ .ARGOCD_DEX_POCKETID_CLIENT_ID.Value }}"
          DEX_POCKETID_CLIENT_SECRET: "{{ .ARGOCD_DEX_POCKETID_CLIENT_SECRET.Value }}"
          # Argo Workflows client secret for Dex static client
          ARGO_WORKFLOWS_SSO_CLIENT_SECRET: "{{ .ARGO_WORKFLOWS_SSO_CLIENT_SECRET.Value }}"
    - secretName: argo-workflows-sso
      secretNamespace: argocd
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          client-id: "argo-workflows"
          client-secret: "{{ .ARGO_WORKFLOWS_SSO_CLIENT_SECRET.Value }}"
    - secretName: cloudflare-cache-purge
      secretNamespace: argocd
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          zone-id: "{{ .CLOUDFLARE_ZONE_ID_HAUPTMANN_DEV.Value }}"
          api-token: "{{ .CLOUDFLARE_API_KEY.Value }}"
    - secretName: kargo-admin-secret
      secretNamespace: kargo
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          ADMIN_ACCOUNT_PASSWORD_HASH: "{{ .KARGO_ADMIN_PASSWORD_HASH.Value }}"
          ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: "{{ .KARGO_ADMIN_TOKEN_SIGNING_KEY.Value }}"
    - secretName: ghcr-creds
      secretNamespace: pmhme-portfolio
      creationPolicy: "managed"
      template:
        metadata:
          labels:
            kargo.akuity.io/cred-type: image
        includeAllSecrets: false
        data:
          repoURL: "ghcr.io/mainman94/.*"
          repoURLIsRegex: "true"
          username: mainman94
          password: "{{ .GHCR_PULL_TOKEN.Value }}"
    - secretName: github-creds
      secretNamespace: pmhme-portfolio
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        metadata:
          labels:
            kargo.akuity.io/cred-type: git
        data:
          repoURL: https://github.com/mainman94/multi-k8s-infra.git
          username: mainman94
          password: "{{ .ARGOCD_IMAGER_UPDATER_GIT_PAT.Value }}"
    # - secretName: grafana-cloud-creds
    #   secretNamespace: monitoring
    #   creationPolicy: "managed"
    #   template:
    #     includeAllSecrets: false
    #     data:
    #       GRAFANA_CLOUD_USERNAME: "{{ .GRAFANA_CLOUD_USERNAME.Value }}"
    #       GRAFANA_CLOUD_PROM_ID: "2376567"
    #       GRAFANA_CLOUD_TOKEN: "{{ .GRAFANA_CLOUD_TOKEN.Value }}"
    - secretName: velero-secret
      secretNamespace: velero
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          cloud: |-
            [default]
            aws_access_key_id={{ .BACKBLAZE_APPLICATION_KEY_ID_K8S_BACKUP.Value }}
            aws_secret_access_key={{ .BACKBLAZE_APPLICATION_KEY_K8S_BACKUP.Value }}
