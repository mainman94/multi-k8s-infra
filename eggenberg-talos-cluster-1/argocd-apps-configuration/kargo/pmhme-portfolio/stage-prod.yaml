apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: portfolio-kargo
spec:
  vars:
    - name: gitRepo
      value: https://github.com/mainman94/multi-k8s-infra
    - name: repoPath
      value: ./repo
    - name: overlayPath
      value: eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme/overlays/production
    - name: appName
      value: pmhme-portfolio-prod
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pmhme-portfolio
      sources:
        stages:
          - test
        autoPromotionOptions:
          selectionPolicy: NewestFreight
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ${{ vars.repoPath }}
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ${{ vars.repoPath }}/${{ vars.overlayPath }}
            images:
              - image: git.hauptmann.dev/philipphauptmann/pmhme
                tag: ${{ quote(imageFrom("git.hauptmann.dev/philipphauptmann/pmhme").Tag) }}
              - image: git.hauptmann.dev/philipphauptmann/contact-api
                tag: ${{ quote(imageFrom("git.hauptmann.dev/philipphauptmann/contact-api").Tag) }}
              - image: git.hauptmann.dev/philipphauptmann/notifier-telegram
                tag: ${{ quote(imageFrom("git.hauptmann.dev/philipphauptmann/notifier-telegram").Tag) }}
              - image: git.hauptmann.dev/philipphauptmann/notifier-email
                tag: ${{ quote(imageFrom("git.hauptmann.dev/philipphauptmann/notifier-email").Tag) }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.repoPath }}
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ${{ vars.repoPath }}
        # (Optional, recommended) read back what prod overlay now contains
        - uses: yaml-parse
          as: overlay
          config:
            path: ${{ vars.repoPath }}/${{ vars.overlayPath }}/kustomization.yaml
            outputs:
              - name: deployedTag
                fromExpression: filter(images, {.name == "git.hauptmann.dev/philipphauptmann/pmhme"})[0].newTag
        - uses: argocd-update
          as: argo
          config:
            apps:
              - name: ${{ vars.appName }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepo }}
        - uses: http
          as: version-check
          retry:
            timeout: 15m0s
          config:
            method: GET
            url: https://hauptmann.dev/version
            successExpression: response.status == 200 && response.body.version == '${{ outputs.overlay.deployedTag }}'
  verification:
    analysisTemplates:
      - name: pmhme-portfolio-http-check
    args:
      - name: service-name
        value: portfolio-service
      - name: namespace
        value: portfolio
