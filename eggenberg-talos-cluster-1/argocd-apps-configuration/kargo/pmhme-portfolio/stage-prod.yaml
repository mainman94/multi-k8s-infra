apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: portfolio-kargo
spec:
  vars:
    - name: gitRepo
      value: https://github.com/mainman94/multi-k8s-infra
    - name: repoPath
      value: ./repo
    - name: overlayPath
      value: eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme/overlays/production
    - name: appName
      value: pmhme-portfolio-prod
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pmhme-portfolio
      sources:
        stages:
          - test
        autoPromotionOptions:
          selectionPolicy: NewestFreight
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ${{ vars.repoPath }}
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ${{ vars.repoPath }}/${{ vars.overlayPath }}
            images:
              - image: ghcr.io/mainman94/pmhme
                tag: ${{ quote(imageFrom("ghcr.io/mainman94/pmhme").Tag) }}
              - image: ghcr.io/mainman94/contact-api
                tag: ${{ quote(imageFrom("ghcr.io/mainman94/contact-api").Tag) }}
              - image: ghcr.io/mainman94/notifier-telegram
                tag: ${{ quote(imageFrom("ghcr.io/mainman94/notifier-telegram").Tag) }}
              - image: ghcr.io/mainman94/notifier-email
                tag: ${{ quote(imageFrom("ghcr.io/mainman94/notifier-email").Tag) }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.repoPath }}
            message: ${{ outputs['update-image'].commitMessage }}
        # main only accepts pull requests, so the promotion lands as one: push a
        # per-promotion branch, open the PR, let .github/workflows/kargo-automerge.yml
        # merge it once the required checks are green, and wait for that.
        - uses: git-push
          as: push
          config:
            path: ${{ vars.repoPath }}
            targetBranch: kargo/${{ ctx.stage }}/${{ ctx.promotion }}
        - uses: git-open-pr
          as: open-pr
          config:
            repoURL: ${{ vars.gitRepo }}
            provider: github
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            title: 'chore(kargo): promote ${{ ctx.stage }}'
            description: Automated promotion by Kargo (project ${{ ctx.project }}, stage ${{ ctx.stage }}). Merged automatically once the required checks pass.
        - uses: git-wait-for-pr
          as: wait-for-pr
          retry:
            timeout: 30m0s
          config:
            repoURL: ${{ vars.gitRepo }}
            prNumber: ${{ outputs['open-pr'].pr.id }}
        # (Optional, recommended) read back what prod overlay now contains
        - uses: yaml-parse
          as: overlay
          config:
            path: ${{ vars.repoPath }}/${{ vars.overlayPath }}/kustomization.yaml
            outputs:
              - name: deployedTag
                fromExpression: filter(images, {.name == "ghcr.io/mainman94/pmhme"})[0].newTag
        - uses: argocd-update
          as: argo
          config:
            apps:
              - name: ${{ vars.appName }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepo }}
        - uses: http
          as: version-check
          retry:
            timeout: 15m0s
          config:
            method: GET
            url: https://hauptmann.dev/version
            successExpression: response.status == 200 && response.body.version == '${{ outputs.overlay.deployedTag }}'
  verification:
    analysisTemplates:
      - name: pmhme-portfolio-http-check
    args:
      - name: service-name
        value: portfolio-service
      - name: namespace
        value: portfolio
