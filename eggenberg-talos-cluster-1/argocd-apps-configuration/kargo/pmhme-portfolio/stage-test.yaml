apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: pmhme-portfolio
spec:
  vars:
    - name: gitRepo
      value: https://github.com/mainman94/multi-k8s-infra
    - name: repoPath
      value: ./repo
    - name: overlayPath
      value: eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme/overlays/test
    - name: appName
      value: pmhme-portfolio-test
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pmhme-portfolio
      sources:
        direct: true
        autoPromotionOptions:
          selectionPolicy: NewestFreight
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ${{ vars.repoPath }}
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ${{ vars.repoPath }}/${{ vars.overlayPath }}
            images:
              - image: ghcr.io/mainman94/pmhme
                tag: ${{ quote(imageFrom("ghcr.io/mainman94/pmhme").Tag) }}
              - image: ghcr.io/mainman94/contact-api
                tag: ${{ quote(imageFrom("ghcr.io/mainman94/contact-api").Tag) }}
              - image: ghcr.io/mainman94/notifier-telegram
                tag: ${{ quote(imageFrom("ghcr.io/mainman94/notifier-telegram").Tag) }}
              - image: ghcr.io/mainman94/notifier-email
                tag: ${{ quote(imageFrom("ghcr.io/mainman94/notifier-email").Tag) }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.repoPath }}
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ${{ vars.repoPath }}
        - uses: yaml-parse
          as: overlay
          config:
            path: ${{ vars.repoPath }}/${{ vars.overlayPath }}/kustomization.yaml
            outputs:
              - name: deployedTag
                fromExpression: filter(images, {.name == "ghcr.io/mainman94/pmhme"})[0].newTag
        - uses: http
          as: smoke-http-200
          retry:
            timeout: 15m0s
          config:
            method: GET
            url: https://test.hauptmann.dev/
            successExpression: response.status == 200
        - uses: argocd-update
          as: argo
          config:
            apps:
              - name: ${{ vars.appName }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepo }}
        - uses: http
          as: version-check
          retry:
            timeout: 15m0s
          config:
            method: GET
            url: https://test.hauptmann.dev/version
            successExpression: response.status == 200 && response.body.version == '${{ outputs.overlay.deployedTag }}'
