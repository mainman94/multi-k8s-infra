apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: portfolio-kargo
spec:
  vars:
    - name: valuesFile
      value: eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme-chart/test/values.yaml
    - name: appFile
      value: eggenberg-talos-cluster-1/argocd-apps/pmhme/pmhme-test.yaml
    - name: appName
      value: pmhme-portfolio-test
    - name: baseUrl
      value: https://test.hauptmann.dev
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pmhme-portfolio
      sources:
        stages:
          - dev
        autoPromotionOptions:
          selectionPolicy: NewestFreight
  promotionTemplate:
    spec:
      steps:
        - task:
            name: pmhme-promote
  verification:
    analysisTemplates:
      - name: pmhme-portfolio-http-check
    args:
      - name: service-name
        value: portfolio-service
      - name: namespace
        value: portfolio-test
