apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: portfolio-kargo
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: portfolio-kargo
  namespace: portfolio-kargo
spec:
  promotionPolicies:
    - stageSelector:
        name: test
      autoPromotionEnabled: true
    # prod is promoted by hand. Freight reaches this stage only after test's
    # promotion (smoke + version-check) succeeded and the freight was verified
    # there, so the manual click is the last gate rather than the only one.
    - stageSelector:
        name: prod
      autoPromotionEnabled: false
