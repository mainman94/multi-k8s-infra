apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: portfolio-kargo
spec:
  vars:
    - name: gitRepo
      value: https://github.com/mainman94/multi-k8s-infra
    - name: repoPath
      value: ./repo
    - name: valuesFile
      value: eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme-chart/dev/values.yaml
    - name: chartRepo
      value: ghcr.io/mainman94/charts
    - name: chartName
      value: pmhme
    - name: appName
      value: pmhme-portfolio-dev
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pmhme-portfolio
      sources:
        direct: true
        autoPromotionOptions:
          selectionPolicy: NewestFreight
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ${{ vars.repoPath }}
        # Image tags live in the chart's values file; the chart version itself
        # is applied to the Application by argocd-update below.
        - uses: yaml-update
          as: update-image
          config:
            path: ${{ vars.repoPath }}/${{ vars.valuesFile }}
            updates:
              - key: web.image.tag
                value: ${{ imageFrom("ghcr.io/mainman94/pmhme").Tag }}
              - key: contactApi.image.tag
                value: ${{ imageFrom("ghcr.io/mainman94/contact-api").Tag }}
              - key: notifierTelegram.image.tag
                value: ${{ imageFrom("ghcr.io/mainman94/notifier-telegram").Tag }}
              - key: notifierEmail.image.tag
                value: ${{ imageFrom("ghcr.io/mainman94/notifier-email").Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.repoPath }}
            message: 'chore(dev): pmhme ${{ imageFrom("ghcr.io/mainman94/pmhme").Tag }}, contact-api ${{ imageFrom("ghcr.io/mainman94/contact-api").Tag }}, chart ${{ chartFrom("oci://ghcr.io/mainman94/charts/pmhme").Version }}'
        - uses: git-push
          config:
            path: ${{ vars.repoPath }}
        - uses: argocd-update
          as: argo
          config:
            apps:
              - name: ${{ vars.appName }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.chartRepo }}
                    chart: ${{ vars.chartName }}
                    desiredRevision: ${{ chartFrom("oci://ghcr.io/mainman94/charts/pmhme").Version }}
                    updateTargetRevision: true
                  - repoURL: ${{ vars.gitRepo }}
        - uses: http
          as: smoke-http-200
          retry:
            timeout: 15m0s
          config:
            method: GET
            url: https://dev.hauptmann.dev/
            successExpression: response.status == 200
        - uses: http
          as: version-check
          retry:
            timeout: 15m0s
          config:
            method: GET
            url: https://dev.hauptmann.dev/version
            successExpression: response.status == 200 && response.body.version == '${{ imageFrom("ghcr.io/mainman94/pmhme").Tag }}'
  verification:
    analysisTemplates:
      - name: pmhme-portfolio-http-check
    args:
      - name: service-name
        value: portfolio-service
      - name: namespace
        value: portfolio-dev
