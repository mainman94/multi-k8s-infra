api:
  replicas: 1
  host: kargo.hauptmann.dev
  secret:
    name: kargo-admin-secret
  adminAccount:
    # Kept as a break-glass fallback alongside SSO. Disable once OIDC is verified.
    enabled: true
  # SSO via Pocket ID (OIDC + PKCE — public client, no client secret needed, so
  # nothing to store in OpenBao). issuerURL/clientID are public values.
  # Pocket ID group "homelab" (groups claim, requested via additionalScopes).
  oidc:
    enabled: true
    issuerURL: https://id.hauptmann.dev
    clientID: bf4d7cd6-747d-45b8-b70c-55bfba255d09
    usernameClaim: email
    additionalScopes:
      - groups
    admins:
      claims:
        groups:
          - homelab
  argocd:
    urls:
      "": "https://argo.hauptmann.dev"
  ingress:
    enabled: false
    ingressClassName: cilium
    tls:
      enabled: false
  tls:
    enabled: false
    # cilium-gateway terminates TLS and forwards plain HTTP to kargo-api:80
    # (see cilium-gateway/service_kargo.yaml). This forces Kargo to build all its
    # URLs — OIDC redirect_uri and token issuer — as https, so they match the
    # https callback registered in Pocket ID. Without it login fails on a
    # redirect_uri/scheme mismatch.
    terminatedUpstream: true
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 384Mi
controller:
  replicas: 1
  argocd:
    namespace: argocd
    watchArgocdNamespaceOnly: false
  # 7d peak cpu 35m is the highest in this namespace (Argo CD reconcile watch).
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi
webhooksServer:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
externalWebhooksServer:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
managementController:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 192Mi
garbageCollector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
