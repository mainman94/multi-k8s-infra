# yamllint disable rule:line-length
# Resource governance + image hygiene. Audit only (see baseline-pod-security.yaml
# for the rationale on Audit-first). All pmhme images are pinned to explicit tags
# (base seed + overlay images.newTag), so disallow-latest-tag should report clean
# for the portfolio — a good candidate to flip to Enforce first.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pmhme-require-resource-requests
  annotations:
    policies.kyverno.io/title: Require Resource Requests
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must declare CPU and memory requests so the scheduler can place it and autoscalers (KEDA/VPA) have a baseline. Audit globally, Enforced in clean namespaces.
spec:
  validationFailureAction: Audit
  # Enforce only where reports are already clean (see baseline-pod-security.yaml);
  # infra namespaces stay Audit until their requests are set.
  validationFailureActionOverrides:
    - action: Enforce
      namespaces:
        - portfolio # pmhme production overlay
        - portfolio-dev
        - portfolio-test
        # Verified clean (kubectl get polr) after the requests/limits pass.
        - cert-manager
        - external-secrets
        - keda
        - external-dns
        - cnpg-system
        - kyverno
  admission: true
  background: true
  emitWarning: false
  rules:
    - name: require-cpu-memory-requests
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        allowExistingViolations: true
        message: "CPU and memory requests are required on every container."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pmhme-disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Images must use an explicit tag or digest, never :latest or an untagged reference, so deployments are reproducible. Enforced cluster-wide.
spec:
  # Enforced globally: 0 violations across the cluster (all images already pinned),
  # so admission-blocking a :latest or untagged image is safe and prevents drift.
  validationFailureAction: Enforce
  admission: true
  background: true
  emitWarning: false
  rules:
    - name: require-image-tag
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        allowExistingViolations: true
        message: "An explicit image tag or digest is required ('latest' is not allowed)."
        # A wildcard cannot tell `registry:5000/app` (port, no tag) from
        # `app:1.0`; the regex checks for a tag or digest after the last `/`.
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^.+(:[^/:@]+|@sha256:[a-f0-9]{64})$', '{{element.image}}') }}"
                    operator: Equals
                    value: false
    - name: disallow-latest-tag
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        allowExistingViolations: true
        message: "Using a mutable ':latest' tag is not allowed; pin a version or digest."
        pattern:
          spec:
            =(initContainers):
              - image: "!*:latest"
            containers:
              - image: "!*:latest"
