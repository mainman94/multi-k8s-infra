# Defaults spec.securityContext.seccompProfile to RuntimeDefault on new Pods that
# set none, so baseline-pod-security's seccomp check passes without patching
# every chart. Pods that already set a profile are untouched (matchConditions).
# Existing Pods change on their next restart.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-seccomp-runtime-default
  annotations:
    policies.kyverno.io/title: Default seccomp to RuntimeDefault
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/description: >-
      Adds seccompProfile RuntimeDefault to Pods without one. System namespaces
      running privileged node components are excluded. Only Pods are mutated,
      never Deployments/StatefulSets (that would drift in ArgoCD).
spec:
  # Pods only: mutating the controllers' templates would show up as ArgoCD drift.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      # CREATE only: seccompProfile is immutable on a running Pod, so a mutation on
      # UPDATE (e.g. GC removing a finalizer) is rejected and blocks the update.
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, longhorn-system, falco, spegel, velero, kyverno]
  # Only Pods without a profile; an explicit one (Localhost, Unconfined) stays.
  matchConditions:
    - name: no-seccomp-profile
      expression: "!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile)"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{securityContext: Object.spec.securityContext{
          seccompProfile: Object.spec.securityContext.seccompProfile{type: "RuntimeDefault"}}}}
