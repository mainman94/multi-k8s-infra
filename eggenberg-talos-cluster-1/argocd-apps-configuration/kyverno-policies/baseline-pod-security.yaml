# yamllint disable rule:line-length
# Baseline pod-security ClusterPolicy.
#
# validationFailureAction: Audit — reports violations into PolicyReports/Grafana
# WITHOUT blocking admission. Audit-first is the correct rollout order for a new
# admission engine: observe the reports across all namespaces, then flip
# individual rules to Enforce once they are clean.
#
# validate.podSecurity is not used here so each control can be tuned/enforced
# independently and reads clearly in reports.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pmhme-baseline-pod-security
  annotations:
    policies.kyverno.io/title: Baseline Pod Security
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Baseline hardening for workloads: no privilege escalation, run as non-root, read-only root filesystem, all Linux capabilities dropped, RuntimeDefault seccomp profile. Audit globally, Enforced in clean namespaces.
spec:
  validationFailureAction: Audit
  # Enforce only where reports are already clean; everything else stays Audit and
  # keeps producing PolicyReports. Add a namespace here once its violations are
  # resolved (or carved out via a PolicyException) to harden it incrementally.
  validationFailureActionOverrides:
    - action: Enforce
      namespaces:
        - portfolio # pmhme production overlay
        - portfolio-dev
        - portfolio-test
        # Verified clean against this policy (kubectl get polr) and already
        # gated at restricted PodSecurity admission — enforcing here only
        # adds the readOnlyRootFilesystem check PSA doesn't cover.
        - cert-manager
        - external-secrets
        - keda
        - external-dns
        - cnpg-system
        - kyverno
  # admission/emitWarning are Kyverno-defaulted; set explicitly so the stored
  # policy matches git and ArgoCD stays Synced (no drift from the webhook).
  admission: true
  background: true
  emitWarning: false
  rules:
    - name: disallow-privilege-escalation
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        allowExistingViolations: true
        message: "allowPrivilegeEscalation must be set to false."
        pattern:
          spec:
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: "false"
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: "false"
            containers:
              - securityContext:
                  allowPrivilegeEscalation: "false"

    - name: require-run-as-non-root
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        allowExistingViolations: true
        message: "runAsNonRoot must be true (pod or every container)."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: "true"
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: "true"

    - name: require-read-only-root-fs
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        allowExistingViolations: true
        message: "readOnlyRootFilesystem must be set to true."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: "true"

    - name: require-drop-all-capabilities
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        allowExistingViolations: true
        message: "Containers must drop ALL Linux capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL

    - name: require-seccomp-runtime-default
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        allowExistingViolations: true
        message: "seccompProfile.type must be RuntimeDefault (pod or every container)."
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
          - spec:
              containers:
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault
