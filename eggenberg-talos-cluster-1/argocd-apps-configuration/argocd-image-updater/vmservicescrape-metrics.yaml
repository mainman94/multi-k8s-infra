apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: argocd-image-updater-metrics
  namespace: argocd
spec:
  # Replaces the chart's own ServiceMonitor (disabled in values.yaml): the
  # controller-runtime secure metrics server on :8443 needs a bearer token,
  # which the chart's serviceMonitor.authorization field can't express as a
  # raw file path (it only takes a Secret reference).
  endpoints:
    - port: metrics
      path: /metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/instance: argocd-image-updater
      app.kubernetes.io/name: argocd-image-updater
