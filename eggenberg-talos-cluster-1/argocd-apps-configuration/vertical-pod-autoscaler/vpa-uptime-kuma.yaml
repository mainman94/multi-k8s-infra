apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: uptime-kuma-vpa
  namespace: uptime-kuma
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uptime-kuma
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["cpu", "memory"]
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: 1
          memory: 1Gi
