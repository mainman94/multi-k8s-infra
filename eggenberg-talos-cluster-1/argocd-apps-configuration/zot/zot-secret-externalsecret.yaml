# htpasswd for zot, sourced from OpenBao via the "openbao" ClusterSecretStore.
# OpenBao prod/zot must hold property HTPASSWD = a full htpasswd file, e.g.
#   admin:$2y$05$<bcrypt-hash>
# Generate with: htpasswd -nbB admin '<password>'
# Chart mounts this Secret ('<release>-secret' = zot-secret) at /secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secret
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: zot-secret
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/zot
        metadataPolicy: None
        property: HTPASSWD
