apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zot-netpol
  namespace: zot
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  ingress:
    # Cilium Gateway (registry.hauptmann.dev) proxies through the node's
    # Envoy, which shows up as the "host" identity; kubelet probes too.
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Syncs images from upstream registries (see values.yaml sync.registries).
    - toEntities:
        - world
