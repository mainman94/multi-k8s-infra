# Sensor - triggers Cloudflare cache purge workflow on AnalysisRun success
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: cloudflare-cache-purge
  namespace: argocd
spec:
  eventBusName: default
  template:
    serviceAccountName: argo-events-sa
    container:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
  dependencies:
    - name: rollout-completed
      eventSourceName: rollout-completed
      eventName: rollouts
  triggers:
    - template:
        name: cloudflare-purge-trigger
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: cloudflare-cache-purge-
                namespace: argocd
              spec:
                serviceAccountName: argo-workflows-default-sa
                entrypoint: purge-cache
                arguments:
                  parameters:
                    - name: rollout-name
                      value: ""
                    - name: rollout-namespace
                      value: ""
                templates:
                  - name: purge-cache
                    inputs:
                      parameters:
                        - name: rollout-name
                        - name: rollout-namespace
                    container:
                      image: curlimages/curl:8.21.0
                      command: [sh, -c]
                      args:
                        - |
                          echo "Purging Cloudflare cache for rollout: {{inputs.parameters.rollout-name}} in namespace: {{inputs.parameters.rollout-namespace}}"
                          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
                            -H "Authorization: Bearer ${CF_API_TOKEN}" \
                            -H "Content-Type: application/json" \
                            --data '{"purge_everything":true}'
                      env:
                        - name: CF_ZONE_ID
                          valueFrom:
                            secretKeyRef:
                              name: cloudflare-cache-purge
                              key: zone-id
                        - name: CF_API_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: cloudflare-cache-purge
                              key: api-token
          parameters:
            # AnalysisRun has rollout name in label: app
            - src:
                dependencyName: rollout-completed
                dataKey: body.metadata.labels.app
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: rollout-completed
                dataKey: body.metadata.namespace
              dest: spec.arguments.parameters.1.value
