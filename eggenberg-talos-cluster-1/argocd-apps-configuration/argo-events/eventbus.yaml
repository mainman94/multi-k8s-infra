# EventBus - required for Argo Events communication
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argocd
spec:
  nats:
    native:
      replicas: 3
      auth: token
      containerTemplate:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
      metricsContainerTemplate:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
