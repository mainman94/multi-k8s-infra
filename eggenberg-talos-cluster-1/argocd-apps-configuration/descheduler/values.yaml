# Rebalances pods after node reboots/upgrades: a drain piles everything onto
# the nodes that stay schedulable and the scheduler never moves it back.
kind: CronJob
schedule: "*/30 * * * *"

# Chart default container context is already restrictive; only seccomp is missing.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

deschedulerPolicy:
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
        - name: LowNodeUtilization
          args:
            # Node is underutilized only if below ALL of these (% of requests).
            thresholds:
              cpu: 40
              memory: 40
              pods: 40
            # Pods are evicted from nodes above ANY of these.
            targetThresholds:
              cpu: 50
              memory: 50
              pods: 50
      plugins:
        balance:
          enabled:
            - LowNodeUtilization
