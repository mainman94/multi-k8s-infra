# Velero backup solution for cluster disaster recovery and migration
configuration:
  # Cloud provider for backup storage (aws for S3-compatible)
  backupStorageLocation:
    - provider: aws
      bucket: pmhme-k8s-backup
      config:
        # Backblaze S3-compatible endpoint
        s3Url: https://s3.eu-central-003.backblazeb2.com
        # Backblaze B2 rejects the AWS SDK checksum header
        # (x-amz-sdk-checksum-algorithm) with 400 InvalidArgument. Empty disables it.
        # NOTE: this does NOT stop the x-amz-tagging header — up to v1.14.2 the aws
        # plugin sends it unconditionally (even empty), which B2 also 400s. Fixed only
        # on the plugin's main branch, so the initContainer below is pinned to main.
        checksumAlgorithm: ""
        # Use path-style URLs for S3-compatible backends
        s3ForcePathStyle: "true"
        # Backblaze uses standard TLS
        insecureSkipTLSVerify: "false"
        # AWS SDK v2 plugin requires region even with custom endpoint
        region: us-east-1

  # Volume snapshot location (for PV snapshots)
  volumeSnapshotLocation:
    - provider: aws
      config:
        region: us-east-1

  # Velero server configuration. These belong directly under `configuration:` —
  # the chart has no `configuration.velero` block, so nesting them there made
  # Helm drop them silently.
  #
  # defaultVolumeSnapshotLocations was dropped along the way: the flag takes
  # provider:location pairs, so the bare "aws" it used to carry was invalid and
  # only ever "worked" because it was silently discarded. Longhorn has no AWS
  # snapshotter anyway — fs-backup does the work.
  logLevel: info
  uploaderType: kopia

  # Same default for ad-hoc backups as the daily schedule already sets on its
  # own template, so a manual `velero backup create` does not silently skip
  # volumes.
  defaultVolumesToFsBackup: true

  # 12 repositories at the 1h default meant 288 maintenance jobs a day against
  # Backblaze, each one a chance to hit a transient "unexpected EOF" and fail
  # the job (Kopia already retries 10x internally before giving up). With one
  # backup a day and a 48h TTL there is nothing to compact hourly, so this cuts
  # the exposure ~12x.
  defaultRepoMaintainFrequency: 12h

# AWS S3 plugin required for S3-compatible providers (Backblaze, MinIO, etc.)
initContainers:
  - name: velero-plugin-for-aws
    # ponytail: pinned to unreleased main build — only version that gates the
    # x-amz-tagging header (Backblaze B2 rejects it). Repin to the next tagged
    # release > v1.14.2 once one ships with the buildPutObjectInput fix.
    image: velero/velero-plugin-for-aws:main@sha256:0f442cf9263b3a579d9b22417501dfef75e83b300b8180b9394c86d0127ec220
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# Credentials for S3-compatible storage
# Secret created automatically by External Secrets Operator from OpenBao.
credentials:
  useSecret: true
  name: velero-secret

# Backup schedules
schedules:
  daily:
    schedule: "0 2 * * *" # 2 AM daily
    template:
      ttl: "48h" # 2 days retention
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - kube-node-lease
        - kube-public
        - kube-system
        - kube-apiserver
        - monitoring
        - trivy-system
        - portfolio-dev
        - portfolio-test
      includedClusterScopedResources:
        - "*"
      excludedClusterScopedResources:
        - nodes
        - events
        - events.events.k8s.io
      snapshotVolumes: true
      # Longhorn PVs have no native AWS snapshotter; use kopia fs-backup instead
      defaultVolumesToFsBackup: true

# Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Enable metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: velero
    # Prometheus only selects monitors carrying the release label of the
    # kube-prometheus-stack install; without it this ServiceMonitor is ignored.
    additionalLabels:
      release: kube-prometheus-stack

# Kopia configuration for PV backups. The node agent does the actual file
# system backup; what gets backed up is decided by
# configuration.defaultVolumesToFsBackup above.
deployNodeAgent: true
nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Node selector for backup operations (optional)
nodeSelector: {}

# Tolerations for backup operations
tolerations: []

# RBAC
rbac:
  create: true

# Service account
serviceAccount:
  create: true
  name: velero
