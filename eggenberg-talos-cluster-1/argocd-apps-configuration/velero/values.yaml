# Velero backup solution for cluster disaster recovery and migration
configuration:
  # Cloud provider for backup storage (aws for S3-compatible)
  backupStorageLocation:
    provider: aws
    bucket: pmhme-k8s-backup
    config:
      # Backblaze S3-compatible endpoint
      s3Url: https://s3.eu-central-003.backblazeb2.com
      # Use path-style URLs for S3-compatible backends
      s3ForcePathStyle: "true"
      # Backblaze uses standard TLS
      insecureSkipTLSVerify: "false"

  # Volume snapshot location (for PV snapshots)
  volumeSnapshotLocation:
    provider: aws
    config:
      region: us-east-1

  # Velero server configuration
  velero:
    logLevel: info
    # Backup all namespaces by default
    defaultVolumesToRestic: true
    # Upload progress timeout (for large backups)
    uploaderType: restic

# Credentials for S3-compatible storage
credentials:
  useSecret: true
  name: velero-secret
  # Create secret with:
  # kubectl create secret generic velero-secret -n velero \
  #   --from-literal=aws_access_key_id=YOUR_KEY \
  #   --from-literal=aws_secret_access_key=YOUR_SECRET

# Backup schedules
schedules:
  daily:
    schedule: "0 2 * * *"  # 2 AM daily
    template:
      ttl: "720h"  # 30 days retention
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - kube-node-lease
        - kube-public
        - kube-system
        - kube-apiserver
      includedClusterResources:
        - "*"
      excludedClusterResources:
        - nodes
        - events
        - events.events.k8s.io
      snapshotVolumes: true
      # For Longhorn: use restic for PV backup
      defaultVolumesToRestic: true

# Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Enable metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: velero

# Restic configuration for PV backups
restic:
  podVolumeBacking:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Node selector for backup operations (optional)
nodeSelector: {}

# Tolerations for backup operations
tolerations: []

# RBAC
rbac:
  create: true

# Service account
serviceAccount:
  create: true
  name: velero
