# Velero backup solution for cluster disaster recovery and migration
configuration:
  # Cloud provider for backup storage (aws for S3-compatible)
  backupStorageLocation:
    - provider: aws
      bucket: pmhme-k8s-backup
      config:
        # Backblaze S3-compatible endpoint
        s3Url: https://s3.eu-central-003.backblazeb2.com
        # Backblaze B2 rejects the AWS SDK checksum header
        # (x-amz-sdk-checksum-algorithm) with 400 InvalidArgument. Empty disables it.
        # NOTE: this does NOT stop the x-amz-tagging header — up to v1.14.2 the aws
        # plugin sends it unconditionally (even empty), which B2 also 400s. Fixed only
        # on the plugin's main branch, so the initContainer below is pinned to main.
        checksumAlgorithm: ""
        # Use path-style URLs for S3-compatible backends
        s3ForcePathStyle: "true"
        # Backblaze uses standard TLS
        insecureSkipTLSVerify: "false"
        # AWS SDK v2 plugin requires region even with custom endpoint
        region: us-east-1

  # Volume snapshot location (for PV snapshots)
  volumeSnapshotLocation:
    - provider: aws
      config:
        region: us-east-1

  # Velero server configuration. These belong directly under `configuration:` —
  # the chart has no `configuration.velero` block, so nesting them there made
  # Helm drop them silently.
  #
  # defaultVolumeSnapshotLocations was dropped along the way: the flag takes
  # provider:location pairs, so the bare "aws" it used to carry was invalid and
  # only ever "worked" because it was silently discarded. Longhorn has no AWS
  # snapshotter anyway — fs-backup does the work.
  logLevel: info
  uploaderType: kopia

  # Same default for ad-hoc backups as the daily schedule already sets on its
  # own template, so a manual `velero backup create` does not silently skip
  # volumes.
  defaultVolumesToFsBackup: true

  # 12 repositories at the 1h default meant 288 maintenance jobs a day against
  # Backblaze, each one a chance to hit a transient "unexpected EOF" and fail
  # the job (Kopia already retries 10x internally before giving up). With one
  # backup a day and a 48h TTL there is nothing to compact hourly, so this cuts
  # the exposure ~12x.
  defaultRepoMaintainFrequency: 12h

# AWS S3 plugin required for S3-compatible providers (Backblaze, MinIO, etc.)
initContainers:
  - name: velero-plugin-for-aws
    # ponytail: pinned to unreleased main build — only version that gates the
    # x-amz-tagging header (Backblaze B2 rejects it). Repin to the next tagged
    # release > v1.14.2 once one ships with the buildPutObjectInput fix.
    image: velero/velero-plugin-for-aws:main@sha256:9702c0220f33f3bbdc45fa9b547ab3c2d1dd42384fd0e7e659cc5d264fb140e8
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# Credentials for S3-compatible storage
# Secret created automatically by External Secrets Operator from OpenBao.
credentials:
  useSecret: true
  name: velero-secret

# Backup schedules
schedules:
  daily:
    schedule: "0 2 * * *" # 2 AM daily
    template:
      ttl: "48h" # 2 days retention
      includedNamespaces:
        - "*"
      excludedNamespaces:
        - kube-node-lease
        - kube-public
        - kube-system
        - kube-apiserver
        - monitoring
        - trivy-system
        - portfolio-dev
        - portfolio-test
      includedClusterScopedResources:
        - "*"
      excludedClusterScopedResources:
        - nodes
        - events
        - events.events.k8s.io
      # Skip Velero's own kopia repo-maintenance Jobs. They are ephemeral: by
      # the time the backup reaches them their emptyDir volumes (plugins,
      # scratch) are already gone, so the PVB fails with "expected one matching
      # path, got 0" and the whole backup lands in PartiallyFailed. Every one of
      # them carries velero.io/repo-name, and nothing worth restoring does.
      labelSelector:
        matchExpressions:
          - key: velero.io/repo-name
            operator: DoesNotExist
      snapshotVolumes: true
      # Longhorn PVs have no native AWS snapshotter; use kopia fs-backup instead
      defaultVolumesToFsBackup: true

# Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Enable metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: velero
    # Prometheus only selects monitors carrying the release label of the
    # kube-prometheus-stack install; without it this ServiceMonitor is ignored.
    additionalLabels:
      release: kube-prometheus-stack

  # Without these rules a failed nightly backup is only visible by looking at
  # `kubectl get backups`. Same release label as the ServiceMonitor so the
  # kube-prometheus-stack Prometheus picks the rules up.
  prometheusRule:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    spec:
      - alert: VeleroBackupFailed
        expr: increase(velero_backup_failure_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Velero backup failed (schedule {{ $labels.schedule }})"
          description: "A Velero backup run failed in the last hour. Check `kubectl get backups -n velero`."
      - alert: VeleroBackupPartiallyFailed
        expr: increase(velero_backup_partial_failure_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Velero backup partially failed (schedule {{ $labels.schedule }})"
          description: "At least one volume was not backed up. Check the PodVolumeBackups of the run for the failing volume."
      # The daily schedule runs at 02:00; 26h of silence means a run was missed
      # entirely, which no failure counter would catch.
      - alert: VeleroBackupTooOld
        expr: time() - velero_backup_last_successful_timestamp{schedule="velero-daily"} > 26 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No successful Velero backup for more than 26h"
          description: "The last successful run of {{ $labels.schedule }} is older than 26 hours."

# Kopia configuration for PV backups. The node agent does the actual file
# system backup; what gets backed up is decided by
# configuration.defaultVolumesToFsBackup above.
deployNodeAgent: true
nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Node selector for backup operations (optional)
nodeSelector: {}

# Tolerations for backup operations
tolerations: []

# RBAC
rbac:
  create: true

# Service account
serviceAccount:
  create: true
  name: velero
