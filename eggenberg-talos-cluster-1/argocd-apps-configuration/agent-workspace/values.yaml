# Helm values for agent-workspace. The image tag follows the chart appVersion.
agent:
  preset: claude-code

# Read-only view of the cluster (no Secrets). Raise deliberately, never by default.
rbac:
  profile: readonly

# One-time `/login` after the first start; the session lives on this volume.
persistence:
  enabled: true
  size: 10Gi
  storageClass: longhorn

# Shows the pod as an environment under claude.ai/code. The first start asks
# `Enable Remote Control? (y/n)` once: kubectl exec -it <pod> -- tmux attach -t rc
remoteControl:
  enabled: true
  name: homelab-workspace

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
