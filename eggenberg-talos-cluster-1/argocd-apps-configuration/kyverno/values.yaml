# Kyverno Helm chart values.
# https://github.com/kyverno/kyverno/tree/main/charts/kyverno
#
# The admission controller is the enforcement path and runs HA; background/
# reports/cleanup run async policy report and cleanup work and stay at one
# replica. Resource requests kept modest.
#
# Why HA: the ValidatingPolicy webhooks are cluster-wide and failurePolicy=Fail.
# With one replica, evicting it during a node drain rejected every pod creation
# outside kube-system/kyverno until it came back, so evicted replicas elsewhere
# (e.g. Longhorn csi-attacher) couldn't be recreated and their PDBs blocked the
# Talos upgrade drains too.
admissionController:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # A crash-looping replica must not block a drain on its own.
    unhealthyPodEvictionPolicy: AlwaysAllow
  # One per node. ScheduleAnyway: a cordoned node still counts as a domain, so
  # DoNotSchedule would leave an evicted replica Pending for the whole drain.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller
          app.kubernetes.io/instance: kyverno
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  serviceMonitor:
    enabled: true

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

reportsController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# PolicyException support. Off by default in the chart (--enablePolicyException=
# false). Enabled so a single privileged workload in an otherwise-Enforced
# namespace can be carved out with a namespaced PolicyException object (git-
# tracked, auditable) instead of loosening the whole policy. Exceptions are only
# honored in the kyverno namespace so a random namespace cannot self-exempt.
features:
  policyExceptions:
    enabled: true
    namespace: kyverno
