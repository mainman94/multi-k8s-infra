# Discord webhook for vmalertmanager, reusing the same OpenBao secret the old
# kube-prometheus-stack Alertmanager used (prod/discord / ALERTMANAGER_WEBHOOK_URL)
# before it was deleted in PR #552. VM operator requires the full Alertmanager
# config under key "alertmanager.yaml" in a Secret named by
# alertmanager.spec.configSecret (see values.yaml) - templating the webhook URL
# in here keeps it out of git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmalertmanager-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vmalertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: discord
            group_by: ["alertname"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              # severity: info alerts (e.g. CPUThrottlingHigh) are
              # non-actionable noise, not pages - drop instead of notifying.
              - matchers:
                  - severity = info
                receiver: "null"
          receivers:
            - name: discord
              discord_configs:
                - webhook_url: "{{ .ALERTMANAGER_WEBHOOK_URL }}"
            - name: "null"
  data:
    - secretKey: ALERTMANAGER_WEBHOOK_URL
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/discord
        metadataPolicy: None
        property: ALERTMANAGER_WEBHOOK_URL
