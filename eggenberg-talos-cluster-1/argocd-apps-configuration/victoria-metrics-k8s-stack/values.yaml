# yamllint disable rule:line-length
# VictoriaMetrics k8s-stack: replaces splunk-otel-collector for cluster +
# app metrics, and provides Discord alerting via vmalertmanager (see the
# vmalertmanager-config ExternalSecret in this same directory).
#
# fullnameOverride pins every CR to a predictable name ("vm"), so the
# operator's generated Services are always vmsingle-vm / vmagent-vm /
# vmalertmanager-vm — used directly by contact-api's KEDA prometheus
# trigger (pmhme/base/keda.yaml) and Falco's alertmanager hostport.
fullnameOverride: vm

# Exposed at grafana.hauptmann.dev (see httproute.yaml + referencegrant.yaml
# in this same directory). Admin credentials: chart auto-generates a random
# password in the Secret "victoria-metrics-k8s-stack-grafana" (key
# admin-password) since no adminPassword/existingSecret is set here -
# `kubectl -n victoria-metrics-k8s-stack get secret
# victoria-metrics-k8s-stack-grafana -o jsonpath='{.data.admin-password}' | base64 -d`.
grafana:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
defaultDashboards:
  enabled: true

victoria-metrics-operator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

vmsingle:
  spec:
    replicaCount: 1
    retentionPeriod: "3"
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

vmagent:
  spec:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 512Mi
    extraArgs:
      # apiserver /metrics on one control-plane node exceeds the 16Mi default,
      # tripping KubeAPIInstanceUnreachable even though the target is healthy.
      promscrape.maxScrapeSize: 32MiB

# Talos control-plane certs for scheduler/controller-manager are self-signed
# for localhost/127.0.0.1 only, so verifying against the node IP always
# fails TLS and fires KubeSchedulerInstanceUnreachable /
# KubeControllerManagerInstanceUnreachable even though the endpoint is up.
kubeScheduler:
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            insecureSkipVerify: true

kubeControllerManager:
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            insecureSkipVerify: true

# Alertmanager config comes from an externally-managed Secret (ExternalSecret
# in this same directory, sourced from OpenBao prod/discord) instead of
# `alertmanager.config`, so the Discord webhook URL never lands in git.
alertmanager:
  spec:
    replicaCount: 1
    configSecret: vmalertmanager-config
    resources:
      requests:
        cpu: 15m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 15m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 15m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
      # yamllint enable rule:line-length
