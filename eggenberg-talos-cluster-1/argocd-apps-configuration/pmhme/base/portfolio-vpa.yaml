apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: portfolio-vpa
spec:
  targetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: portfolio-app
  updatePolicy:
    # Initial (not InPlaceOrRecreate): only set requests at pod creation, never
    # evict a running pod to resize it. The recreate fallback was cold-starting
    # the web tier and making the first page load slow. VPA still right-sizes on
    # the next natural pod creation (deploy, scale, node move).
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources:
          - cpu
          - memory
        minAllowed:
          # Floor at 100m so VPA never sizes the pod below its cold-boot need.
          cpu: 100m
          memory: 64Mi
        maxAllowed:
          cpu: 2
          memory: 2Gi
