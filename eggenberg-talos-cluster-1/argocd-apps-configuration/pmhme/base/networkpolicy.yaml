apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: portfolio-app-netpol
spec:
  endpointSelector:
    matchLabels:
      app: portfolio-app
  ingress:
    # Cilium Gateway traffic arrives from the Envoy proxy (ingress entity);
    # kubelet probes arrive from the node (host entity).
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Argo Rollouts analysis web checks (controller runs in argocd namespace)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
  egress:
    # DNS via CoreDNS in kube-system
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # External HTTP/HTTPS for server-side fetches
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
