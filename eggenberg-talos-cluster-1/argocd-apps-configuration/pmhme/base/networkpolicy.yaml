apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: portfolio-app-netpol
spec:
  endpointSelector:
    matchLabels:
      app: portfolio-app
  ingress:
    # Cilium Gateway traffic arrives from the Envoy proxy (ingress entity);
    # kubelet probes arrive from the node (host entity).
    # L7: the portfolio serves read-only content, so only GET/HEAD pass —
    # plus POST /api/loadtest, the single-flight KEDA autoscaling demo trigger.
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http:
              - method: GET
              - method: HEAD
              - method: POST
                path: /api/loadtest
    # Argo Rollouts analysis web checks (controller runs in argocd namespace)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http:
              - method: GET
              - method: HEAD
    # /platform golden signals: sibling replicas scrape each other's /metrics
    # directly (no Prometheus anymore — see egress rule below for the read side).
    - fromEndpoints:
        - matchLabels:
            app: portfolio-app
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
    # vmagent scrapes the app's `up` metric for 24h uptime (see the
    # portfolio-app ServiceMonitor in servicemonitor.yaml).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    # DNS via CoreDNS in kube-system
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Platform page: read-only K8s API calls (HPA/pod info) via the mounted
    # ServiceAccount token — see portfolio-app-rbac.yaml.
    - toEntities:
        - kube-apiserver
    # Platform page golden signals: scrape contact-api's own /metrics directly.
    - toEndpoints:
        - matchLabels:
            app: contact-api
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
    # Load-test demo hits contact-api directly (see httproute.yaml - no more
    # KEDA interceptor hop; scaling is read out-of-band from VictoriaMetrics).
    - toEndpoints:
        - matchLabels:
            app: contact-api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /api/contact
    # Platform page golden signals: scrape sibling portfolio-app replicas'
    # own /metrics (mirrors the ingress rule above).
    - toEndpoints:
        - matchLabels:
            app: portfolio-app
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
    # External HTTP/HTTPS for server-side fetches
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
