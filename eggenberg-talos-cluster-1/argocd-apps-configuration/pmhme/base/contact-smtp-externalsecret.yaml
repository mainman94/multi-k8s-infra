# SMTP creds sourced from OpenBao (homelab/prod/smtp) via the cluster-wide
# ClusterSecretStore "openbao". Produces the k8s Secret "contact-smtp" in the
# overlay's namespace. Replaces the SMTP_* + CONTACT_TO_EMAIL keys previously
# templated into the combined contact-backend-secrets Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contact-smtp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: contact-smtp
    creationPolicy: Owner
  data:
    - secretKey: SMTP_HOST
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/smtp
        metadataPolicy: None
        property: HOST
    - secretKey: SMTP_PORT
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/smtp
        metadataPolicy: None
        property: PORT
    - secretKey: SMTP_USER
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/smtp
        metadataPolicy: None
        property: USER
    - secretKey: SMTP_PASS
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/smtp
        metadataPolicy: None
        property: PASSWORD
    - secretKey: SMTP_FROM
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/smtp
        metadataPolicy: None
        property: FROM
    - secretKey: CONTACT_TO_EMAIL
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/smtp
        metadataPolicy: None
        property: TO_EMAIL
