# Core NATS broker for the contact backend — JetStream enabled (memory storage),
# CONTACTS stream with WorkQueue retention, durable consumers per notifier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact-nats
  labels:
    app: contact-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contact-nats
  template:
    metadata:
      labels:
        app: contact-nats
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          # Digest-pinned for immutability; tag kept for readability (Renovate-bumpable).
          image: docker.io/nats:2-alpine@sha256:ad7a43eb7e3337c3c38ce5d784d1461791f95f730f252d2b25eee699752a0ca3
          imagePullPolicy: Always
          # Enable the HTTP monitoring endpoint for health probes.
          args:
            - "--http_port=8222"
            - "-js"
          ports:
            - containerPort: 4222
              name: client
              protocol: TCP
            - containerPort: 8222
              name: monitor
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: js-store
              mountPath: /tmp/nats
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        - name: nats-exporter
          # Digest-pinned for immutability; tag kept for readability (Renovate-bumpable).
          image: docker.io/natsio/prometheus-nats-exporter:0.20.2@sha256:c623b608e148e31e1c1c878673a197f1828e58ce90de4f01d22f1baa84c8fee9
          imagePullPolicy: Always
          args:
            - "-varz"
            - "-connz"
            - "-healthz"
            - "-p=7777"
            - "http://localhost:8222"
          ports:
            - containerPort: 7777
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: js-store
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: contact-nats
  labels:
    app: contact-nats
spec:
  selector:
    app: contact-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
      protocol: TCP
    # HTTP monitoring port (/jsz, /healthz). Published on the Service so the KEDA
    # nats-jetstream scaler can reach it via the Service FQDN to read consumer lag.
    - name: monitor
      port: 8222
      targetPort: monitor
      protocol: TCP
    - name: metrics
      port: 7777
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: contact-nats
  labels:
    app: contact-nats
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: contact-nats
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
