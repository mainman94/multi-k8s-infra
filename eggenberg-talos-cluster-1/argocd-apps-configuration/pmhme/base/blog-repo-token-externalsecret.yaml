# Gitea PAT (read access to portfolio-blogs) sourced from OpenBao
# (homelab/prod/gitea, alongside the docker-pull-secret creds) via the
# cluster-wide ClusterSecretStore "openbao". Produces the k8s Secret
# "blog-repo-token", consumed by portfolio-app via envFrom in rollout.yaml.
# One token for all stages — it's read-only access to a content repo, not
# per-env sensitive data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blog-repo-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: blog-repo-token
    creationPolicy: Owner
  data:
    - secretKey: BLOG_REPO_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/gitea
        metadataPolicy: None
        property: GITEA_BLOG_TOKEN
