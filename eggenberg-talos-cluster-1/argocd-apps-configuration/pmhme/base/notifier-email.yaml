# notifier-email (Go): subscribes contact.created, sends an email via SMTP,
# reports per-channel status back to contact-api /internal.
#
# Argo Rollout (not Deployment): replica count is owned by the KEDA
# ScaledObject (keda-notifiers.yaml), which scales on NATS JetStream consumer
# lag. No `replicas` field here — KEDA is the sole authority. The canary
# strategy has no traffic routing (this is a queue consumer, not an HTTP
# service); its steps gate a new version by pausing between replica-set shifts.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: notifier-email
  labels:
    app: notifier-email
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: notifier-email
  template:
    metadata:
      labels:
        app: notifier-email
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: docker-pull-secret
      containers:
        - name: notifier-email
          image: ghcr.io/mainman94/notifier-email:0.1.3
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: NATS_URL
              value: nats://contact-nats:4222
            - name: HEALTH_PORT
              value: "8081"
            - name: METRICS_PORT
              value: "9090"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: contact-backend-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: contact-backend-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: contact-backend-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: contact-backend-secrets
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: contact-backend-secrets
                  key: SMTP_FROM
            - name: CONTACT_TO_EMAIL
              valueFrom:
                secretKeyRef:
                  name: contact-backend-secrets
                  key: CONTACT_TO_EMAIL
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause:
            duration: 60
      # Gate promotion on the send-failure ratio scraped from the notifier's
      # own OTel metrics (:9090). Starts after the first pause so a bad new
      # version is caught while only half the replicas run it.
      analysis:
        templates:
          - templateName: notifier-failure-rate
        startingStep: 1
        args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: channel
            value: email
