# yamllint disable rule:line-length
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-route
spec:
  parentRefs:
    - name: public
      namespace: cilium
  hostnames:
    - hauptmann.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: portfolio-service
          port: 80
          # yamllint enable rule:line-length
