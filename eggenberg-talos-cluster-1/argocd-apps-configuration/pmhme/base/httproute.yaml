# yamllint disable rule:line-length
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio-route
spec:
  parentRefs:
    - name: public
      namespace: cilium
      sectionName: https
  hostnames:
    - hauptmann.dev
  rules:
    # Public contact form submissions go through the keda-http-add-on
    # interceptor (routes by Host+path to contact-api, see keda.yaml
    # HTTPScaledObject), which also drives request-rate autoscaling.
    # Only /api/contact is exposed; /internal/* is never routed.
    - matches:
        - path:
            type: PathPrefix
            value: /api/contact
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: portfolio-service
          port: 80
          # yamllint enable rule:line-length
