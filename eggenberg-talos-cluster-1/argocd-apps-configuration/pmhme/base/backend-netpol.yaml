# yamllint disable rule:line-length
# Least-privilege Cilium policies for the contact backend.
#
# These are LIVE: referenced by base/kustomization.yaml, so they apply in every
# overlay (dev/test/production). Once an endpoint is selected by ANY
# CiliumNetworkPolicy it becomes default-deny for all non-matching traffic, so
# keep each workload's allowed ingress/egress complete when editing.
#
# Confidentiality: pod-to-pod traffic is encrypted node-to-node by WireGuard
# transparent encryption (bootstrap/cilium). Cilium SPIRE mutual auth
# (authentication.mode: required) was removed — deprecated in 1.20 and the SPIRE
# server was crashlooping. These policies remain the L4 segmentation layer;
# inline "meshed edge"/"no mutual auth" notes below refer to the old SPIRE model.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: contact-api-netpol
spec:
  endpointSelector:
    matchLabels:
      app: contact-api
  ingress:
    # Public form submissions arrive via the Cilium Gateway (ingress entity).
    # Only POST /api/contact is allowed; /internal/* is NOT reachable this way.
    # No mutual auth: external clients carry no SPIFFE identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: "/api/contact"
    # kubelet health probes from the node. No mutual auth (host has no identity).
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/healthz"
              - method: GET
                path: "/readyz"
    # Prometheus metrics scrape from monitoring namespace.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
    # Platform page "run load test": portfolio-app drives /healthz to scale
    # contact-api via KEDA. Meshed edge (mutual auth); GET /healthz only, so it
    # cannot reach /api/contact or /internal/* through this rule.
    - fromEndpoints:
        - matchLabels:
            app: portfolio-app
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/healthz"
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # contact-api -> contact-postgres (CNPG primary). No Cilium mutual auth:
    # CNPG runs its own PostgreSQL TLS, layering SPIRE mTLS on top risks
    # double-mTLS breakage. Selects CNPG instance pods by cluster label.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: contact-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Meshed edge: contact-api -> contact-nats.
    - toEndpoints:
        - matchLabels:
            app: contact-nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # Meshed edge: contact-api -> contact-valkey (rate limit counters).
    - toEndpoints:
        - matchLabels:
            app: contact-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# CNPG instance pods (contact-postgres cluster). No Cilium mutual auth on any
# edge — CNPG manages its own PostgreSQL/replication TLS; the cluster label
# selects both instances. Ports: 5432 postgres+replication, 8000 instance
# manager (probes + operator), 9187 metrics exporter.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: contact-postgres-netpol
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: contact-postgres
  ingress:
    # contact-api client connections.
    - fromEndpoints:
        - matchLabels:
            app: contact-api
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Streaming replication + instance-manager traffic between peers.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: contact-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # CNPG operator (cnpg-system) manages the instances (postgres + instance
    # manager status port).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # kubelet health probes hit the instance manager (:8000) from the node.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Streaming replication + instance-manager traffic to the peer instance.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: contact-postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # Instance manager talks to the Kubernetes API server.
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: contact-nats-netpol
spec:
  endpointSelector:
    matchLabels:
      app: contact-nats
  ingress:
    # NATS client port: contact-api (publish) + notifiers (subscribe).
    # Meshed edge: require mutual auth from all three clients.
    - fromEndpoints:
        - matchLabels:
            app: contact-api
        - matchLabels:
            app: notifier-telegram
        - matchLabels:
            app: notifier-email
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # kubelet probes hit the monitoring port. No mutual auth (host has no identity).
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8222"
              protocol: TCP
    # KEDA operator polls the JetStream monitoring endpoint (:8222 /jsz) to read
    # per-consumer lag for the notifier ScaledObjects. No mutual auth: KEDA has
    # no SPIFFE identity, same rationale as the Prometheus scrape below.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keda
      toPorts:
        - ports:
            - port: "8222"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace (nats-exporter sidecar).
    # No mutual auth.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "7777"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notifier-telegram-netpol
spec:
  endpointSelector:
    matchLabels:
      app: notifier-telegram
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace. No mutual auth.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Meshed edge: notifier-telegram -> contact-nats.
    - toEndpoints:
        - matchLabels:
            app: contact-nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # Telegram Bot API (api.telegram.org) over HTTPS. No mutual auth (world).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notifier-email-netpol
spec:
  endpointSelector:
    matchLabels:
      app: notifier-email
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace. No mutual auth.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Meshed edge: notifier-email -> contact-nats.
    - toEndpoints:
        - matchLabels:
            app: contact-nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # Outbound SMTP relay (submission/implicit-TLS/legacy). No mutual auth (world).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "25"
              protocol: TCP
              # yamllint enable rule:line-length
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: contact-valkey-netpol
spec:
  endpointSelector:
    matchLabels:
      app: contact-valkey
  ingress:
    # Meshed edge: only contact-api may reach Valkey.
    - fromEndpoints:
        - matchLabels:
            app: contact-api
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # kubelet health probes from the node.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
