# yamllint disable rule:line-length
# Least-privilege Cilium policies for the contact backend.
#
# These are LIVE: referenced by base/kustomization.yaml, so they apply in every
# overlay (dev/test/production). Once an endpoint is selected by ANY
# CiliumNetworkPolicy it becomes default-deny for all non-matching traffic, so
# keep each workload's allowed ingress/egress complete when editing.
#
# Service mesh: in-cluster app->app edges carry `authentication.mode: required`
# (Cilium SPIRE mutual auth, enabled cluster-wide in bootstrap/cilium). Auth is
# scoped to the specific pod-to-pod edges ONLY. DNS (kube-dns), world egress
# (SMTP/Telegram), kubelet host probes, and Prometheus scrapes are deliberately
# left unauthenticated — those peers have no SPIFFE identity and requiring mutual
# auth toward them would drop the traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: contact-api-netpol
spec:
  endpointSelector:
    matchLabels:
      app: contact-api
  ingress:
    # Public form submissions arrive via the Cilium Gateway (ingress entity).
    # Only POST /api/contact is allowed; /internal/* is NOT reachable this way.
    # No mutual auth: external clients carry no SPIFFE identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: "/api/contact"
    # kubelet health probes from the node. No mutual auth (host has no identity).
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/healthz"
              - method: GET
                path: "/readyz"
    # Prometheus metrics scrape from monitoring namespace.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
    # Platform page "run load test": portfolio-app drives /healthz to scale
    # contact-api via KEDA. Meshed edge (mutual auth); GET /healthz only, so it
    # cannot reach /api/contact or /internal/* through this rule.
    - fromEndpoints:
        - matchLabels:
            app: portfolio-app
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/healthz"
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Meshed edge: contact-api -> contact-postgres.
    - toEndpoints:
        - matchLabels:
            app: contact-postgres
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Meshed edge: contact-api -> contact-nats.
    - toEndpoints:
        - matchLabels:
            app: contact-nats
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # Meshed edge: contact-api -> contact-valkey (rate limit counters).
    - toEndpoints:
        - matchLabels:
            app: contact-valkey
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: contact-postgres-netpol
spec:
  endpointSelector:
    matchLabels:
      app: contact-postgres
  ingress:
    # Meshed edge: require mutual auth from contact-api.
    - fromEndpoints:
        - matchLabels:
            app: contact-api
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace.
    # No mutual auth: keep scraping decoupled from the app mesh.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: contact-nats-netpol
spec:
  endpointSelector:
    matchLabels:
      app: contact-nats
  ingress:
    # NATS client port: contact-api (publish) + notifiers (subscribe).
    # Meshed edge: require mutual auth from all three clients.
    - fromEndpoints:
        - matchLabels:
            app: contact-api
        - matchLabels:
            app: notifier-telegram
        - matchLabels:
            app: notifier-email
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # kubelet probes hit the monitoring port. No mutual auth (host has no identity).
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8222"
              protocol: TCP
    # KEDA operator polls the JetStream monitoring endpoint (:8222 /jsz) to read
    # per-consumer lag for the notifier ScaledObjects. No mutual auth: KEDA has
    # no SPIFFE identity, same rationale as the Prometheus scrape below.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keda
      toPorts:
        - ports:
            - port: "8222"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace (nats-exporter sidecar).
    # No mutual auth.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "7777"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notifier-telegram-netpol
spec:
  endpointSelector:
    matchLabels:
      app: notifier-telegram
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace. No mutual auth.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Meshed edge: notifier-telegram -> contact-nats.
    - toEndpoints:
        - matchLabels:
            app: contact-nats
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # Telegram Bot API (api.telegram.org) over HTTPS. No mutual auth (world).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notifier-email-netpol
spec:
  endpointSelector:
    matchLabels:
      app: notifier-email
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Prometheus metrics scrape from monitoring namespace. No mutual auth.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Meshed edge: notifier-email -> contact-nats.
    - toEndpoints:
        - matchLabels:
            app: contact-nats
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # Outbound SMTP relay (submission/implicit-TLS/legacy). No mutual auth (world).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "25"
              protocol: TCP
              # yamllint enable rule:line-length
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: contact-valkey-netpol
spec:
  endpointSelector:
    matchLabels:
      app: contact-valkey
  ingress:
    # Meshed edge: only contact-api may reach Valkey.
    - fromEndpoints:
        - matchLabels:
            app: contact-api
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # kubelet health probes from the node.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
