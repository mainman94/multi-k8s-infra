# KEDA ScaledObject: scales contact-api on live HTTP request rate, read from
# VictoriaMetrics (vmsingle-vm), which scrapes cilium-envoy's per-backend
# stats via envoy.prometheus.serviceMonitor in bootstrap/cilium/values.yaml.
# Replaces the old HTTPScaledObject + keda-http-add-on interceptor: traffic
# now goes straight to contact-api (see httproute.yaml) and KEDA reads the
# rate out-of-band instead of proxying every request through an interceptor.
#
# envoy_cluster_upstream_rq_total{envoy_cluster_name="cilium/cilium-gateway-public/<namespace>_contact-api_8080"}
# verified live on-cluster (kubectl port-forward into a cilium-envoy pod,
# port 9964, /metrics) - Cilium names each Envoy cluster
# "cilium/cilium-gateway-<gateway>/<backend-namespace>_<backend-service>_<port>",
# one per HTTPRoute backendRef, so this counts only contact-api's own traffic.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: contact-api-scaledobject
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: contact-api
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 15
  cooldownPeriod: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://vmsingle-vm.victoria-metrics-k8s-stack.svc.cluster.local:8428
        metricName: contact_api_request_rate
        threshold: "3"
        # Namespace-scoped so dev/test overlays (see httpscaledobject-patch.yaml)
        # can override just the backend-namespace segment of the cluster name.
        query: >-
          sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name="cilium/cilium-gateway-public/portfolio_contact-api_8080"}[1m]))
