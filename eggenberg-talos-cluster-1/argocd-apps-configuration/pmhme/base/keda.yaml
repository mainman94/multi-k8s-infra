# KEDA ScaledObject: scales contact-api horizontally based on HTTP request rate
# scraped from Prometheus. Idle (< 3 req/s avg): 1 replica. Burst: up to 4.
# Tuned to be responsive so the /platform "run load test" button visibly drives
# a 1->4 scale-up and back: low threshold, 1m rate window, 15s polling, and an
# aggressive scale-up / fast (30s) scale-down HPA behavior.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: contact-api-scaledobject
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: contact-api
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 15
  cooldownPeriod: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 4
              periodSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: contact_api_http_requests_rate
        query: sum(rate(contact_api_http_requests_total{namespace="NAMESPACE_PLACEHOLDER"}[1m]))
        threshold: "3"
