# KEDA HTTPScaledObject: scales contact-api horizontally based on live HTTP
# request rate through the keda-http-add-on interceptor (no Prometheus
# dependency — the interceptor proxies /api/contact traffic itself, see
# httproute.yaml). Idle (< 3 req/s avg over 40s): 1 replica. Burst: up to 4.
# Tuned to be responsive so the /platform "run load test" button visibly
# drives a 1->4 scale-up and back: low threshold, 40s window, aggressive
# scale-up / fast (30s) scale-down HPA behavior.
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: contact-api-scaledobject
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: contact-api
    service: contact-api
    port: 8080
  hosts:
    - hauptmann.dev
  pathPrefixes:
    - /api/contact
  replicas:
    min: 1
    max: 4
  scaledownPeriod: 30
  scalingMetric:
    requestRate:
      granularity: 1s
      window: 40s
      targetValue: 3
