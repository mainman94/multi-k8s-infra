# Existing API-scoped Splunk Observability admin token for SignalFlow queries.
# The Secret is optional in rollout.yaml so a missing token degrades the
# dashboard fields to "unavailable" without blocking the application rollout.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-splunk-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: portfolio-splunk-api
    creationPolicy: Owner
  data:
    - secretKey: SPLUNK_ACCESS_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/splunk
        metadataPolicy: None
        property: ADMIN_TOKEN
