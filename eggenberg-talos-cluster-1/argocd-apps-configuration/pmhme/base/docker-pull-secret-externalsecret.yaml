# Gitea container-registry pull credentials sourced from OpenBao (prod/gitea)
# via the cluster-wide ClusterSecretStore "openbao". Builds the dockerconfigjson
# Secret "docker-pull-secret" in the overlay's namespace from the raw
# PACKAGE_PAT token, consumed by the pmhme workloads' imagePullSecrets so
# kubelet can pull the private git.hauptmann.dev/philipphauptmann/* images.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-pull-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: docker-pull-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"git.hauptmann.dev":{"username":"{{ .username }}","password":"{{ .pat }}","auth":"{{ printf "%s:%s" .username .pat | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/gitea
        metadataPolicy: None
        property: PACKAGE_USERNAME
    - secretKey: pat
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/gitea
        metadataPolicy: None
        property: PACKAGE_PAT
