# GHCR pull credentials sourced from OpenBao (prod/github) via the cluster-wide
# ClusterSecretStore "openbao". Produces the dockerconfigjson Secret
# "docker-pull-secret" in the overlay's namespace, consumed by the pmhme
# workloads' imagePullSecrets so kubelet can pull the private
# ghcr.io/mainman94/* images. Replaces the docker-pull-secret entries the
# Infisical operator previously synced into the portfolio namespaces.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-pull-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: docker-pull-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/github
        metadataPolicy: None
        property: GHCR_PULL_SECRET
