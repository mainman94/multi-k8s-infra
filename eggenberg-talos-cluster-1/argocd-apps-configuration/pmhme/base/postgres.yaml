# CloudNativePG cluster for the contact backend. Replaces the hand-rolled
# single-replica StatefulSet: 1 primary + 1 replica with streaming replication
# and automatic failover, managed by the CNPG operator (cnpg-system).
#
# Services created by the operator: contact-postgres-rw (primary, read/write),
# contact-postgres-ro (replicas), contact-postgres-r (any). contact-api targets
# contact-postgres-rw (see contact-db-externalsecret.yaml DATABASE_URL).
#
# contact-api auto-creates the `contact_requests` table on startup
# (CREATE TABLE IF NOT EXISTS) — greenfield, no migration job.
#
# Backups: Velero (kopia fs-backup of the PVs) for now. PITR via the
# barman-cloud plugin is deferred (see the design spec amendment).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: contact-postgres
  labels:
    app: contact-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  # Reuse the ESO-managed contact-db secret (from OpenBao) as the app-user
  # credentials, so the password still lives in OpenBao (per-env property patch
  # unchanged). CNPG reads the basic-auth username/password keys added to that
  # secret. initdb creates database `contact` owned by user `contact`.
  bootstrap:
    initdb:
      database: contact
      owner: contact
      secret:
        name: contact-db

  storage:
    storageClass: longhorn-cnpg
    size: 2Gi

  # Spread primary + replica across nodes.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # CNPG can auto-create a PodMonitor, but Prometheus only selects monitors
  # labelled release=kube-prometheus-stack — the operator's PodMonitor can't
  # carry that label, so disable it and ship our own below.
  monitoring:
    enablePodMonitor: false
---
# Scrapes the CNPG instances' built-in metrics exporter (:9187). Labelled for
# the kube-prometheus-stack Prometheus selector, mirroring the other backend
# ServiceMonitors.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: contact-postgres
  labels:
    app: contact-postgres
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: contact-postgres
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
