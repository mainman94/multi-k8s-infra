# Same-namespace allow mesh for portfolio-app. Previously enforced Cilium mutual
# authentication (SPIRE mTLS); that is removed (deprecated in 1.20, SPIRE was
# crashlooping) — pod traffic is now encrypted by WireGuard transparent
# encryption. Empty fromEndpoints/toEndpoints selectors match all pods in the
# policy's own namespace, keeping the same-namespace allow each overlay relies on.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: portfolio-mtls-required
spec:
  endpointSelector:
    matchLabels:
      app: portfolio-app
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - {}
