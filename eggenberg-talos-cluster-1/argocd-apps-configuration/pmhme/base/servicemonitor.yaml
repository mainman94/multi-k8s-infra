apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portfolio-app
  labels:
    app: portfolio-app
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: portfolio-app
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
# NOTE: below is contact-api. It is scraped every 10s (not 30s) so the KEDA
# rate() metric and the /platform live panel react to the "run load test"
# button within seconds instead of jumping in 30s staircase steps.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: contact-api
  labels:
    app: contact-api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: contact-api
  endpoints:
    - port: metrics
      interval: 10s
      path: /metrics
