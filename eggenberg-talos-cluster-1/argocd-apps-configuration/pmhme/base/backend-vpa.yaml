# VPA for contact backend services. InPlaceOrRecreate: tries in-place CPU/memory
# resize first; falls back to pod recreation only if the runtime can't do it live.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: contact-api-vpa
spec:
  targetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: contact-api
  updatePolicy:
    # Initial (not InPlaceOrRecreate): don't evict/recreate a running pod to
    # resize it. A recreate cold-starts contact-api, which runs db.migrate() +
    # NATS connect before serving, making the first contact message slow.
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: contact-api
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 25m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: contact-valkey-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contact-valkey
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: valkey
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 200m
          memory: 128Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: contact-nats-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contact-nats
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: nats
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 12m
          memory: 64Mi
        maxAllowed:
          cpu: 250m
          memory: 256Mi
      - containerName: nats-exporter
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 100m
          memory: 64Mi
          # contact-postgres has no VPA: CNPG owns instance pod resources (set in the
          # Cluster spec) and manages its own rollout — a VPA would fight the operator.
