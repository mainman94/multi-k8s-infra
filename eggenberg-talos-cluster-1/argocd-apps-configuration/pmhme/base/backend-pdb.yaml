# Only contact-api is KEDA-scaled (1-4 replicas); postgres/nats/notifiers are
# single-replica so a PDB on them would just block node drains for no
# availability gain. maxUnavailable:1 allows drain at min scale (1 replica)
# while limiting disruption when scaled out.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: contact-api-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: contact-api
  unhealthyPodEvictionPolicy: IfHealthyBudget
