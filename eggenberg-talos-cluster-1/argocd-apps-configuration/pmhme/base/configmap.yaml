apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-app-config
  labels:
    app: portfolio-app
data:
  STAGE: "base"
  LOG_LEVEL: "info"
  TELEMETRY_ENABLED: "true"
  OTEL_SERVICE_NAME: "hauptmann-portfolio"
  # Tempo OTLP/HTTP receiver. Egress opened in networkpolicy.yaml (port 4318).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4318"
  # Platform page: server-side Prometheus read for /platform cluster metrics.
  PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  OPS_NAMESPACE: "portfolio"
  # Origin for canonical/OG URLs. Overridden per env so dev/test self-canonicalise.
  SITE_URL: "https://hauptmann.dev"
  # Analytics: shipped only when both are set. dev/test blank them to opt out.
  UMAMI_SCRIPT_URL: "https://umami.hauptmann.dev/script.js"
  UMAMI_WEBSITE_ID: "06b02831-8ba7-4603-a821-9fa473ac1c08"
  # Blog content — cloned/pulled at runtime from a separate git repo (see
  # portfolio's src/utils/blogRepoSync.ts), same across all stages. Token
  # comes from blog-repo-token-externalsecret.yaml, not this ConfigMap.
  BLOG_REPO_URL: "https://git.hauptmann.dev/philipphauptmann/portfolio-blogs.git"
  BLOG_REPO_BRANCH: "main"
  # "test" while trying things out — drop this key once real posts move to
  # the content repo's root.
  BLOG_REPO_CONTENT_PATH: "test"
  BLOG_REPO_REFRESH_MS: "300000"
  # CSP img-src allowlist for cover images + inline post images, which point
  # at this same host's raw-file URLs.
  BLOG_IMAGE_ORIGIN: "https://git.hauptmann.dev"
