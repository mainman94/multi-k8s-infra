# Postgres creds sourced from OpenBao (homelab/prod/contact) via the cluster-wide
# ClusterSecretStore "openbao". Produces the k8s Secret "contact-db" in the
# overlay's namespace. DATABASE_URL is templated from the same password so the
# two never diverge. Replaces the POSTGRES_PASSWORD + DATABASE_URL keys
# previously templated into contact-backend-secrets by the Infisical operator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contact-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: contact-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        DATABASE_URL: "postgres://contact:{{ .POSTGRES_PASSWORD }}@contact-postgres:5432/contact"
  data:
    # Per-env password lives under one OpenBao secret (prod/contact) keyed by
    # env suffix. Base defaults to PROD; dev/test overlays patch this property.
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: prod/contact
        property: POSTGRES_PASSWORD_PROD
