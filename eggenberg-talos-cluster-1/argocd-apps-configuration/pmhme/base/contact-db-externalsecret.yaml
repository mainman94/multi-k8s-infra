# Postgres creds sourced from OpenBao (homelab/prod/contact) via the cluster-wide
# ClusterSecretStore "openbao". Produces the k8s Secret "contact-db" in the
# overlay's namespace. DATABASE_URL is templated from the same password so the
# two never diverge. Replaces the POSTGRES_PASSWORD + DATABASE_URL keys
# previously templated into the combined contact-backend-secrets Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contact-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: contact-db
    creationPolicy: Owner
    # username/password keys so CNPG bootstrap.initdb.secret can consume this
    # same secret as the app-user credentials. Kept as the default Opaque type:
    # a Secret's type is immutable, and the pre-existing contact-db secret is
    # Opaque, so switching to kubernetes.io/basic-auth would block ESO updates.
    # CNPG reads the username/password keys regardless of type. DATABASE_URL +
    # POSTGRES_PASSWORD stay for contact-api; host is the CNPG primary service
    # contact-postgres-rw.
    template:
      engineVersion: v2
      data:
        username: contact
        password: "{{ .POSTGRES_PASSWORD }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        DATABASE_URL: "postgres://contact:{{ .POSTGRES_PASSWORD }}@contact-postgres-rw:5432/contact"
  data:
    # Per-env password lives under one OpenBao secret (prod/contact) keyed by
    # env suffix. Base defaults to PROD; dev/test overlays patch this property.
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prod/contact
        metadataPolicy: None
        property: POSTGRES_PASSWORD_PROD
