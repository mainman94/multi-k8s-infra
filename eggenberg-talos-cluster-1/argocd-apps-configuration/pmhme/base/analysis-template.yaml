# yamllint disable rule:line-length
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: contact-api-error-rate
spec:
  args:
    - name: namespace
  metrics:
    - name: error-rate
      interval: 30s
      failureLimit: 1
      inconclusiveLimit: 10
      successCondition: isNaN(result) || result < 0.05
      failureCondition: "!isNaN(result) && result >= 0.05"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            sum(rate(contact_api_http_requests_total{namespace="{{args.namespace}}",status=~"5.*"}[2m])) / sum(rate(contact_api_http_requests_total{namespace="{{args.namespace}}"}[2m]))
---
# Send-failure ratio for a notifier channel, from its OTel counter
# notifier_notifications_total{channel,result}. isNaN (no traffic yet) passes so
# a quiet notifier isn't blocked from promoting.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: notifier-failure-rate
spec:
  args:
    - name: namespace
    - name: channel
  metrics:
    - name: failure-rate
      interval: 30s
      failureLimit: 1
      inconclusiveLimit: 10
      successCondition: isNaN(result) || result < 0.10
      failureCondition: "!isNaN(result) && result >= 0.10"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: >-
            sum(rate(notifier_notifications_total{namespace="{{args.namespace}}",channel="{{args.channel}}",result="failed"}[2m])) / sum(rate(notifier_notifications_total{namespace="{{args.namespace}}",channel="{{args.channel}}"}[2m]))
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: portfolio-http-check
spec:
  args:
    - name: service-name
    - name: namespace
  metrics:
    - name: http-health-check
      initialDelay: 45s
      interval: 5s
      count: 3
      successCondition: result.statusCode == 200
      failureCondition: result.statusCode != 200
      failureLimit: 3
      inconclusiveLimit: 2
      provider:
        web:
          url: "http://{{args.service-name}}.{{args.namespace}}.svc.cluster.local"
          timeoutSeconds: 10
          insecure: true
          headers:
            - key: "User-Agent"
              value: "Argo-Rollouts-Health-Check"
