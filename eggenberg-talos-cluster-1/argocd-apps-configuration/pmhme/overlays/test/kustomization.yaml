apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-test
labels:
- pairs:
    app.kubernetes.io/environment: test
  includeTemplates: true
resources:
- namespace.yaml
- ../../base
components:
- ../../components/notification-sink
- ../../components/keda-ns-scoped
images:
- name: ghcr.io/mainman94/contact-api
  newTag: 0.10.0
- name: ghcr.io/mainman94/notifier-email
  newTag: 0.4.0
- name: ghcr.io/mainman94/notifier-telegram
  newTag: 0.4.0
- name: ghcr.io/mainman94/pmhme
  newTag: 0.27.1
patches:
- patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/property
      value: POSTGRES_PASSWORD_TEST
  target:
    kind: ExternalSecret
    name: contact-db
- patch: |-
    # JSON6902 by index, not strategic merge: kustomize has no OpenAPI
    # schema for the Rollout CRD, so a strategic-merge patch here would
    # replace the whole `env` list instead of merging by name (verified -
    # it silently wiped every other env var). Index 5 = OTEL_SERVICE_NAME
    # in base's env list (pmhme/base/contact-api.yaml) - re-check this
    # index if that list's order/length ever changes.
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: hauptmann-contact-api-test
  target:
    kind: Rollout
    name: contact-api
- path: httproute-patch.yaml
- path: httpscaledobject-patch.yaml
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: portfolio-app-config
