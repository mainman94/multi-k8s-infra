apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-test
labels:
- pairs:
    app.kubernetes.io/environment: test
  includeTemplates: true
resources:
- namespace.yaml
- ../../base
images:
- name: dockerha08/pmhme
  newTag: 0.1.1
patches:
- path: httproute-patch.yaml
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: portfolio-app-config
