apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-test
labels:
  - pairs:
      app.kubernetes.io/environment: test
    includeTemplates: true
resources:
  - namespace.yaml
  - ../../base
components:
  - ../../components/notification-sink
  - ../../components/keda-ns-scoped
images:
  - name: ghcr.io/mainman94/contact-api
    newTag: 0.4.1
  - name: ghcr.io/mainman94/notifier-email
    newTag: 0.2.0
  - name: ghcr.io/mainman94/notifier-telegram
    newTag: 0.2.0
  - name: ghcr.io/mainman94/pmhme
    newTag: 0.5.1
patches:
  - patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/property
        value: POSTGRES_PASSWORD_TEST
    target:
      kind: ExternalSecret
      name: contact-db
  - path: httproute-patch.yaml
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: portfolio-app-config
