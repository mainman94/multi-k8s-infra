apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-dev
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeTemplates: true
resources:
  - namespace.yaml
  - ../../base
components:
  - ../../components/notification-sink
  - ../../components/keda-ns-scoped
images:
  - name: git.hauptmann.dev/philipphauptmann/pmhme
    newTag: 0.25.0
  - name: git.hauptmann.dev/philipphauptmann/contact-api
    newTag: 0.9.1
  - name: git.hauptmann.dev/philipphauptmann/notifier-telegram
    newTag: 0.3.1
  - name: git.hauptmann.dev/philipphauptmann/notifier-email
    newTag: 0.3.1
patches:
  - patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/property
        value: POSTGRES_PASSWORD_DEV
    target:
      kind: ExternalSecret
      name: contact-db
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/6/value
        value: hauptmann-contact-api-dev
    target:
      kind: Rollout
      name: contact-api
  - path: httproute-patch.yaml
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: portfolio-app-config
