apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio
labels:
- pairs:
    app.kubernetes.io/environment: production
  includeTemplates: true
resources:
- namespace.yaml
- ../../base
components:
- ../../components/keda-ns-scoped
images:
- name: ghcr.io/mainman94/contact-api
  newTag: 0.3.2
- name: ghcr.io/mainman94/notifier-email
  newTag: 0.1.7
- name: ghcr.io/mainman94/notifier-telegram
  newTag: 0.1.7
- name: ghcr.io/mainman94/pmhme
  newTag: 0.2.0
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Rollout
    name: portfolio-app
- path: httproute-patch.yaml
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: portfolio-app-config
