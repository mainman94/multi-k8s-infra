# yamllint disable rule:line-length
# Kyverno policy engine. Installed via the official Helm chart, values pulled
# from this repo (same multi-source pattern as the KEDA app). sync-wave 0 so the
# CRDs land before the kyverno-policies app (wave 1) tries to create policies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    category: security
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.0
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/kyverno/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        # The Helm chart renders empty maps for CRD metadata; the apiserver drops
        # them, which otherwise leaves persistent cosmetic drift.
        - /metadata/annotations
        - /metadata/labels
        - /metadata/managedFields
        # The apiserver maintains this from persisted CR versions; Kyverno chart
        # upgrades can leave historical storage versions here and cause CRD drift.
        - /status/storedVersions
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
        # yamllint enable rule:line-length
