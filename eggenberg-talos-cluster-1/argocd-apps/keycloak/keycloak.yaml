# Keycloak CR, CNPG database and supporting policies/secrets. The operator and
# CRDs are installed by the `keycloak-operator` app into the same namespace; if
# this app syncs first the Keycloak CR fails until the CRD exists, and the retry
# below covers it. Postgres, Keycloak and the operator share the `keycloak`
# namespace (labels and creation owned by keycloak-operator).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  labels:
    category: identity
spec:
  project: default
  source:
    repoURL: https://github.com/mainman94/multi-k8s-infra
    targetRevision: HEAD
    path: "eggenberg-talos-cluster-1/argocd-apps-configuration/keycloak"
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
