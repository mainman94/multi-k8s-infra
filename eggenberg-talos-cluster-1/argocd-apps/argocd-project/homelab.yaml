# Every Application except the root app-of-apps runs in this project. It pins
# the two things a typo or a stray manifest could otherwise get wrong: where
# manifests may come from and which cluster they may land on.
#
# A new chart repo must be added to sourceRepos before its Application syncs.
# Namespaces and cluster-scoped kinds are left open on purpose: charts here
# install CRDs, webhooks and RBAC, and the full namespace list is not
# something this file can verify without the cluster.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
  annotations:
    # Applications that name this project fail until it exists.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  description: Talos homelab apps
  sourceRepos:
    - https://github.com/mainman94/multi-k8s-infra
    - https://github.com/mainman94/multi-k8s-infra/
    - https://github.com/kubernetes-sigs/gateway-api
    - ghcr.io/akuity/kargo-charts
    - ghcr.io/mainman94/charts
    - oci://ghcr.io/spegel-org/helm-charts/spegel
    - https://aquasecurity.github.io/helm-charts/
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://charts.longhorn.io
    - https://cloudnative-pg.io/charts
    - https://community-charts.github.io/helm-charts
    - https://falcosecurity.github.io/charts
    - https://helm.cilium.io/
    - https://kedacore.github.io/charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://kubernetes.github.io/autoscaler
    - https://kyverno.github.io/kyverno/
    - https://opensource.ncsa.illinois.edu/charts/
    - https://prometheus-community.github.io/helm-charts
    - https://victoriametrics.github.io/helm-charts/
    - https://vmware-tanzu.github.io/helm-charts
    - https://zotregistry.dev/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
