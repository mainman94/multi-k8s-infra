apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-workflows
  namespace: argocd
  labels:
    category: deployment
spec:
  project: homelab
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 2.0.14
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/argo-workflows/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
