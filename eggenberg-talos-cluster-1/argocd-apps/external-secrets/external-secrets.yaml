# yamllint disable rule:line-length
# External Secrets Operator. Installs ESO plus a ClusterSecretStore pointing at
# the self-hosted OpenBao instance and applies the ExternalSecret manifests that
# materialize workload Secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    category: security
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.7.0
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/external-secrets/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/mainman94/multi-k8s-infra/
      path: "eggenberg-talos-cluster-1/argocd-apps-configuration/external-secrets"
      targetRevision: HEAD
      directory:
        # Apply the store + ExternalSecret manifests; the sibling values.yaml is
        # a Helm input, not a manifest.
        include: "{clustersecretstore.yaml,*-externalsecrets.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ClusterSecretStore CRD is installed by this same app; tolerate the
      # ordering gap on first sync.
      - SkipDryRunOnMissingResource=true
      # ESO CRDs are too large for client-side apply: the full manifest
      # overflows the 256KB last-applied-configuration annotation. Server-side
      # apply skips that annotation entirely.
      - ServerSideApply=true
    # yamllint enable rule:line-length
