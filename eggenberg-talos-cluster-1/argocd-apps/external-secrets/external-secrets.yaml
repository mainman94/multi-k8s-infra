# yamllint disable rule:line-length
# External Secrets Operator. Runs alongside Infisical (does NOT replace it yet):
# installs ESO + a ClusterSecretStore pointing at the self-hosted OpenBao
# (http://192.168.0.129:30020). No ExternalSecrets are defined yet, so no
# managed Secrets collide with the Infisical operator. Same multi-source
# helm+config pattern as the infisical app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    category: security
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.7.0
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/external-secrets/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/mainman94/multi-k8s-infra/
      path: "eggenberg-talos-cluster-1/argocd-apps-configuration/external-secrets"
      targetRevision: HEAD
      directory:
        # Only apply the CR; the sibling values.yaml is a Helm input, not a manifest.
        include: "clustersecretstore.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ClusterSecretStore CRD is installed by this same app; tolerate the
      # ordering gap on first sync.
      - SkipDryRunOnMissingResource=true
    # yamllint enable rule:line-length
