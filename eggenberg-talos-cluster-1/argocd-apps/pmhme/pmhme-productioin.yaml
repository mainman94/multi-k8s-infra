# yamllint disable rule:line-length
# Production runs the pmhme Helm chart (published to GHCR by mainman94/portfolio).
# The Kargo `prod` stage owns two things: the chart version (targetRevision of
# the first source) and the image tags in production/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pmhme-portfolio-prod
  namespace: argocd
  labels:
    category: app
  annotations:
    kargo.akuity.io/authorized-stage: portfolio-kargo:prod
spec:
  project: default
  sources:
    - repoURL: ghcr.io/mainman94/charts
      chart: pmhme
      targetRevision: 0.1.0
      helm:
        releaseName: pmhme
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme-chart/production/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      name: portfolio-app
      namespace: portfolio
      jsonPointers:
        - /spec/template/spec/containers/0/resources
    - group: argoproj.io
      kind: Rollout
      name: contact-api
      namespace: portfolio
      jsonPointers:
        - /spec/replicas
        - /spec/template/spec/containers/0/resources
      # yamllint enable rule:line-length
