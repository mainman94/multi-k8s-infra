# yamllint disable rule:line-length
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pmhme-portfolio-dev
  namespace: argocd
  labels:
    category: app
  annotations:
    kargo.akuity.io/authorized-stage: pmhme-portfolio:dev
spec:
  project: default
  sources:
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      path: "eggenberg-talos-cluster-1/argocd-apps-configuration/pmhme/overlays/dev"
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      name: portfolio-app
      namespace: portfolio-dev
      jsonPointers:
        - /spec/template/spec/containers/0/resources
      # yamllint enable rule:line-length
