apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-k8s-stack
  namespace: argocd
  labels:
    category: monitoring
  annotations:
    # sync-wave 1: after prometheus-operator-crds (wave 0), whose CRDs the
    # operator's serviceMonitor + Prometheus-CRD converter depend on.
    argocd.argoproj.io/sync-wave: "1"
spec:
  # yamllint disable rule:line-length
  project: homelab
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      targetRevision: 0.95.2
      chart: victoria-metrics-k8s-stack
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/victoria-metrics-k8s-stack/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      ref: values
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      path: "eggenberg-talos-cluster-1/argocd-apps-configuration/victoria-metrics-k8s-stack"
  destination:
    server: https://kubernetes.default.svc
    namespace: victoria-metrics-k8s-stack
  # The chart renders a fresh random Grafana admin password and a fresh webhook CA
  # on every `helm template`, so each render differed from live: perpetual drift
  # and a Grafana rollout (checksum/secret annotation) on every sync. Ignore the
  # generated values and keep what is in the cluster.
  ignoreDifferences:
    - kind: Secret
      name: victoria-metrics-k8s-stack-grafana
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: victoria-metrics-k8s-stack-grafana
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
    - kind: Secret
      name: victoria-metrics-k8s-stack-victoria-metrics-operator-validation
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: victoria-metrics-k8s-stack-victoria-metrics-operator-admission
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        # prometheus-node-exporter's DaemonSet needs hostNetwork/hostPID/hostPath
        # to read host /proc and /sys; PSS baseline (the namespace default)
        # rejects that. Same reasoning as splunk-otel-collector before it.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Without this the ignored fields are still overwritten whenever a sync applies the resource.
      - RespectIgnoreDifferences=true
    # yamllint enable rule:line-length
