apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    category: infrastructure
spec:
  project: homelab
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.3
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/bootstrap/cilium/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      ref: values
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      path: "eggenberg-talos-cluster-1/bootstrap/cilium"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    # Ignore auto-generated TLS certificates
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
