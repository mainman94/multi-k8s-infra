# CloudNativePG operator. Cluster-scoped; installs the postgresql.cnpg.io CRDs
# consumed by the pmhme contact-postgres Cluster. Third source applies the
# dedicated longhorn-cnpg StorageClass (single-owner cluster-scoped resource).
# Fourth source is the Barman Cloud plugin (backups to object storage); it must
# run in the operator's namespace, and its chart version tracks the plugin
# release (0.8.1 = v0.15.1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  labels:
    category: storage
spec:
  project: homelab
  sources:
    - repoURL: https://cloudnative-pg.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/cloudnative-pg/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      ref: values
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: main
      path: "eggenberg-talos-cluster-1/argocd-apps-configuration/cloudnative-pg"
      directory:
        # Apply the StorageClass; the sibling values.yaml is a Helm input.
        include: "storageclass-longhorn-cnpg.yaml"
    - repoURL: https://cloudnative-pg.io/charts
      chart: plugin-barman-cloud
      targetRevision: 0.8.1
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/cloudnative-pg/plugin-barman-cloud/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
