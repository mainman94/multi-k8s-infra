apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mainman94/multi-k8s-infra
    targetRevision: HEAD
    path: eggenberg-talos-cluster-1/argocd-apps-configuration/kargo/pmhme-portfolio
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
