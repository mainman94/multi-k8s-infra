apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: splunk-otel-collector
  namespace: argocd
  labels:
    category: monitoring
spec:
  # yamllint disable rule:line-length
  project: default
  sources:
    - repoURL: https://signalfx.github.io/splunk-otel-collector-chart
      targetRevision: 0.160.0
      chart: splunk-otel-collector
      helm:
        valueFiles:
          - $values/eggenberg-talos-cluster-1/argocd-apps-configuration/splunk-otel-collector/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: HEAD
      path: "eggenberg-talos-cluster-1/argocd-apps-configuration/splunk-otel-collector"
  destination:
    server: https://kubernetes.default.svc
    namespace: splunk-otel-collector
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        # The agent DaemonSet needs hostNetwork/hostPath/hostPort to collect
        # host-level metrics; PSS baseline (the namespace default) rejects that.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # yamllint enable rule:line-length
