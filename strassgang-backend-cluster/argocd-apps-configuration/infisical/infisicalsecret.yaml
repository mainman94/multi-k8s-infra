# yamllint disable rule:line-length
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisicalsecret
  namespace: infisical-secrets-operator
spec:
  hostAPI: https://eu.infisical.com/api
  resyncInterval: 10
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-graz
        envSlug: prod
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical-secrets-operator
        # yamllint disable rule:line-length
  managedKubeSecretReferences:
    - secretName: managed-secret
      secretNamespace: infisical-secrets-operator
      creationPolicy: "managed"
    - secretName: cloudflare-api-token
      secretNamespace: traefik
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          CF_DNS_API_TOKEN: "{{ .CLOUDFLARE_API_KEY.Value }}"
    - secretName: cloudflare-tunnel-secret
      secretNamespace: cloudflared
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          credentials.json: |-
            {
              "AccountTag": "{{ .CLOUDFLARE_ACCOUNT_ID.Value }}",
              "TunnelID": "{{ .CLOUDFLARE_TUNNEL_STRASSGANG_ID.Value }}",
              "TunnelSecret": "{{ .CLOUDFLARE_TUNNEL_STRASSGANG_SECRET.Value }}"
            }
          cert.pem: "{{ .CLOUDFLARE_TUNNEL_STRASSGANG_CERTIFICATE.Value }}"
    - secretName: operator-oauth
      secretNamespace: tailscale
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          client_id: "{{ .TAILSCALE_CLIENT_ID_STRASSGANG_CLUSTER.Value }}"
          client_secret: "{{ .TAILSCALE_CLIENT_SECRET_STRASSGANG_CLUSTER.Value }}"
    - secretName: s3-admin
      secretNamespace: seaweedfs
      creationPolicy: "managed"
      template:
        includeAllSecrets: false
        data:
          admin_access_key_id: "{{ .SEAWEEDFS_S3_ADMIN_ACCESS_KEY_ID.Value }}"
          admin_secret_access_key: "{{ .SEAWEEDFS_S3_ADMIN_ACCESS_KEY.Value }}"
          seaweedfs_s3_config: '{"identities":[{"name":"anvAdmin","credentials":[{"accessKey":"{{ .SEAWEEDFS_S3_ADMIN_ACCESS_KEY_ID.Value }}","secretKey":"{{ .SEAWEEDFS_S3_ADMIN_ACCESS_KEY.Value }}"}],"actions":["Admin","Read","Write"]}]}'
          # yamllint enable rule:line-length
