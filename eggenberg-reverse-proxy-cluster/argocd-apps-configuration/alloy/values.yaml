alloy:
  extraEnv:
    - name: CLOUD_USER_LOKI
      value: "1183961"
    - name: CLOUD_TOKEN
      valueFrom:
        secretKeyRef:
          name: grafana-cloud-creds
          key: GRAFANA_CLOUD_TOKEN

  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods_running" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
      }

      loki.process "sanitize_for_cloud" {
        forward_to = [loki.write.grafana_cloud.receiver]

        stage.drop {
          older_than          = "168h"
          drop_counter_reason = "too_old_for_grafana_cloud"
        }
      }

      loki.source.kubernetes "local_logs" {
        targets    = discovery.relabel.pods_running.output
        forward_to = [loki.process.sanitize_for_cloud.receiver]
      }

      loki.write "grafana_cloud" {
        endpoint {
          url = "https://logs-prod-012.grafana.net/loki/api/v1/push"
          basic_auth {
            username = sys.env("CLOUD_USER_LOKI")
            password = sys.env("CLOUD_TOKEN")
          }
        }
      }

controller:
  type: daemonset
