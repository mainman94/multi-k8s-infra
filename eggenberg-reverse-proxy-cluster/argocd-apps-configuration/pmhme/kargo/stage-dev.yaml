apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: pmhme
spec:
  # Dev subscribes to warehouse but Image Updater also writes here
  # Kargo will track the current state and promote to test when healthy
  subscriptions:
    warehouse: pmhme-warehouse
  promotionMechanisms:
    argoCDAppUpdates:
      - appName: pmhme-portfolio-dev
        appNamespace: argocd
  verification:
    analysisTemplates:
      - name: portfolio-http-check
    args:
      - name: service-name
        value: portfolio-service
      - name: namespace
        value: portfolio-dev
