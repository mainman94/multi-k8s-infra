apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio-app-netpol
  namespace: portfolio
spec:
  podSelector:
    matchLabels:
      app: portfolio-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
    # Allow traffic from pods in the same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow traffic within the same namespace
    - to:
        - podSelector: {}
    # Allow DNS resolution to kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # Allow HTTP/HTTPS traffic for external requests
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
