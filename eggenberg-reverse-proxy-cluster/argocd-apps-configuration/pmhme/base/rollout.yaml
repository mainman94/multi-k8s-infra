apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: portfolio-app
  namespace: portfolio
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: "portfolio-app"
  template:
    metadata:
      labels:
        app: "portfolio-app"
        version: "v1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: portfolio-app
          image: dockerha08/pmhme
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 3001
              name: metrics
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      imagePullSecrets:
        - name: docker-pull-secret
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
  strategy:
    blueGreen:
      activeService: portfolio-service
      previewService: portfolio-service-preview
      autoPromotionEnabled: true
      autoPromotionSeconds: 60
      scaleDownDelaySeconds: 60
      prePromotionAnalysis:
        templates:
          - templateName: portfolio-http-check
        args:
          - name: service-name
            value: portfolio-service-preview
      postPromotionAnalysis:
        templates:
          - templateName: portfolio-http-check
        args:
          - name: service-name
            value: portfolio-service
