apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: portfolio-app
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "portfolio-app"
  template:
    metadata:
      labels:
        app: "portfolio-app"
    spec:
      containers:
        - name: portfolio-app
          image: dockerha08/pmhme
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      imagePullSecrets:
        - name: docker-pull-secret
  strategy:
    blueGreen:
      activeService: portfolio-service
      previewService: portfolio-service-preview
      autoPromotionEnabled: true
      prePromotionAnalysis:
        templates:
          - templateName: portfolio-http-check
        args:
          - name: service-name
            value: portfolio-service-preview
