# Argo Workflows Server Configuration
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - argo-workflows-rp.hauptmann.dev
    annotations:
      traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare

  # SSO via ArgoCD's Dex server (reuses existing Authentik config)
  authModes:
    - sso
  sso:
    enabled: true
    issuer: https://argo-rp.hauptmann.dev/api/dex
    clientId:
      name: argo-workflows-sso
      key: client-id
    clientSecret:
      name: argo-workflows-sso
      key: client-secret
    redirectUrl: https://argo-workflows-rp.hauptmann.dev/oauth2/callback
    scopes:
      - openid
      - profile
      - email
      - groups
    # Group-based RBAC - maps SSO groups to ServiceAccounts
    rbac:
      enabled: true

# Controller Configuration
controller:
  metricsConfig:
    enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# Extra K8s manifests for SSO RBAC
extraObjects:
  # ServiceAccount for Admins
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argo-workflows-admin-sa
      namespace: argocd
      annotations:
        workflows.argoproj.io/rbac-rule: "'ArgoCD Admins' in groups"
        workflows.argoproj.io/rbac-rule-precedence: "1"

  # ServiceAccount for Users (readonly)
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argo-workflows-user-sa
      namespace: argocd
      annotations:
        workflows.argoproj.io/rbac-rule: "'ArgoCD Users' in groups"
        workflows.argoproj.io/rbac-rule-precedence: "2"

  # ClusterRole for admin access
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: argo-workflows-admin
    rules:
      - apiGroups: [""]
        resources: ["pods", "pods/log", "pods/exec"]
        verbs: ["get", "list", "watch", "create", "delete"]
      - apiGroups: ["argoproj.io"]
        resources: ["workflows", "workflowtemplates", "cronworkflows", "clusterworkflowtemplates", "workfloweventbindings", "workflowtaskresults"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["argoproj.io"]
        resources: ["eventsources", "sensors"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ClusterRole for read-only access
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: argo-workflows-readonly
    rules:
      - apiGroups: [""]
        resources: ["pods", "pods/log"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["argoproj.io"]
        resources: ["workflows", "workflowtemplates", "cronworkflows", "clusterworkflowtemplates"]
        verbs: ["get", "list", "watch"]

  # Bind admin ServiceAccount to admin ClusterRole
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: argo-workflows-admin-sa-binding
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argo-workflows-admin
    subjects:
      - kind: ServiceAccount
        name: argo-workflows-admin-sa
        namespace: argocd

  # Bind user ServiceAccount to readonly ClusterRole
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: argo-workflows-user-sa-binding
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argo-workflows-readonly
    subjects:
      - kind: ServiceAccount
        name: argo-workflows-user-sa
        namespace: argocd
