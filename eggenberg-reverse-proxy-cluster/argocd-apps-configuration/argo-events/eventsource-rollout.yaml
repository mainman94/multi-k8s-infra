# EventSource - watches for Argo Rollout phase changes
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: rollout-completed
  namespace: argocd
spec:
  eventBusName: default
  template:
    serviceAccountName: argo-events-sa
  resource:
    rollouts:
      namespace: ""  # Watch all namespaces
      group: argoproj.io
      version: v1alpha1
      resource: rollouts
      eventTypes:
        - UPDATE
      filter:
        # Only trigger when rollout phase CHANGES to "Healthy"
        beforeEventData:
          - path: body.status.phase
            type: string
            comparator: "!="
            value:
              - "Healthy"
        afterEventData:
          - path: body.status.phase
            type: string
            value:
              - "Healthy"
