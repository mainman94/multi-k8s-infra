# ServiceAccount for Argo Events Sensor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-events-sa
  namespace: argocd
---
# ClusterRole for watching Rollouts across all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-events-rollout-watcher
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-events-rollout-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-events-rollout-watcher
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: argocd
