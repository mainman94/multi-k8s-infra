# kube-vip Helm Chart values
# https://kube-vip.io/docs/installation/helm/
config:
  address: "192.168.0.140"
# Environment flags for kube-vip
# See: https://kube-vip.io/docs/installation/flags/
env:
  vip_interface: "enp0s31f6"
  vip_arp: "true"
  vip_subnet: "24"
  lb_port: "6443"
  lease_duration: "30"
  renew_deadline: "20"
  retry_period: "5"
  # Control-plane VIP
  cp_enable: "true"
  vip_leaderelection: "true"
  # Disable kube-vip service load-balancer to avoid conflicts with Cilium LB.
  lb_enable: "true"
  svc_enable: "true"
  #svc_election: "true"

  prometheus_server: ":2112"
podMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

