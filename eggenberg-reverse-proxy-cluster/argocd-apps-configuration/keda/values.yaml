# KEDA Helm Chart Values
# https://github.com/kedacore/charts/tree/main/keda

# Operator configuration
operator:
  replicaCount: 1

# Metrics server configuration
metricsServer:
  replicaCount: 1

# Webhooks configuration
webhooks:
  replicaCount: 1

# Resource limits
resources:
  operator:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metricServer:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  webhooks:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Prometheus metrics
prometheus:
  metricServer:
    enabled: true
    port: 8080
    portName: metrics
    serviceMonitor:
      enabled: true
  webhooks:
    enabled: true
    port: 8080
    portName: metrics
    serviceMonitor:
      enabled: true
  operator:
    enabled: true
    port: 8080
    portName: metrics
    serviceMonitor:
      enabled: true
