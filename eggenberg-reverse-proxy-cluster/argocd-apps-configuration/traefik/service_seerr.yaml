apiVersion: v1
kind: Service
metadata:
  name: seerr-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: seerr
spec:
  ports:
    - port: 30357
      targetPort: 30357
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: seerr-external-1
  namespace: traefik
  labels:
    app.kubernetes.io/name: seerr
    kubernetes.io/service-name: seerr-external
    endpointslice.kubernetes.io/managed-by: staff
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 30357
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`seerr.hauptmann.dev`)
      middlewares:
        - name: default-secure-chain
      kind: Rule
      services:
        - name: seerr-external
          port: 30357
          passHostHeader: true
  tls:
    store:
      name: default
