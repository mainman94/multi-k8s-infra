apiVersion: v1
kind: Service
metadata:
  name: authentik-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: authentik
spec:
  ports:
    - port: 30140
      targetPort: 30140
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: authentik-external-1
  namespace: traefik
  labels:
    app.kubernetes.io/name: authentik
    kubernetes.io/service-name: authentik-external
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 30140
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.hauptmann.dev`)
      middlewares:
        - name: default-secure-chain
      kind: Rule
      services:
        - name: authentik-external
          port: 30140
          passHostHeader: true
  tls:
    store:
      name: default
