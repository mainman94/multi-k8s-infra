apiVersion: v1
kind: Service
metadata:
  name: firefly-iii-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: firefly-iii
spec:
  type: ExternalName
  externalName: 192.168.0.129
  ports:
    - port: 30666
      targetPort: 30666
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: firefly-iii-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`firefly-iii.hauptmann.dev`)
      middlewares:
        - name: ratelimit
        - name: cloudflare-ip-whitelist
        - name: secure-headers
      kind: Rule
      services:
        - name: firefly-iii-external
          port: 30666
          passHostHeader: true
  tls:
    store:
      name: default
