apiVersion: v1
kind: Service
metadata:
  name: swiparr-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: swiparr
spec:
  ports:
    - port: 4321
      targetPort: 4321
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: swiparr-external-1
  namespace: traefik
  labels:
    app.kubernetes.io/name: swiparr
    kubernetes.io/service-name: swiparr-external
    endpointslice.kubernetes.io/managed-by: staff
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 4321
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: swiparr-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`swiparr.hauptmann.dev`)
      middlewares:
        - name: default-secure-chain
      kind: Rule
      services:
        - name: swiparr-external
          port: 4321
          passHostHeader: true
  tls:
    store:
      name: default
