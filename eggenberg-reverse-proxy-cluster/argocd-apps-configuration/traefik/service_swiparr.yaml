apiVersion: v1
kind: Service
metadata:
  name: swiparr-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: swiparr
spec:
  type: ExternalName
  externalName: 192.168.0.129
  ports:
    - port: 30025
      targetPort: 4321
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: swiparr-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`swiparr.hauptmann.dev`)
      middlewares:
        - name: ratelimit
        - name: cloudflare-ip-whitelist
        - name: secure-headers
      kind: Rule
      services:
        - name: swiparr-external
          port: 4321
          passHostHeader: true
  tls:
    certResolver: cloudflare
