apiVersion: v1
kind: Service
metadata:
  name: navidrome-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: navidrome
spec:
  type: ExternalName
  externalName: 192.168.0.129
  ports:
    - port: 30043
      targetPort: 30043
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`navidrome.hauptmann.dev`)
      middlewares:
        - name: ratelimit
        - name: cloudflare-ip-whitelist
        - name: secure-headers
      kind: Rule
      services:
        - name: navidrome-external
          port: 30043
          passHostHeader: true
  tls:
    store:
      name: default
