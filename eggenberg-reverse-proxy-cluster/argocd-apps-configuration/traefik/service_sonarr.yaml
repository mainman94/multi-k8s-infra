apiVersion: v1
kind: Service
metadata:
  name: sonarr-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: sonarr
spec:
  ports:
    - port: 30113
      targetPort: 30113
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: sonarr-external-1
  namespace: traefik
  labels:
    app.kubernetes.io/name: sonarr
    kubernetes.io/service-name: sonarr-external
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 30113
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.hauptmann.dev`)
      middlewares:
        - name: default-secure-chain
      kind: Rule
      services:
        - name: sonarr-external
          port: 30113
          passHostHeader: true
  tls:
    store:
      name: default
