apiVersion: v1
kind: Service
metadata:
  name: n8n-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: n8n
spec:
  ports:
    - port: 30109
      targetPort: 30109
      protocol: TCP
      name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: n8n-external-1
  namespace: traefik
  labels:
    app.kubernetes.io/name: n8n
    kubernetes.io/service-name: n8n-external
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 30109
endpoints:
  - addresses:
      - 192.168.0.129
    conditions: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`n8n.hauptmann.dev`)
      middlewares:
        - name: default-secure-chain
      kind: Rule
      services:
        - name: n8n-external
          port: 30109
          passHostHeader: true
  tls:
    store:
      name: default
