apiVersion: v1
kind: Service
metadata:
  name: bambuddy-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: bambuddy
spec:
  type: ExternalName
  externalName: 192.168.0.129
  ports:
    - port: 30669
      targetPort: 30669
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bambuddy-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`bambuddy.hauptmann.dev`)
      middlewares:
        - name: default-secure-chain
      kind: Rule
      services:
        - name: bambuddy-external
          port: 30669
          passHostHeader: true
  tls:
    store:
      name: default
