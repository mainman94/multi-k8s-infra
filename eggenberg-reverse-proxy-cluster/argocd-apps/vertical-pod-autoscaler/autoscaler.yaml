# yamllint disable rule:line-length
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vertical-pod-autoscaler
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: vertical-pod-autoscaler
      targetRevision: 0.8.1
      helm:
        valueFiles:
          - $values/eggenberg-reverse-proxy-cluster/argocd-apps-configuration/vertical-pod-autoscaler/values.yaml
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/mainman94/multi-k8s-infra
      path: eggenberg-reverse-proxy-cluster/argocd-apps-configuration/vertical-pod-autoscaler
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: autoscaler
  ignoreDifferences:
    # Ignore auto-generated TLS certificates
    - group: ""
      kind: Secret
      name: vpa-tls-certs
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # yamllint ensable rule:line-length
