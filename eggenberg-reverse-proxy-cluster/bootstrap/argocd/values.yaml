applicationSet:
  metrics:
    enabled: true
    service:
      portName: http-metrics
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
server:
  metrics:
    enabled: true
    service:
      portName: http-metrics
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        release: kube-prometheus-stack
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argo-rp.hauptmann.dev
    path: /
    pathType: Prefix
    annotations:
      traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
global:
  domain: argo-rp.hauptmann.dev
# yamllint disable rule:line-length
configs:
  params:
    server.insecure: true
    timeout.reconciliation: 30s
  cm:
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jsonPointers:
      - /spec/preserveUnknownFields
    # Dex/Authentik OIDC
    url: https://argo-rp.hauptmann.dev
    dex.config: |
      connectors:
        - type: oidc
          id: authentik
          name: Authentik
          config:
            issuer: https://auth.hauptmann.dev/application/o/argo-cd/
            clientID: '$argocd-dex-authentik:DEX_AUTHENTIK_CLIENT_ID'
            clientSecret: '$argocd-dex-authentik:DEX_AUTHENTIK_CLIENT_SECRET'
            insecureEnableGroups: true
            scopes:
              - openid
              - profile
              - email
              - groups
      # Static client for Argo Workflows SSO
      staticClients:
        - id: argo-workflows
          name: Argo Workflows
          redirectURIs:
            - https://argo-workflows-rp.hauptmann.dev/oauth2/callback
          secretEnv: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
  rbac:
    policy.csv: |
      # Authentik ArgoCD Admin group has full admin privileges
      g, ArgoCD Admin, role:admin
      # Authentik ArgoCD Users group has read-only access
      g, ArgoCD Users, role:readonly
    policy.default: role:readonly
    scopes: "[groups, email]"
  secret:
    argocdServerAdminPasswordMtime: "2024-01-01T00:00:00Z"
# yamllint enable rule:line-length

redis:
  metrics:
    enabled: true
    service:
      portName: http-metrics
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
controller:
  metrics:
    enabled: true
    service:
      portName: http-metrics
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
repoServer:
  metrics:
    enabled: true
    service:
      portName: http-metrics
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
dex:
  enabled: true
  env:
    - name: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: argocd-dex-authentik
          key: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
  metrics:
    enabled: true
    service:
      portName: http-metrics
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
