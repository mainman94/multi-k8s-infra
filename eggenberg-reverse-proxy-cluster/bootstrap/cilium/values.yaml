kubeProxyReplacement: true
ipam:
  operator.clusterPoolIPv4PodCIDRList: "10.42.0.0/16"
  mode: kubernetes

k8sServiceHost: 192.168.0.140
k8sServicePort: 6443

directRoutingDevice: "enp0s31f6"

loadBalancer:
  enabled: true

operator:
  replicas: 1

devices: "enp0s31f6+"

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

prometheus:
  metricsService: true
  enabled: true
  port: 9962
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
